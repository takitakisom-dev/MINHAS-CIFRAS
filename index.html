<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINHAS CIFRAS</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#e07a2c"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f3ece0;color:#2a211a;font-family:Inter,sans-serif}header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #e8ddd0}.btn{border:1px solid #ddd5c8;background:#fff;color:#2a211a;padding:9px 14px;border-radius:100px;font-weight:700;font-size:12px;cursor:pointer}.btn-black{background:#1a1611;color:#fff;border-color:#1a1611}#btnInst{background:#d97706;color:#fff;border:none;padding:14px;border-radius:100px;font-weight:800;width:calc(100% - 20px);margin:10px auto;display:block}.card{margin:10px;background:#fff;border:1px solid #e8ddd0;border-radius:16px;padding:12px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tab{white-space:nowrap;padding:9px 13px;border-radius:100px;border:1px solid #e8ddd0;background:#f8f3eb;color:#5a4d3d;font-size:12px;font-weight:700;cursor:pointer}.tab.on{background:#1a1611;color:#fff;border-color:#1a1611}.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px}.chip{padding:7px 12px;border-radius:100px;border:1px solid #e8ddd0;background:#fff;color:#6b5d4d;font-size:11px;cursor:pointer;white-space:nowrap}.chip.on{background:#1a1611;color:#fff;border-color:#1a1611}#lista{margin-top:12px;text-align:center;color:#8a7a6a;padding:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:100;padding:10px}.modal.on{display:flex}.box{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #e8ddd0;background:#fffaf3;color:#1a1611;margin:5px 0}.repCheck{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.repOpt{padding:6px 10px;border-radius:100px;border:1px solid #e8ddd0;font-size:11px;cursor:pointer;background:#fff}.repOpt.on{background:#d97706;color:#fff;border-color:#d97706}</style></head><body>
<header><button class="btn" onclick="mMenu.classList.add('on')">☰</button><div style="font-weight:800">◍ MINHAS CIFRAS</div><span class="btn btn-black" id="tot">0</span></header>
<button id="btnInst">📲 INSTALAR APP</button>
<div class="card"><div class="tabs" id="tabsRep"></div><div style="display:flex;gap:6px;margin-top:10px"><input id="busca" placeholder="Buscar..." style="flex:1" oninput="render()"><button class="btn btn-black" onclick="nova()">+ Nova</button></div><div class="chips" id="filtEst"></div><div id="lista">Nenhuma música</div></div>
<div id="mMenu" class="modal"><div class="box"><h3>Repertórios (5)</h3><div id="editReps"></div><button class="btn" style="width:100%;margin-top:10px" onclick="mMenu.classList.remove('on')">Fechar</button></div></div>
<div id="mNova" class="modal"><div class="box"><h3>Nova música</h3><input id="nT" placeholder="Nome*"><input id="nA" placeholder="Artista"><select id="nEst"><option value="">Estilo...</option><option>MPB</option><option>ROCK NACIONAL</option><option>ROCK INTERNACIONAL</option><option>FORRÓ</option><option>REGGAE</option><option>SAMBA</option><option>PAGODE</option><option>ESTILO DO MUSICO</option><option>FUNK</option></select><div class="repCheck" id="nReps"></div><textarea id="nC" rows="10" placeholder="Cifra..."></textarea><button class="btn" style="width:100%;padding:12px;background:#d97706;color:#fff;border:none;font-weight:800" onclick="salvar()">Salvar</button><button class="btn" style="width:100%;margin-top:6px" onclick="mNova.classList.remove('on')">Cancelar</button></div></div>
<script>
let pInst=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();pInst=e;});document.getElementById('btnInst').onclick=()=>{if(pInst)pInst.prompt();else alert('3 pontinhos > Instalar');};
const ESTILOS=['TODOS','MPB','ROCK NACIONAL','ROCK INTERNACIONAL','FORRÓ','REGGAE','SAMBA','PAGODE','ESTILO DO MUSICO','FUNK'];
let reps=JSON.parse(localStorage.getItem('reps')||'["Rep 1","Rep 2","Rep 3","Rep 4","Rep 5"]');
let cifras=JSON.parse(localStorage.getItem('cifrasV59')||localStorage.getItem('minhasCifras')||'[]');
let filtroRep='TODAS',filtroEst='TODOS';let save=()=>{localStorage.setItem('cifrasV59',JSON.stringify(cifras));localStorage.setItem('reps',JSON.stringify(reps));};
function buildTabs(){let h=`<button class="tab ${filtroRep=='TODAS'?'on':''}" onclick="setRep('TODAS')">Minhas músicas (${cifras.length})</button>`;reps.forEach((r,i)=>{let q=cifras.filter(c=>c.reps&&c.reps.includes(i)).length;h+=`<button class="tab ${filtroRep==i?'on':''}" onclick="setRep(${i})">📚 ${r} (${q})</button>`;});document.getElementById('tabsRep').innerHTML=h;let eh=`<button class="chip ${filtroEst=='TODOS'?'on':''}" onclick="setEst('TODOS')">TODOS</button>`;ESTILOS.slice(1).forEach(e=>{eh+=`<button class="chip ${filtroEst==e?'on':''}" onclick="setEst('${e}')">${e}</button>`;});document.getElementById('filtEst').innerHTML=eh;document.getElementById('editReps').innerHTML=reps.map((r,i)=>`<div style="display:flex;gap:6px;margin:6px 0"><input id="r${i}" value="${r}" style="flex:1"><button class="btn btn-black" onclick="renRep(${i})">OK</button></div>`).join('');}
function setRep(v){filtroRep=v;buildTabs();render();}function setEst(v){filtroEst=v;buildTabs();render();}
function renRep(i){reps[i]=document.getElementById('r'+i).value||`Rep ${i+1}`;save();buildTabs();buildNovaReps();render();}
function render(){let b=document.getElementById('busca').value.toLowerCase();let f=cifras.filter(c=>{let okB=!b||c.titulo.toLowerCase().includes(b)||(c.artista||'').toLowerCase().includes(b);let okR=filtroRep=='TODAS'||(c.reps&&c.reps.includes(filtroRep));let okE=filtroEst=='TODOS'||(c.estilo||'').toUpperCase()==filtroEst;return okB&&okR&&okE;});document.getElementById('tot').innerText=f.length;if(!f.length){document.getElementById('lista').innerHTML='Nenhuma música';return;}document.getElementById('lista').innerHTML=f.map(c=>`<div style="padding:12px 0;border-bottom:1px solid #eee6d9;display:flex;justify-content:space-between" onclick="abrir(${c.id})"><div><b>${c.titulo}</b><div style="font-size:11px;opacity:.7">${c.artista||''} ${c.estilo||''}</div></div><span>›</span></div>`).join('');}
function buildNovaReps(){document.getElementById('nReps').innerHTML=reps.map((r,i)=>`<div class="repOpt" id="ro${i}" onclick="togRep(${i})">${r}</div>`).join('');}
let selReps=[];function togRep(i){let el=document.getElementById('ro'+i);if(selReps.includes(i)){selReps=selReps.filter(x=>x!=i);el.classList.remove('on');}else{selReps.push(i);el.classList.add('on');}}
function nova(){selReps=[];document.getElementById('nT').value='';document.getElementById('nA').value='';document.getElementById('nC').value='';buildNovaReps();document.getElementById('mNova').classList.add('on');}
function salvar(){if(!document.getElementById('nT').value.trim())return alert('Nome obrigatório');let estilo=document.getElementById('nEst').value;cifras.push({id:Date.now(),titulo:document.getElementById('nT').value.trim(),artista:document.getElementById('nA').value.trim(),estilo,reps:[...selReps],conteudo:document.getElementById('nC').value});save();document.getElementById('mNova').classList.remove('on');buildTabs();render();}
buildTabs();buildNovaReps();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
