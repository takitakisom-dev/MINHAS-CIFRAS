<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Cifras v45 Fix</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a2f1e;--card:#123a25;--accent:#ffeb3b}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{background:var(--bg);border-bottom:2px solid var(--accent);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:var(--accent);font-weight:bold}.btn{border:2px solid var(--accent);background:transparent;color:var(--accent);padding:7px 13px;border-radius:20px;font-weight:bold;cursor:pointer;margin:3px;font-size:13px}.btn-amarelo{background:var(--accent);color:#0a2f1e}.btn-ativo{background:var(--accent);color:#0a2f1e}
.card{background:var(--card);border:1px solid rgba(255,235,59,0.3);border-radius:14px;padding:12px;margin:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:100;padding:8px}.modal.aberto{display:flex}
.modal-box{background:#123a25;border:2px solid var(--accent);border-radius:16px;padding:16px;width:100%;max-width:680px;max-height:94vh;overflow:auto}
#boxLeitor{background:#123a25;border:2px solid var(--accent);border-radius:16px;width:98%;height:94vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topo-fixo{padding:10px;background:inherit;flex-shrink:0;border-bottom:1px solid rgba(255,235,59,0.2)}
#leitorConteudo{flex:1;overflow:auto;padding:14px;white-space:pre; /* PRE mantém espaços */ font-family:'Courier Prime',monospace;line-height:1.5;font-size:21px}
.cifra-line{font-weight:bold;margin-top:6px;white-space:pre}
.cifra-line.dourada{color:#ffeb3b!important;text-shadow:0 0 2px rgba(0,0,0,0.8)}
.cifra-line.vermelha{color:#ff4444!important}
.cifra-line.preta{color:#111!important}
.linha-letra{margin-bottom:12px;white-space:pre-wrap;font-family:'Kalam',cursive;color:inherit}
#btnOlho{position:fixed;top:10px;right:10px;z-index:99999;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.7);color:white;border:2px solid white;display:none;font-size:20px}
#boxLeitor:fullscreen{width:100vw!important;height:100vh!important;max-width:100vw!important;border:none!important;border-radius:0!important}
.input-busca{width:100%;padding:10px;border-radius:10px;border:2px solid rgba(255,235,59,0.3);background:rgba(0,0,0,0.3);color:white;margin-top:8px}
.secao{margin:12px 0;padding:12px;border:1px solid rgba(255,235,59,0.2);border-radius:10px}
.cifra-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer}
.tons{display:flex;gap:4px;overflow:auto;padding:6px 0}
textarea,input[type=text]{width:100%;padding:10px;border-radius:8px;margin:6px 0;background:#0a2f1e;color:white;border:1px solid var(--accent)}
</style>
</head>
<body>
<header><button class="btn" id="btnMenu">☰</button><div class="logo">♪ CIFRAS v45</div><button class="btn btn-amarelo" id="btnHome">Minhas (<span id="total">0</span>)</button></header>
<button id="btnOlho">👁️</button>

<div id="menuLateral" class="modal"><div class="modal-box">
<h2 style="color:var(--accent)">Menu</h2>
<div class="secao"><h4 style="color:var(--accent)">🎨 Cor da Cifra</h4><button class="btn" data-cor="dourada">Dourada (recomendada)</button><button class="btn" style="background:#ff4444;color:white" data-cor="vermelha">Vermelha</button><button class="btn" style="background:white;color:black" data-cor="preta">Preta - só no fundo branco</button></div>
<div class="secao"><h4 style="color:var(--accent)">🖼️ Fundo</h4><button class="btn" data-tema="verde">Verde</button><button class="btn" style="background:white;color:black" data-tema="branco">Branco</button><button class="btn" style="background:black;color:white" data-tema="preto">Preto</button></div>
<div class="secao"><h4 style="color:var(--accent)">🔤 Tamanho: <span id="valFonte">21</span></h4><input type="range" min="14" max="36" value="21" id="rangeFonte"></div>
<div class="secao"><h4 style="color:var(--accent)">💾 Backup</h4><button class="btn btn-amarelo" id="btnExportar" style="width:100%">EXPORTAR</button><label class="btn" style="width:100%;text-align:center;display:block;margin-top:8px">📥 IMPORTAR<input type="file" id="importFile" hidden></label><div style="margin-top:8px;font-size:12px">Total: <span id="totalBkp">0</span></div></div>
<button class="btn" id="btnFecharMenu" style="width:100%;margin-top:12px">Fechar</button>
</div></div>

<div class="card"><button class="btn btn-amarelo" id="btnNova">+ Nova Cifra</button><button class="btn" id="btnColar">📄 Colar</button><input id="busca" class="input-busca" placeholder="🔍 Buscar..."></div>
<div class="card"><h2 style="color:var(--accent)">Minhas Cifras (<span id="total2">0</span>)</h2><div id="lista"></div></div>

<div id="modalLeitor" class="modal"><div id="boxLeitor">
<div class="topo-fixo" id="topoFixo">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap"><button class="btn" id="btnVoltar">⬅ Voltar</button><button class="btn btn-amarelo" id="btnTelaCheia">⛶ Tela Cheia</button></div>
<div style="margin-top:8px"><div style="font-size:11px;color:var(--accent)">🎸 TOM - 10 variações | Original: <span id="tomOriginal">G</span> | Atual: <span id="tomAtualLabel">0 (G)</span></div><div class="tons" id="barraTons"></div></div>
<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap"><button class="btn" id="btnSimplificar">🎸 Cifra Simplificada</button><button class="btn" id="btnRola">▶️ Rolagem</button><button class="btn" id="btnAMenos">A-</button><button class="btn" id="btnAMais">A+</button></div>
<h2 id="leitorTitulo" style="color:var(--accent);margin-top:8px;font-size:15px"></h2>
</div>
<div id="leitorConteudo"></div>
</div></div>

<div id="modalEditar" class="modal"><div class="modal-box"><input id="editTitulo" type="text" placeholder="Nome"><input id="editArtista" type="text" placeholder="Artista"><textarea id="editConteudo" rows="16"></textarea><button class="btn btn-amarelo" id="btnSalvar">Salvar</button><button class="btn" id="btnCancelarEdit">Cancelar</button></div></div>
<div id="modalColar" class="modal"><div class="modal-box"><textarea id="colarTexto" rows="14" placeholder="Cole letra com cifra..."></textarea><input id="colarTitulo" type="text" placeholder="Nome"><input id="colarArtista" type="text" placeholder="Artista"><button class="btn btn-amarelo" id="btnSalvarColar">💾 Salvar</button><button class="btn" id="btnCancelarColar">Cancelar</button></div></div>

<script>
document.addEventListener('DOMContentLoaded', function(){
 let cifras=[]; try{cifras=JSON.parse(localStorage.getItem('minhasCifras_v27')||'[]');}catch(e){cifras=[];}
 let corCifra=localStorage.getItem('corCifra')||'dourada', temaAtual=localStorage.getItem('tema')||'verde', fontSize=21, tom=0, originalConteudo='', topoVisivel=true, rolando=false, intervalo=null, simplificada=false, acordeOriginal='G';
 const $=id=>document.getElementById(id);
 function salvar(){localStorage.setItem('minhasCifras_v27',JSON.stringify(cifras));}
 function renderLista(){
  const b=$('busca').value.toLowerCase();
  const f=cifras.filter(c=>c.titulo.toLowerCase().includes(b)||c.artista.toLowerCase().includes(b));
  $('total').innerText=f.length; $('total2').innerText=f.length; $('totalBkp').innerText=f.length;
  $('lista').innerHTML=f.length?f.map(c=>`<div class="cifra-item" data-id="${c.id}"><div><b>${c.titulo}</b><br><small>${c.artista}</small></div><button class="btn" style="border-color:#ff4444;color:#ff4444" data-del="${c.id}">🗑️</button></div>`).join(''):'<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.5)">Nenhuma cifra</div>';
  document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>abrirLeitor(Number(el.dataset.id))));
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation(); if(confirm('Excluir?')){cifras=cifras.filter(x=>x.id!=el.dataset.del && x.id!=Number(el.dataset.del)); salvar(); renderLista();}}));
 }
 function abrirLeitor(id){
  const c=cifras.find(x=>x.id==id); if(!c) return;
  originalConteudo=c.conteudo; tom=0; simplificada=false; $('btnSimplificar').className='btn'; $('btnSimplificar').innerText='🎸 Cifra Simplificada';
  const m=c.conteudo.match(/[A-G][#b]?/); acordeOriginal=m?m[0]:'G'; $('tomOriginal').innerText=acordeOriginal;
  criarBarraTons(); renderCifraTexto(c.conteudo); $('leitorTitulo').innerText=c.titulo+' - '+c.artista;
  $('modalLeitor').classList.add('aberto'); $('leitorConteudo').scrollTop=0; $('topoFixo').style.display='block'; topoVisivel=true;
  aplicarTema(); corrigirCorVisivel();
 }
 function criarBarraTons(){
  const cont=$('barraTons'); cont.innerHTML='';
  for(let i=-5;i<=5;i++){const btn=document.createElement('button'); btn.className=i===0?'btn btn-ativo':'btn'; btn.innerText=(i>0?'+'+i:i===0?'0':i); btn.addEventListener('click',()=>{tom=i; atualizarTons(); aplicarTransposicao();}); cont.appendChild(btn);}
  atualizarTons();
 }
 function atualizarTons(){
  $('barraTons').querySelectorAll('.btn').forEach((b,idx)=>{let v=idx-5; b.className=v===tom?'btn btn-ativo':'btn';});
  $('tomAtualLabel').innerText=(tom>0?'+'+tom:tom)+' ('+transporNota(acordeOriginal,tom)+')';
 }
 function transporNota(nota,s){const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}; let base=MAP[nota]||nota; let i=NOTAS.indexOf(base); if(i==-1) return nota; return NOTAS[(i+s+120)%12];}
 function aplicarTransposicao(){
  const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  let texto=originalConteudo.replace(/[A-G][#b]?/g,m=>{let base=MAP[m]||m; let i=NOTAS.indexOf(base); if(i==-1) return m; return NOTAS[(i+tom+120)%12];});
  if(simplificada){texto=texto.replace(/[A-G][#b]?m?(?:7M|maj7|m7|7|9|6|sus2|sus4|sus|dim|aug|add9|\(.*?\)|\/[\w#b]+)*/g,ac=>{let mm=ac.match(/^([A-G][#b]?)(m)?/); if(!mm) return ac; return mm[1]+(mm[2]||'');});}
  renderCifraTexto(texto);
 }
 function renderCifraTexto(txt){
  let html=''; txt.split('\n').forEach(l=>{if(!l.trim()){html+=`<div style="height:8px"></div>`;return;}let ehCifra=l.trim().length<90 && /[A-G]/.test(l) && l.trim().split(/\s+/).length<=10; if(ehCifra) html+=`<div class="cifra-line ${corCifra}">${l}</div>`; else html+=`<div class="linha-letra">${l}</div>`;});
  $('leitorConteudo').innerHTML=html;
 }
 function corrigirCorVisivel(){
  // SE FUNDO VERDE/PRETO E COR PRETA, FORÇA DOURADA
  if((temaAtual==='verde'||temaAtual==='preto') && corCifra==='preta'){corCifra='dourada'; localStorage.setItem('corCifra','dourada');}
  document.querySelectorAll('.cifra-line').forEach(x=>x.className='cifra-line '+corCifra);
 }
 function mudarCor(c){
  // Impede cifra preta no fundo escuro
  if((temaAtual==='verde'||temaAtual==='preto') && c==='preta'){alert('Cifra preta só funciona no fundo branco! Troquei pra dourada.'); c='dourada';}
  corCifra=c; localStorage.setItem('corCifra',c); document.querySelectorAll('.cifra-line').forEach(x=>x.className='cifra-line '+c);
 }
 function mudarTema(t){
  temaAtual=t; localStorage.setItem('tema',t);
  let bg,txt; if(t==='branco'){bg='#ffffff';txt='#000000';} else if(t==='preto'){bg='#000000';txt='#ffffff';} else {bg='#123a25';txt='#ffffff';}
  $('boxLeitor').style.background=bg; $('leitorConteudo').style.background=bg; $('leitorConteudo').style.color=txt; $('topoFixo').style.background=bg;
  // Corrige cor se necessário
  if((t==='verde'||t==='preto') && corCifra==='preta'){corCifra='dourada'; localStorage.setItem('corCifra','dourada');}
  if(t==='branco' && corCifra==='dourada'){ /* mantém */ }
  document.querySelectorAll('.cifra-line').forEach(x=>x.className='cifra-line '+corCifra);
 }

 $('btnMenu').addEventListener('click',()=>$('menuLateral').classList.add('aberto'));
 $('btnFecharMenu').addEventListener('click',()=>$('menuLateral').classList.remove('aberto'));
 $('btnHome').addEventListener('click',renderLista);
 $('busca').addEventListener('input',renderLista);
 $('btnNova').addEventListener('click',()=>{$('editTitulo').value=''; $('editArtista').value=''; $('editConteudo').value=''; $('modalEditar').classList.add('aberto');});
 $('btnColar').addEventListener('click',()=>$('modalColar').classList.add('aberto'));
 $('btnCancelarEdit').addEventListener('click',()=>$('modalEditar').classList.remove('aberto'));
 $('btnCancelarColar').addEventListener('click',()=>$('modalColar').classList.remove('aberto'));
 $('btnVoltar').addEventListener('click',()=>{$('modalLeitor').classList.remove('aberto'); $('btnOlho').style.display='none'; clearInterval(intervalo); rolando=false; if(document.fullscreenElement)document.exitFullscreen();});
 $('btnTelaCheia').addEventListener('click',()=>{if(!document.fullscreenElement){$('boxLeitor').requestFullscreen().then(()=>{$('topoFixo').style.display='none'; topoVisivel=false; $('btnOlho').style.display='block';});}else document.exitFullscreen();});
 $('btnOlho').addEventListener('click',()=>{if(topoVisivel){$('topoFixo').style.display='none'; topoVisivel=false;}else{$('topoFixo').style.display='block'; topoVisivel=true;}});
 $('btnSimplificar').addEventListener('click',()=>{simplificada=!simplificada; if(simplificada){$('btnSimplificar').className='btn btn-ativo'; $('btnSimplificar').innerText='✅ Simplificada ON';}else{$('btnSimplificar').className='btn'; $('btnSimplificar').innerText='🎸 Cifra Simplificada';} aplicarTransposicao();});
 $('btnRola').addEventListener('click',()=>{if(rolando){rolando=false; $('btnRola').innerText='▶️ Rolagem'; clearInterval(intervalo);}else{rolando=true; $('btnRola').innerText='⏸️ Parar'; intervalo=setInterval(()=>$('leitorConteudo').scrollTop+=1,110);}});
 $('btnAMenos').addEventListener('click',()=>{fontSize=Math.max(12,fontSize-1); $('leitorConteudo').style.fontSize=fontSize+'px'; $('valFonte').innerText=fontSize;});
 $('btnAMais').addEventListener('click',()=>{fontSize=Math.min(40,fontSize+1); $('leitorConteudo').style.fontSize=fontSize+'px'; $('valFonte').innerText=fontSize;});
 $('rangeFonte').addEventListener('input',e=>{fontSize=parseInt(e.target.value); $('leitorConteudo').style.fontSize=fontSize+'px'; $('valFonte').innerText=fontSize;});
 $('btnSalvar').addEventListener('click',()=>{const t=$('editTitulo').value,a=$('editArtista').value,co=$('editConteudo').value; if(!t) return alert('Nome'); cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co}); salvar(); $('modalEditar').classList.remove('aberto'); renderLista();});
 $('btnSalvarColar').addEventListener('click',()=>{const txt=$('colarTexto').value,t=$('colarTitulo').value||'IMPORTADA',a=$('colarArtista').value||'Manual'; if(!txt) return alert('Cole'); cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:txt}); salvar(); $('modalColar').classList.remove('aberto'); renderLista(); setTimeout(()=>{const id=cifras[cifras.length-1].id; const c=cifras.find(x=>x.id==id); if(c){originalConteudo=c.conteudo; $('leitorTitulo').innerText=c.titulo; renderCifraTexto(c.conteudo); $('modalLeitor').classList.add('aberto'); criarBarraTons();}},200);});
 document.querySelectorAll('[data-cor]').forEach(b=>b.addEventListener('click',()=>mudarCor(b.dataset.cor)));
 document.querySelectorAll('[data-tema]').forEach(b=>b.addEventListener('click',()=>mudarTema(b.dataset.tema)));
 $('btnExportar').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(cifras)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup_cifras.json'; a.click();});
 $('importFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{cifras=JSON.parse(r.result); salvar(); renderLista(); alert('Restaurado '+cifras.length);}catch{alert('Inválido');}}; r.readAsText(f);});
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){$('topoFixo').style.display='block'; topoVisivel=true; $('btnOlho').style.display='none';}});

 renderLista(); mudarTema(temaAtual); $('leitorConteudo').style.fontSize=fontSize+'px'; $('valFonte').innerText=fontSize;
});
</script>
</body>
</html>
