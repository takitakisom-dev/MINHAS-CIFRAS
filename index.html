<!-- BOTÃO INSTALAR INTELIGENTE - SÓ APARECE SE NÃO INSTALOU -->
<div id="boxInstalar" style="display:none;padding:12px;text-align:center;background:#fff7ed;border:2px dashed #d97706;margin:10px;border-radius:16px;">
  <button id="btnInst" style="background:#d97706;color:white;border:none;padding:12px 24px;border-radius:999px;font-weight:bold;font-size:16px;">📲 INSTALAR APP</button>
  <div style="font-size:12px;margin-top:6px;color:#92400e;">Instala e usa offline igual WhatsApp!</div>
</div>

<script>
// LÓGICA DO BOTÃO INTELIGENTE
let promptInstall = null;
const box = document.getElementById('boxInstalar');
const btn = document.getElementById('btnInst');

// 1. Se já tá instalado como app, nunca mostra
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  box.style.display = 'none';
} else {
  // 2. Espera o Chrome liberar a instalação
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    promptInstall = e;
    box.style.display = 'block'; // AGORA mostra o botão!
  });

  // 3. Se não liberar em 2s, mostra mesmo assim com tutorial
  setTimeout(() => {
    if (!promptInstall && !window.matchMedia('(display-mode: standalone)').matches) {
      box.style.display = 'block';
      btn.textContent = '📲 COMO INSTALAR';
    }
  }, 2000);
}

// 4. Clique
btn.addEventListener('click', async () => {
  if (promptInstall) {
    promptInstall.prompt();
    const choice = await promptInstall.userChoice;
    if (choice.outcome === 'accepted') {
      box.style.display = 'none'; // instalou, some!
    }
    promptInstall = null;
  } else {
    alert('Para instalar:\n\n1. Clique nos 3 pontinhos ⋮ do Chrome\n2. Clique em "Instalar app"\n3. Pronto! O botão vai sumir sozinho depois.');
  }
});

// 5. Quando instalar, some automaticamente
window.addEventListener('appinstalled', () => {
  box.style.display = 'none';
});
</script>
