<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Cifras v42 Limpo</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a2f1e;--card:#123a25;--accent:#ffeb3b}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{background:var(--bg);border-bottom:2px solid var(--accent);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:var(--accent);font-weight:bold}.btn{border:2px solid var(--accent);background:transparent;color:var(--accent);padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px}.btn-amarelo{background:var(--accent);color:#0a2f1e}.btn-ativo{background:var(--accent);color:#0a2f1e}
.card{background:var(--card);border:1px solid rgba(255,235,59,0.3);border-radius:14px;padding:12px;margin:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:100;padding:10px}.modal.aberto{display:flex}
.modal-box{background:#123a25;border:2px solid var(--accent);border-radius:16px;padding:16px;width:100%;max-width:680px;max-height:94vh;overflow:auto}
#boxLeitor{background:#123a25;border:2px solid var(--accent);border-radius:16px;width:98%;height:94vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topo-fixo{padding:10px;background:inherit;flex-shrink:0;border-bottom:1px solid rgba(255,235,59,0.2)}#leitorConteudo{flex:1;overflow:auto;padding:14px;white-space:pre-wrap;line-height:1.35;font-size:22px}
.cifra-line{font-weight:bold;margin-top:6px}.cifra-line.dourada{color:#ffeb3b}.cifra-line.vermelha{color:#ff4444}.cifra-line.preta{color:#111}
.linha-letra{margin-bottom:10px}
#btnOlho{position:fixed;top:10px;right:10px;z-index:99999;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.7);color:white;border:2px solid white;display:none;font-size:20px}
#boxLeitor:fullscreen{width:100vw!important;height:100vh!important;max-width:100vw!important;border:none!important;border-radius:0!important}
.input-busca{width:100%;padding:10px;border-radius:10px;border:2px solid rgba(255,235,59,0.3);background:rgba(0,0,0,0.3);color:white;margin-top:8px}
.secao{margin:12px 0;padding:12px;border:1px solid rgba(255,235,59,0.2);border-radius:10px}
.cifra-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer}
textarea,input[type=text]{width:100%;padding:10px;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<header><button class="btn" onclick="menuLateral.classList.add('aberto')">☰</button><div class="logo">♪ MINHAS CIFRAS v42</div><button class="btn btn-amarelo" onclick="renderLista()">Home</button></header>
<button id="btnOlho" onclick="toggleTopo()">👁️</button>

<div id="menuLateral" class="modal"><div class="modal-box">
<h2 style="color:var(--accent)">Menu</h2>

<div class="secao"><h4 style="color:var(--accent)">🎨 Cor da Cifra (em cima da letra)</h4>
<button class="btn" onclick="mudarCor('dourada')">Dourada</button>
<button class="btn" style="background:#ff4444;color:white" onclick="mudarCor('vermelha')">Vermelha</button>
<button class="btn" style="background:white;color:black" onclick="mudarCor('preta')">Preta - use com fundo branco</button>
</div>

<div class="secao"><h4 style="color:var(--accent)">🖼️ Fundo - CORRIGIDO</h4>
<button class="btn" onclick="mudarTema('verde')">Verde</button>
<button class="btn" style="background:white;color:black" onclick="mudarTema('branco')">Branco</button>
<button class="btn" style="background:black;color:white" onclick="mudarTema('preto')">Preto</button>
</div>

<div class="secao"><h4 style="color:var(--accent)">✍️ Estilo Letra</h4><button class="btn" onclick="mudarEstilo('mao')">Mão</button><button class="btn" onclick="mudarEstilo('maquina')">Máquina</button></div>
<div class="secao"><h4 style="color:var(--accent)">🔤 Tamanho: <span id="valFonte">22</span>px</h4><input type="range" min="14" max="36" value="22" id="rangeFonte" oninput="mudarFonte(this.value)"></div>

<div class="secao"><h4 style="color:var(--accent)">💾 Backup - nunca mais perde</h4>
<button class="btn btn-amarelo" style="width:100%;padding:12px" onclick="exportarBKP()">EXPORTAR BACKUP</button>
<label class="btn" style="width:100%;padding:12px;text-align:center;display:block;margin-top:8px">📥 IMPORTAR BACKUP<input type="file" id="importFile" hidden onchange="importarBKP(event)"></label>
<div style="margin-top:8px;font-size:12px">Total: <span id="totalBkp">0</span> cifras</div>
</div>

<button class="btn" style="width:100%;margin-top:12px" onclick="menuLateral.classList.remove('aberto')">Fechar Menu</button>
</div></div>

<div class="card">
<button class="btn btn-amarelo" onclick="abrirNova()">+ Nova Cifra</button>
<button class="btn" onclick="abrirColar()">📄 Colar do Cifra Club</button>
<input id="busca" class="input-busca" placeholder="🔍 Buscar..." oninput="renderLista()">
</div>

<div class="card"><h2 style="color:var(--accent)">Minhas Cifras (<span id="total">0</span>)</h2><div id="lista"></div></div>

<div id="modalLeitor" class="modal"><div id="boxLeitor">
<div class="topo-fixo" id="topoFixo">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
<button class="btn" onclick="fecharLeitor()">⬅ Voltar</button>
<div style="display:flex;align-items:center;background:rgba(0,0,0,0.4);border-radius:20px;border:1px solid var(--accent)"><button class="btn" onclick="transpor(-1)">Tom -</button><span id="tomAtual" style="color:var(--accent);padding:0 10px;font-weight:bold">0</span><button class="btn" onclick="transpor(1)">Tom +</button></div>
<button class="btn btn-amarelo" onclick="toggleTelaCheia()">⛶ Tela Cheia</button>
</div>
<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap"><button class="btn" id="btnRola" onclick="toggleRolagem()">▶️ Rolagem</button><button class="btn" onclick="mudarFonte(-1)">A-</button><button class="btn" onclick="mudarFonte(1)">A+</button></div>
<h2 id="leitorTitulo" style="color:var(--accent);margin-top:8px;font-size:15px"></h2>
</div>
<div id="leitorConteudo" onclick="handleConteudoClick()"></div>
</div></div>

<div id="modalEditar" class="modal"><div class="modal-box"><input id="editTitulo" type="text" placeholder="Nome da música"><input id="editArtista" type="text" placeholder="Artista"><textarea id="editConteudo" rows="16" placeholder="Cole aqui letra com cifra&#10;Ex:&#10; G C D&#10;Todos os dias..."></textarea><button class="btn btn-amarelo" onclick="salvarCifra()">Salvar</button><button class="btn" onclick="modalEditar.classList.remove('aberto')">Cancelar</button></div></div>
<div id="modalColar" class="modal"><div class="modal-box"><h3 style="color:var(--accent)">Colar do Cifra Club / Letras.mus</h3><p style="font-size:12px;margin:8px 0">Abra o site, copie a cifra completa e cole aqui. É 100% garantido.</p><textarea id="colarTexto" rows="14" placeholder="Cole aqui..."></textarea><input id="colarTitulo" type="text" placeholder="Nome da música"><input id="colarArtista" type="text" placeholder="Artista"><button class="btn btn-amarelo" onclick="salvarColar()">💾 Salvar</button><button class="btn" onclick="modalColar.classList.remove('aberto')">Cancelar</button></div></div>

<script>
let cifras=JSON.parse(localStorage.getItem('minhasCifras_v27')||'[]');
let editId=null,corCifra=localStorage.getItem('corCifra')||'dourada',temaAtual=localStorage.getItem('tema')||'verde',estiloAtual=localStorage.getItem('estilo')||'mao',fontSize=22,tom=0,originalConteudo='',topoVisivel=true,rolando=false,intervalo=null;
function salvar(){localStorage.setItem('minhasCifras_v27',JSON.stringify(cifras));}
function renderLista(){const b=busca.value.toLowerCase();const f=cifras.filter(c=>c.titulo.toLowerCase().includes(b)||c.artista.toLowerCase().includes(b));total.innerText=f.length;totalBkp.innerText=f.length;lista.innerHTML=f.length?f.map(c=>`<div class="cifra-item" onclick="abrirLeitor(${c.id})"><div><b>${c.titulo}</b><br><small>${c.artista}</small></div><div><button class="btn" onclick="event.stopPropagation();editarCifra(${c.id})">✏️</button><button class="btn" style="border-color:#ff4444;color:#ff4444" onclick="event.stopPropagation();excluir(${c.id})">🗑️</button></div></div>`).join(''):'<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.5)">Nenhuma cifra ainda. Clique em + Nova Cifra</div>';}
function abrirLeitor(id){const c=cifras.find(x=>x.id==id);if(!c)return;originalConteudo=c.conteudo;tom=0;tomAtual.innerText='0';leitorTitulo.innerText=c.titulo+' - '+c.artista;renderCifraTexto(c.conteudo);modalLeitor.classList.add('aberto');leitorConteudo.scrollTop=0;topoFixo.style.display='block';topoVisivel=true;aplicarTema();aplicarEstilo();}
function fecharLeitor(){modalLeitor.classList.remove('aberto');btnOlho.style.display='none';pararRolagem();if(document.fullscreenElement)document.exitFullscreen();}
function renderCifraTexto(txt){let html='';txt.split('\n').forEach(l=>{if(!l.trim()){html+=`<div style="height:6px"></div>`;return;}let ehCifra=l.trim().length<80 && /[A-G]/.test(l) && l.trim().split(/\s+/).length<=8; if(ehCifra) html+=`<div class="cifra-line ${corCifra}">${l}</div>`; else html+=`<div class="linha-letra">${l}</div>`;});leitorConteudo.innerHTML=html;}
function transpor(s){tom+=s;tomAtual.innerText=(tom>0?'+'+tom:tom);const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let texto=originalConteudo.replace(/[A-G][#b]?/g,m=>{let base=MAP[m]||m;let i=NOTAS.indexOf(base);if(i==-1)return m;return NOTAS[(i+s+120)%12];});renderCifraTexto(texto);}
function mudarCor(c){corCifra=c;localStorage.setItem('corCifra',c);document.querySelectorAll('.cifra-line').forEach(x=>x.className='cifra-line '+c);}
function mudarTema(t){temaAtual=t;localStorage.setItem('tema',t);let bg,txt;if(t==='branco'){bg='#ffffff';txt='#000000';}else if(t==='preto'){bg='#000000';txt='#ffffff';}else{bg='#123a25';txt='#ffffff';}boxLeitor.style.background=bg;leitorConteudo.style.background=bg;leitorConteudo.style.color=txt;topoFixo.style.background=bg;}
function mudarEstilo(e){estiloAtual=e;localStorage.setItem('estilo',e);aplicarEstilo();}
function aplicarEstilo(){leitorConteudo.style.fontFamily=estiloAtual==='mao'?"'Kalam',cursive":"'Courier Prime',monospace";}
function aplicarTema(){mudarTema(temaAtual);}
function mudarFonte(v){if(typeof v==='string')fontSize=parseInt(v);else fontSize+=v;fontSize=Math.max(12,Math.min(40,fontSize));leitorConteudo.style.fontSize=fontSize+'px';valFonte.innerText=fontSize;}
function toggleTopo(){if(topoVisivel){topoFixo.style.display='none';topoVisivel=false;btnOlho.innerText='👁️';}else{topoFixo.style.display='block';topoVisivel=true;btnOlho.innerText='🙈';}}
function handleConteudoClick(){if(document.fullscreenElement)toggleTopo();}
function toggleTelaCheia(){if(!document.fullscreenElement){boxLeitor.requestFullscreen().then(()=>{topoFixo.style.display='none';topoVisivel=false;btnOlho.style.display='block';});}else document.exitFullscreen();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){topoFixo.style.display='block';topoVisivel=true;btnOlho.style.display='none';}});
function toggleRolagem(){if(rolando){pararRolagem();}else{rolando=true;btnRola.innerText='⏸️ Parar';intervalo=setInterval(()=>leitorConteudo.scrollTop+=1,110);}}
function pararRolagem(){rolando=false;btnRola.innerText='▶️ Rolagem';clearInterval(intervalo);}
function abrirNova(){editId=null;editTitulo.value='';editArtista.value='';editConteudo.value='';modalEditar.classList.add('aberto');}
function editarCifra(id){const c=cifras.find(x=>x.id==id);editId=id;editTitulo.value=c.titulo;editArtista.value=c.artista;editConteudo.value=c.conteudo;modalEditar.classList.add('aberto');}
function salvarCifra(){const t=editTitulo.value,a=editArtista.value,co=editConteudo.value;if(!t)return alert('Nome');if(editId)Object.assign(cifras.find(x=>x.id==editId),{titulo:t,artista:a,conteudo:co});else cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co});salvar();modalEditar.classList.remove('aberto');renderLista();}
function abrirColar(){modalColar.classList.add('aberto');}
function salvarColar(){const txt=colarTexto.value,t=colarTitulo.value||'IMPORTADA',a=colarArtista.value||'Cifra Club';if(!txt||txt.length<10)return alert('Cole a cifra');cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:txt});salvar();renderLista();modalColar.classList.remove('aberto');abrirLeitor(cifras[cifras.length-1].id);}
function excluir(id){if(confirm('Excluir?')){cifras=cifras.filter(x=>x.id!=id);salvar();renderLista();}}
function exportarBKP(){const blob=new Blob([JSON.stringify(cifras)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_cifras_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importarBKP(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cifras=JSON.parse(r.result);salvar();renderLista();alert('Restaurado '+cifras.length+' cifras');}catch{alert('Arquivo inválido');}};r.readAsText(f);}
renderLista();mudarTema(temaAtual);aplicarEstilo();leitorConteudo.style.fontSize=fontSize+'px';valFonte.innerText=fontSize;totalBkp.innerText=cifras.length;
</script>
</body>
</html>
