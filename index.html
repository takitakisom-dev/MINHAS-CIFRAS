<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINHAS CIFRAS</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#d97706"><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#f3ece0;color:#2a211a;font-family:Inter,system-ui,sans-serif}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #e8ddd0}
.btn{border:1.5px solid #e8ddd0;background:#fff;color:#2a211a;padding:10px 16px;border-radius:100px;font-weight:700;font-size:13px;cursor:pointer}
.btn-black{background:#1a1611;color:#fff;border-color:#1a1611}.btn-orange{background:#d97706;color:#fff;border-color:#d97706}
#btnInst{background:#d97706;color:#fff;border:none;padding:14px;border-radius:100px;font-weight:800;width:calc(100% - 20px);margin:10px auto;display:block}
.card{margin:10px;background:#fff;border:1px solid #e8ddd0;border-radius:16px;padding:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tab{white-space:nowrap;padding:9px 13px;border-radius:100px;border:1px solid #e8ddd0;background:#f8f3eb;color:#5a4d3d;font-size:12px;font-weight:700;cursor:pointer}.tab.on{background:#1a1611;color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px}.chip{padding:7px 12px;border-radius:100px;border:1px solid #e8ddd0;background:#fff;color:#6b5d4d;font-size:11px;white-space:nowrap;cursor:pointer}.chip.on{background:#1a1611;color:#fff}
.cifra{padding:14px 4px;border-bottom:1px solid #eee6d9;display:flex;justify-content:space-between;align-items:center}
.ver{padding:8px 14px;border-radius:100px;border:1.5px solid #1a1611;color:#1a1611;background:#fff;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:none;justify-content:center;align-items:center;z-index:100;padding:16px}.modal.on{display:flex}
.box{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
/* MENU IGUAL DA SUA FOTO */
.repRow{display:flex;gap:10px;align-items:center;margin:10px 0}
.repRow input{flex:1;padding:14px 16px;border-radius:12px;border:1.5px solid #e8ddd0;background:#fffdf8;color:#1a1611;font-size:14px}
.btnSalvar{width:72px;height:52px;border-radius:100px;background:#d97706;color:#fff;border:none;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 10px rgba(217,119,6,.3)}
.temaRow{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.temaBtn{padding:10px 16px;border-radius:100px;border:1.5px solid #e8ddd0;background:#fff;color:#2a211a;font-weight:700;font-size:13px;cursor:pointer}
.temaBtn.on{background:#d97706;color:#fff;border-color:#d97706}
.btnFull{width:100%;padding:14px;border-radius:100px;font-weight:800;font-size:14px;cursor:pointer;margin:6px 0}
.btnExport{background:#d97706;color:#fff;border:none}
.btnOutline{background:#fff;color:#2a211a;border:1.5px solid #e8ddd0}
#boxLeitor{width:100%;max-width:780px;height:96vh;background:#fdfbf7;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
#leitor{flex:1;overflow:auto;padding:18px;color:#111}
.cLine{font-family:monospace;font-weight:800;font-size:15px;white-space:pre-wrap;color:#9a5a10}.lLine{font-weight:600;font-size:17px;margin:0 0 10px 0;color:#111}
.tons{display:flex;gap:5px;overflow-x:auto;padding:8px 0}.tBtn{min-width:38px;height:38px;border-radius:100px;border:1px solid #e8ddd0;background:#fff;font-weight:800}.tBtn.on{background:#d97706;color:#fff;border-color:#d97706}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #e8ddd0;background:#fffcf6;color:#1a1611;margin:6px 0}
.repCheck{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.repOpt{padding:7px 12px;border-radius:100px;border:1.5px solid #e8ddd0;background:#fff;color:#5a4d3d;font-size:11px;cursor:pointer}.repOpt.on{background:#d97706;color:#fff;border-color:#d97706}
</style></head><body>
<header><button class="btn" onclick="mMenu.classList.add('on')">☰</button><div style="font-weight:800">🎸 MINHAS CIFRAS</div><span class="btn btn-black" id="tot">0</span></header>
<button id="btnInst">📲 INSTALAR APP</button>
<div class="card"><div style="font-size:22px;font-weight:800">Sua coleção particular</div><div style="color:#8a7a6a;margin:6px 0 12px">Crie, importe e organize. Tudo offline.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-black" onclick="nova()">+ Nova Cifra</button><label class="btn">Importar.txt<input type="file" id="imp" hidden></label><button class="btn" onclick="mMenu.classList.add('on')">+ Repertório</button></div></div>
<div class="card"><div class="tabs" id="tabsRep"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="busca" placeholder="Buscar..." style="flex:1" oninput="render()"><button class="btn btn-black" onclick="nova()">+ Nova</button></div><div class="chips" id="filtEst"></div><div id="lista" style="margin-top:12px"></div></div>

<div id="mMenu" class="modal"><div class="box"><h3 style="font-size:18px;margin-bottom:10px">Repertórios (5)</h3><div id="editReps"></div><div class="temaRow"><button class="temaBtn on" id="tPapel" onclick="setTema('papel')">Papel</button><button class="temaBtn" id="tPreto" onclick="setTema('preto')">Preto</button><button class="temaBtn on" id="tAmbar" onclick="setTema('ambar')">Âmbar</button><button class="temaBtn" id="tBranco" onclick="setTema('branco')">Branco</button></div><button class="btnFull btnExport" onclick="exportar()">Exportar</button><label class="btnFull btnOutline" style="display:block;text-align:center">Importar<input type="file" id="imp2" hidden></label><button class="btnFull btnOutline" onclick="mMenu.classList.remove('on')">Fechar</button></div></div>

<div id="mLeitor" class="modal"><div id="boxLeitor"><div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;background:#fff"><button class="btn" onclick="fechar()">← Voltar</button><div style="display:flex;gap:6px"><button class="btn btn-black" id="bAuto" onclick="toggleAuto()">▶️ Auto</button><button class="btn btn-black" onclick="boxLeitor.requestFullscreen()">⛶</button></div></div><div style="padding:12px;background:#fffaf1;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between"><span id="infTom" style="font-size:11px;opacity:.7"></span><div style="display:flex;gap:6px"><button class="btn" onclick="mFont(-2)">A-</button><span id="labF" style="font-size:11px">18px</span><button class="btn" onclick="mFont(2)">A+</button><button class="btn" id="bSimp" onclick="tSimp()">Simplif.</button></div></div><div class="tons" id="barTons"></div><div id="tTit" style="font-size:11px;opacity:.6"></div></div><div id="leitor"></div></div></div>

<div id="mNova" class="modal"><div class="box"><h3>Nova música</h3><input id="nT" placeholder="Nome*"><input id="nA" placeholder="Artista"><select id="nEst"><option value="">Estilo...</option><option>MPB</option><option>ROCK NACIONAL</option><option>ROCK INTERNACIONAL</option><option>FORRÓ</option><option>REGGAE</option><option>SAMBA</option><option>PAGODE</option><option>ESTILO DO MUSICO</option><option>FUNK</option></select><div class="repCheck" id="nReps"></div><textarea id="nC" rows="12" placeholder="Cifra..."></textarea><button class="btn btn-black" style="width:100%;padding:13px;background:#d97706;color:#fff;border:none" onclick="salvar()">Salvar</button><button class="btn" style="width:100%;margin-top:8px" onclick="mNova.classList.remove('on')">Cancelar</button></div></div>

<script>
let pInst=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();pInst=e;});document.getElementById('btnInst').onclick=()=>{if(pInst)pInst.prompt();else alert('3 pontinhos > Instalar app');};
const ESTILOS=['TODOS','MPB','ROCK NACIONAL','ROCK INTERNACIONAL','FORRÓ','REGGAE','SAMBA','PAGODE','ESTILO DO MUSICO','FUNK'];
let reps=JSON.parse(localStorage.getItem('reps')||'["Rep 1","Rep 2","Rep 3","Rep 4","Rep 5"]');
let cifras=JSON.parse(localStorage.getItem('cifrasV59')||localStorage.getItem('minhasCifras')||'[]');
let filtroRep='TODAS',filtroEst='TODOS',tom=0,origTxt='',acOrig='G',simp=false,fSize=18,auto=null,tema='papel';
let save=()=>{localStorage.setItem('cifrasV59',JSON.stringify(cifras));localStorage.setItem('reps',JSON.stringify(reps));localStorage.setItem('tema',tema);};
function buildTabs(){let h=`<button class="tab ${filtroRep=='TODAS'?'on':''}" onclick="setRep('TODAS')">🎸 Minhas músicas (${cifras.length})</button>`;reps.forEach((r,i)=>{let q=cifras.filter(c=>c.reps&&c.reps.includes(i)).length;h+=`<button class="tab ${filtroRep==i?'on':''}" onclick="setRep(${i})">📚 ${r} (${q})</button>`;});document.getElementById('tabsRep').innerHTML=h;let eh=`<button class="chip ${filtroEst=='TODOS'?'on':''}" onclick="setEst('TODOS')">TODOS</button>`;ESTILOS.slice(1).forEach(e=>{eh+=`<button class="chip ${filtroEst==e?'on':''}" onclick="setEst('${e}')">${e}</button>`;});document.getElementById('filtEst').innerHTML=eh;
document.getElementById('editReps').innerHTML=reps.map((r,i)=>`<div class="repRow"><input id="r${i}" value="${r}"><button class="btnSalvar" onclick="renRep(${i})">Salvar</button></div>`).join('');}
function setRep(v){filtroRep=v;buildTabs();render();}function setEst(v){filtroEst=v;buildTabs();render();}
function renRep(i){reps[i]=document.getElementById('r'+i).value||`Rep ${i+1}`;save();buildTabs();buildNovaReps();render();}
function render(){let b=document.getElementById('busca').value.toLowerCase();let f=cifras.filter(c=>{let okB=!b||c.titulo.toLowerCase().includes(b)||(c.artista||'').toLowerCase().includes(b);let okR=filtroRep=='TODAS'||(c.reps&&c.reps.includes(filtroRep));let okE=filtroEst=='TODOS'||(c.estilo||'').toUpperCase()==filtroEst;return okB&&okR&&okE;});document.getElementById('tot').innerText=f.length;if(!f.length){document.getElementById('lista').innerHTML='<div style="padding:20px;color:#8a7a6a">Nenhuma música</div>';return;}document.getElementById('lista').innerHTML=f.map(c=>`<div class="cifra" onclick="abrir(${c.id})"><div><b>${c.titulo}</b><div style="font-size:11px;opacity:.7">${c.artista||''} • ${c.estilo||''}</div></div><button class="ver">Ver</button></div>`).join('');}
function buildNovaReps(){document.getElementById('nReps').innerHTML=reps.map((r,i)=>`<div class="repOpt" id="ro${i}" onclick="togRep(${i})">${r}</div>`).join('');}
let selReps=[];function togRep(i){let el=document.getElementById('ro'+i);if(selReps.includes(i)){selReps=selReps.filter(x=>x!=i);el.classList.remove('on');}else{selReps.push(i);el.classList.add('on');}}
function nova(){selReps=[];document.getElementById('nT').value='';document.getElementById('nA').value='';document.getElementById('nC').value='';buildNovaReps();document.getElementById('mNova').classList.add('on');}
function salvar(){if(!document.getElementById('nT').value.trim())return alert('Nome obrigatório');cifras.push({id:Date.now(),titulo:document.getElementById('nT').value.trim(),artista:document.getElementById('nA').value.trim(),estilo:document.getElementById('nEst').value,reps:[...selReps],conteudo:document.getElementById('nC').value});save();document.getElementById('mNova').classList.remove('on');buildTabs();render();}
function abrir(id){let c=cifras.find(x=>x.id==id);origTxt=c.conteudo;tom=0;let m=c.conteudo.match(/[A-G][#b]?/);acOrig=m?m[0]:'G';document.getElementById('tTit').innerText=c.titulo+' • '+c.artista;criaTons();document.getElementById('mLeitor').classList.add('on');aplicaTema();}
function criaTons(){let ct=document.getElementById('barTons');ct.innerHTML='';for(let i=-5;i<=5;i++){let b=document.createElement('button');b.className=i==0?'tBtn on':'tBtn';b.innerText=(i>0?'+'+i:i);b.onclick=()=>{tom=i;updTons();transp();};ct.appendChild(b);}updTons();}
function updTons(){[...document.getElementById('barTons').children].forEach((b,idx)=>b.className=(idx-5)==tom?'tBtn on':'tBtn');document.getElementById('infTom').innerText=`TOM ${acOrig} → ${transN(acOrig,tom)} (${tom})`;}
function transN(n,s){const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],M={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let b=M[n]||n;let i=N.indexOf(b);return i<0?n:N[(i+s+120)%12];}
let curTxt='';function transp(){const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],M={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let t=origTxt.replace(/[A-G][#b]?/g,m=>{let b=M[m]||m;let i=N.indexOf(b);return i<0?m:N[(i+tom+120)%12];});if(simp){t=t.replace(/[A-G][#b]?m?(?:7M|maj7|m7|7|9|6|sus|dim|aug|add9|\(.*?\)|\/[\\w#b]+)*/g,a=>{let mm=a.match(/^([A-G][#b]?)(m)?/);return mm?mm[1]+(mm[2]||''):a;});}curTxt=t;show();}
function show(){let txt=curTxt||origTxt;let h='';txt.split('\n').forEach(l=>{if(!l.trim()){h+='<div style="height:10px"></div>';return;}let eh=l.trim().length<90 && /[A-G]/.test(l) && l.trim().split(/\s+/).length<=12 && /^[A-G\s#b0-9\/\(\)mMaj7\-]+$/.test(l.trim());if(eh)h+=`<div class="cLine" style="font-size:${fSize-1}px">${l}</div>`;else h+=`<div class="lLine" style="font-size:${fSize}px">${l}</div>`;});document.getElementById('leitor').innerHTML=h;document.getElementById('labF').innerText=fSize+'px';}
function fechar(){if(auto){clearInterval(auto);auto=null;document.getElementById('bAuto').innerText='▶️ Auto';}document.getElementById('mLeitor').classList.remove('on');}
function mFont(d){fSize=Math.max(12,Math.min(32,fSize+d));show();}function tSimp(){simp=!simp;document.getElementById('bSimp').className=simp?'btn btn-black':'btn';transp();}
function setTema(t){tema=t;localStorage.setItem('tema',t);document.querySelectorAll('.temaBtn').forEach(b=>b.classList.remove('on'));if(t=='papel')document.getElementById('tPapel').classList.add('on');if(t=='preto')document.getElementById('tPreto').classList.add('on');if(t=='ambar')document.getElementById('tAmbar').classList.add('on');if(t=='branco')document.getElementById('tBranco').classList.add('on');aplicaTema();}
function aplicaTema(){let box=document.getElementById('boxLeitor');let leitor=document.getElementById('leitor');if(tema=='preto'){box.style.background='#121212';leitor.style.color='#e0e0e0';}else if(tema=='ambar'){box.style.background='#fff3e0';leitor.style.color='#5d4037';}else if(tema=='branco'){box.style.background='#ffffff';leitor.style.color='#111';}else{box.style.background='#fdfbf7';leitor.style.color='#111';}show();}
function toggleAuto(){if(auto){clearInterval(auto);auto=null;document.getElementById('bAuto').innerText='▶️ Auto';}else{document.getElementById('bAuto').innerText='⏸️ Parar';auto=setInterval(()=>document.getElementById('leitor').scrollTop+=1,55);}}
function exportar(){let blob=new Blob([JSON.stringify({cifras,reps})],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click();}
document.getElementById('imp').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(j.cifras){cifras=j.cifras;reps=j.reps||reps;}else cifras=j;save();buildTabs();render();}catch{alert('Inválido');}};r.readAsText(f);});
document.getElementById('imp2').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(j.cifras){cifras=j.cifras;reps=j.reps||reps;}else cifras=j;save();buildTabs();render();mMenu.classList.remove('on');}catch{alert('Inválido');}};r.readAsText(f);});
buildTabs();buildNovaReps();render();tema=localStorage.getItem('tema')||'papel';setTema(tema);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
