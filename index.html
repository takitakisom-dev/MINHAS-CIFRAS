<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifras Pro Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f0e;color:#e8e8e8;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(11,15,14,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.08);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;letter-spacing:-0.5px;font-size:18px;display:flex;align-items:center;gap:8px}
.logo b{color:#f5d547}
.btn{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;padding:10px 18px;border-radius:100px;font-weight:600;font-size:13px;cursor:pointer;transition:0.2s}
.btn:hover{background:rgba(255,255,255,0.12)}
.btn-amarelo{background:#f5d547;color:#0b0f0e;border-color:#f5d547;font-weight:700}
.btn-ativo{background:#fff;color:#0b0f0e;border-color:#fff}
.btn-ghost{border:none;background:transparent;color:rgba(255,255,255,0.6)}
.card{margin:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:18px;backdrop-filter:blur(10px)}
.input-busca{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;color:white;outline:none;margin-top:12px}
.input-busca:focus{border-color:rgba(245,213,71,0.5)}
.cifra-item{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:16px;transition:0.2s;cursor:pointer}
.cifra-item:hover{background:rgba(255,255,255,0.05)}
.cifra-item b{font-size:15px;letter-spacing:-0.2px}
.cifra-item small{color:rgba(255,255,255,0.5);font-size:12px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(20px);display:none;justify-content:center;align-items:center;z-index:50;padding:12px}
.modal.aberto{display:flex}
.modal-box{background:#161a19;border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow:auto}

#boxLeitor{width:100%;max-width:720px;height:96vh;background:#fdfbf7;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.6);position:relative}
.topo-fixo{padding:18px 20px;background:#fdfbf7;border-bottom:1px solid rgba(0,0,0,0.06);flex-shrink:0}
#leitorConteudo{flex:1;overflow:auto;padding:24px 28px;background:#fdfbf7;color:#1a1a1a;font-size:20px;line-height:1.7;white-space:pre;font-family:'Caveat',cursive;letter-spacing:0.2px}
.cifra-line{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:#0f0f0f!important;letter-spacing:-0.3px;margin-top:14px;white-space:pre}
.linha-letra{font-family:'Caveat',cursive;font-size:22px;color:#2b2b2b;margin-bottom:14px;white-space:pre-wrap}
#boxLeitor:fullscreen{border-radius:0;max-width:100vw;width:100vw;height:100vh}

.tons{display:flex;gap:6px;overflow:auto;padding:8px 0;scrollbar-width:none}
.tons::-webkit-scrollbar{display:none}
.tom-btn{min-width:44px;height:44px;border-radius:100px;border:1px solid rgba(0,0,0,0.1);background:white;color:#111;font-weight:700;font-size:14px;cursor:pointer;transition:0.2s}
.tom-btn.ativo{background:#111;color:white;border-color:#111;transform:scale(1.05)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;background:#111;color:white;font-size:12px;font-weight:600;cursor:pointer;border:none}
.chip-ativo{background:#f5d547;color:#111}

#btnOlho{position:fixed;top:16px;right:16px;z-index:999;width:44px;height:44px;border-radius:100px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);color:white;border:1px solid rgba(255,255,255,0.15);display:none}
textarea,input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:white;margin:8px 0;outline:none}
</style>
</head>
<body>
<header>
<button class="btn btn-ghost" id="btnMenu">☰</button>
<div class="logo">♪ <b>CIFRAS</b> PRO</div>
<button class="btn btn-amarelo" id="btnHome">• <span id="total">0</span></button>
</header>
<button id="btnOlho">👁️</button>

<div id="menuLateral" class="modal"><div class="modal-box">
<h2 style="font-size:22px;letter-spacing:-0.5px;margin-bottom:16px">Ajustes</h2>
<div style="margin:18px 0"><div style="font-size:11px;letter-spacing:1px;opacity:0.5;margin-bottom:10px">APARÊNCIA</div><div style="display:flex;gap:8px"><button class="btn btn-ativo" data-tema="papel">Papel</button><button class="btn" data-tema="dark">Escuro</button></div></div>
<div style="margin:18px 0"><div style="font-size:11px;letter-spacing:1px;opacity:0.5;margin-bottom:10px">TAMANHO</div><input type="range" min="16" max="32" value="20" id="rangeFonte" style="width:100%"></div>
<div style="margin:18px 0"><div style="font-size:11px;letter-spacing:1px;opacity:0.5;margin-bottom:10px">BACKUP</div><button class="btn btn-amarelo" id="btnExportar" style="width:100%">Exportar backup</button><label class="btn" style="width:100%;text-align:center;display:block;margin-top:8px">Importar<input type="file" id="importFile" hidden></label></div>
<button class="btn" id="btnFecharMenu" style="width:100%;margin-top:16px">Fechar</button>
</div></div>

<div class="card">
<div style="display:flex;gap:10px"><button class="btn btn-amarelo" id="btnNova" style="flex:1">+ Nova cifra</button><button class="btn" id="btnColar" style="flex:1">Colar</button></div>
<input id="busca" class="input-busca" placeholder="Buscar música ou artista...">
</div>
<div class="card"><div style="font-size:11px;letter-spacing:1px;opacity:0.4;margin-bottom:8px">BIBLIOTECA</div><div id="lista"></div></div>

<div id="modalLeitor" class="modal"><div id="boxLeitor">
<div class="topo-fixo" id="topoFixo">
<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn" id="btnVoltar" style="border:none;background:#f0eee9;color:#111">← Voltar</button><button class="btn" id="btnTelaCheia" style="background:#111;color:white;border-color:#111">⛶ Tela cheia</button></div>
<div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;letter-spacing:1px;color:rgba(0,0,0,0.5)">TOM • Original <span id="tomOriginal">G</span> → <span id="tomAtualLabel" style="font-weight:700;color:#111">0 (G)</span></div><button class="chip" id="btnSimplificar">Cifra simplificada</button></div>
<div class="tons" id="barraTons"></div>
<h2 id="leitorTitulo" style="margin-top:12px;font-size:13px;letter-spacing:0.8px;color:rgba(0,0,0,0.4);text-transform:uppercase"></h2>
</div>
<div id="leitorConteudo"></div>
</div></div>

<div id="modalEditar" class="modal"><div class="modal-box"><input id="editTitulo" type="text" placeholder="Nome da música"><input id="editArtista" type="text" placeholder="Artista"><textarea id="editConteudo" rows="14" placeholder="Cole com cifras em cima"></textarea><button class="btn btn-amarelo" id="btnSalvar" style="width:100%">Salvar</button><button class="btn" id="btnCancelarEdit" style="width:100%;margin-top:8px">Cancelar</button></div></div>
<div id="modalColar" class="modal"><div class="modal-box"><h3 style="margin-bottom:10px">Colar cifra</h3><textarea id="colarTexto" rows="12"></textarea><input id="colarTitulo" type="text" placeholder="Nome"><input id="colarArtista" type="text" placeholder="Artista"><button class="btn btn-amarelo" id="btnSalvarColar" style="width:100%">Salvar na biblioteca</button><button class="btn" id="btnCancelarColar" style="width:100%;margin-top:8px">Cancelar</button></div></div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
 let cifras=[]; try{cifras=JSON.parse(localStorage.getItem('minhasCifras_v27')||'[]');}catch(e){cifras=[];}
 let tom=0, originalConteudo='', acordeOriginal='G', simplificada=false, fontSize=20, tema='papel';
 const $=id=>document.getElementById(id);
 const salvar=()=>localStorage.setItem('minhasCifras_v27',JSON.stringify(cifras));
 function renderLista(){
  const b=$('busca').value.toLowerCase();
  const f=cifras.filter(c=>c.titulo.toLowerCase().includes(b)||c.artista.toLowerCase().includes(b));
  $('total').innerText=f.length;
  $('lista').innerHTML=f.length?f.map(c=>`<div class="cifra-item" data-id="${c.id}"><div><b>${c.titulo}</b><div style="margin-top:2px"><small>${c.artista}</small></div></div><span style="opacity:0.2">›</span></div>`).join(''):'<div style="padding:30px;text-align:center;opacity:0.3">Nenhuma cifra ainda</div>';
  document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>abrirLeitor(Number(el.dataset.id))));
 }
 function abrirLeitor(id){
  const c=cifras.find(x=>x.id==id); if(!c) return;
  originalConteudo=c.conteudo; tom=0; simplificada=false; $('btnSimplificar').className='chip';
  const m=c.conteudo.match(/[A-G][#b]?/); acordeOriginal=m?m[0]:'G'; $('tomOriginal').innerText=acordeOriginal;
  criarBarraTons(); renderCifraTexto(c.conteudo); $('leitorTitulo').innerText=c.titulo+' • '+c.artista;
  $('modalLeitor').classList.add('aberto'); $('leitorConteudo').scrollTop=0;
 }
 function criarBarraTons(){const cont=$('barraTons'); cont.innerHTML=''; for(let i=-5;i<=5;i++){const btn=document.createElement('button'); btn.className=i===0?'tom-btn ativo':'tom-btn'; btn.innerText=(i>0?'+'+i:i); btn.addEventListener('click',()=>{tom=i; atualizarTons(); aplicarTransposicao();}); cont.appendChild(btn);} atualizarTons();}
 function atualizarTons(){$('barraTons').querySelectorAll('.tom-btn').forEach((b,idx)=>{let v=idx-5; b.className=v===tom?'tom-btn ativo':'tom-btn';}); $('tomAtualLabel').innerText=(tom>0?'+'+tom:tom)+' ('+transporNota(acordeOriginal,tom)+')';}
 function transporNota(nota,s){const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}; let base=MAP[nota]||nota; let i=NOTAS.indexOf(base); if(i==-1) return nota; return NOTAS[(i+s+120)%12];}
 function aplicarTransposicao(){
  const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  let texto=originalConteudo.replace(/[A-G][#b]?/g,m=>{let base=MAP[m]||m; let i=NOTAS.indexOf(base); if(i==-1) return m; return NOTAS[(i+tom+120)%12];});
  if(simplificada){texto=texto.replace(/[A-G][#b]?m?(?:7M|maj7|m7|7|9|6|sus2|sus4|sus|dim|aug|add9|\(.*?\)|\/[\w#b]+)*/g,ac=>{let mm=ac.match(/^([A-G][#b]?)(m)?/); return mm?mm[1]+(mm[2]||''):ac;});}
  renderCifraTexto(texto);
 }
 function renderCifraTexto(txt){
  let html=''; txt.split('\n').forEach(l=>{if(!l.trim()){html+=`\n`;return;}let ehCifra=l.trim().length<90 && /[A-G]/.test(l) && l.trim().split(/\s+/).length<=10; if(ehCifra) html+=`<div class="cifra-line">${l}</div>`; else html+=`<div class="linha-letra">${l}</div>`;});
  $('leitorConteudo').innerHTML=html;
  $('leitorConteudo').style.fontSize=fontSize+'px';
 }
 $('btnMenu').addEventListener('click',()=>$('menuLateral').classList.add('aberto'));
 $('btnFecharMenu').addEventListener('click',()=>$('menuLateral').classList.remove('aberto'));
 $('btnHome').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
 $('busca').addEventListener('input',renderLista);
 $('btnNova').addEventListener('click',()=>{$('editTitulo').value=''; $('editArtista').value=''; $('editConteudo').value=''; $('modalEditar').classList.add('aberto');});
 $('btnColar').addEventListener('click',()=>$('modalColar').classList.add('aberto'));
 $('btnCancelarEdit').addEventListener('click',()=>$('modalEditar').classList.remove('aberto'));
 $('btnCancelarColar').addEventListener('click',()=>$('modalColar').classList.remove('aberto'));
 $('btnVoltar').addEventListener('click',()=>{$('modalLeitor').classList.remove('aberto'); if(document.fullscreenElement)document.exitFullscreen();});
 $('btnTelaCheia').addEventListener('click',()=>{if(!document.fullscreenElement){$('boxLeitor').requestFullscreen();}else document.exitFullscreen();});
 $('btnSimplificar').addEventListener('click',()=>{simplificada=!simplificada; $('btnSimplificar').className=simplificada?'chip chip-ativo':'chip'; $('btnSimplificar').innerText=simplificada?'✓ Simplificada':'Cifra simplificada'; aplicarTransposicao();});
 $('rangeFonte').addEventListener('input',e=>{fontSize=parseInt(e.target.value); $('leitorConteudo').style.fontSize=fontSize+'px';});
 $('btnSalvar').addEventListener('click',()=>{const t=$('editTitulo').value,a=$('editArtista').value,co=$('editConteudo').value; if(!t) return alert('Nome'); cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co}); salvar(); $('modalEditar').classList.remove('aberto'); renderLista();});
 $('btnSalvarColar').addEventListener('click',()=>{const txt=$('colarTexto').value,t=$('colarTitulo').value||'Importada',a=$('colarArtista').value||''; if(!txt) return alert('Cole'); cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:txt}); salvar(); $('modalColar').classList.remove('aberto'); renderLista();});
 $('btnExportar').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(cifras)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cifras-pro.json'; a.click();});
 $('importFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{cifras=JSON.parse(r.result); salvar(); renderLista();}catch{alert('Inválido');}}; r.readAsText(f);});
 document.querySelectorAll('[data-tema]').forEach(b=>b.addEventListener('click',()=>{
  tema=b.dataset.tema;
  if(tema==='dark'){ $('boxLeitor').style.background='#111'; $('leitorConteudo').style.background='#111'; $('leitorConteudo').style.color='#fff'; document.querySelectorAll('.cifra-line').forEach(x=>x.style.color='#fff'); }
  else { $('boxLeitor').style.background='#fdfbf7'; $('leitorConteudo').style.background='#fdfbf7'; $('leitorConteudo').style.color='#1a1a1a'; document.querySelectorAll('.cifra-line').forEach(x=>x.style.color='#0f0f0f'); }
 }));
 renderLista();
});
</script>
</body>
</html>
