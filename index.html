async function baixarBib(url,titulo,artista){
 const btn=event.target; btn.innerText='⏳...';
 try{
  const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
  const res=await fetch(proxy); const html=await res.text();
  const m=html.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i);
  let cifra=m?m[1].replace(/<[^>]+>/g,'').trim():'';
  if(!cifra){btn.innerText='❌ Não achei'; return;}
  cifras.push({id:Date.now(),titulo:titulo,artista:artista,conteudo:cifra});
  salvar(); renderLista(); btn.innerText='✅ Baixada';
  setTimeout(()=>{menuLateral.classList.remove('aberto'); abrirLeitor(cifras[cifras.length-1].id);},600);
 }catch(e){btn.innerText='Erro';}
}
function abrirLeitor(id){const c=cifras.find(x=>x.id==id);if(!c)return;originalConteudo=c.conteudo;tom=0;tomAtual.innerText='0';leitorTitulo.innerText=c.titulo+' - '+c.artista;renderCifraTexto(c.conteudo);modalLeitor.classList.add('aberto');}
function fecharLeitor(){modalLeitor.classList.remove('aberto');btnOlho.style.display='none';if(document.fullscreenElement)document.exitFullscreen();}
function renderCifraTexto(txt){let html='';txt.split('\n').forEach(l=>{if(!l.trim()){html+=`<div style="height:4px"></div>`;return;}let isCifra=l.trim().length<70 && /[A-G]/.test(l); if(isCifra) html+=`<div class="cifra-line ${corCifra}">${l}</div>`; else html+=`<div class="linha-letra">${l}</div>`;});leitorConteudo.innerHTML=html;}
function transpor(s){
 tom+=s;tomAtual.innerText=(tom>0?'+'+tom:tom);
 const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
 let texto=originalConteudo.replace(/[A-G][#b]?/g,m=>{
   let i=NOTAS.indexOf(m); if(i==-1){const mapa={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}; i=NOTAS.indexOf(mapa[m]||m);} if(i==-1) return m; return NOTAS[(i+s+12*10)%12];
 });
 renderCifraTexto(texto);
}
function toggleTopo(){topoFixo.style.display=topoVisivel?'none':'block';topoVisivel=!topoVisivel;btnOlho.innerText=topoVisivel?'🙈':'👁️';}
function handleConteudoClick(){if(document.fullscreenElement)toggleTopo();}
function toggleTelaCheia(){if(!document.fullscreenElement){boxLeitor.requestFullscreen().then(()=>{topoFixo.style.display='none';topoVisivel=false;btnOlho.style.display='block';});}else document.exitFullscreen();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){topoFixo.style.display='block';topoVisivel=true;btnOlho.style.display='none';}});
function abrirNova(){editId=null;editTitulo.value='';editArtista.value='';editConteudo.value='';modalEditar.classList.add('aberto');}
function salvarCifra(){const t=editTitulo.value,a=editArtista.value,co=editConteudo.value;if(!t)return alert('Nome');if(editId)Object.assign(cifras.find(x=>x.id==editId),{titulo:t,artista:a,conteudo:co});else cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co});salvar();modalEditar.classList.remove('aberto');renderLista();}
function excluir(id){if(confirm('Excluir?')){cifras=cifras.filter(x=>x.id!=id);salvar();renderLista();}}
function exportarBKP(){const blob=new Blob([JSON.stringify(cifras)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_cifras.json';a.click();}
function importarBKP(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cifras=JSON.parse(r.result);salvar();renderLista();alert('Restaurado '+cifras.length);};r.readAsText(f);}
renderLista();renderBib();
</script>
