<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINHAS CIFRAS - A∞T</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a3d26">
<style>
:root{--green:#0a3d26;--green2:#123f2e;--gold:#d4af37;--gold2:#f5d76e;--bg:#071a11}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:system-ui}
.header{background:linear-gradient(180deg,var(--green2),var(--green));border-bottom:2px solid var(--gold);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--gold2);letter-spacing:1px}
.logo i{font-size:28px}
.card{background:linear-gradient(180deg,#132f24,#0d2118);border:1px solid rgba(212,175,55,.4);border-radius:16px;padding:16px;margin:12px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.btn{padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;border:none}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--green)}
.btn-out{border:1px solid var(--gold);color:var(--gold2);background:transparent}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input,textarea{width:100%;background:#0a1f14;border:1px solid rgba(212,175,55,.4);color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.cifra{white-space:pre-wrap;font-family:monospace;line-height:1.8;background:#0a1f14;padding:16px;border-radius:12px;border:1px solid rgba(212,175,55,.3);margin-top:12px}
.cifra b{color:var(--gold2)}
.tag{display:inline-block;background:rgba(212,175,55,.15);border:1px solid var(--gold);color:var(--gold2);padding:4px 10px;border-radius:20px;font-size:12px;margin:2px}
.list-item{padding:14px;border-bottom:1px solid rgba(212,175,55,.15);cursor:pointer;display:flex;justify-content:space-between}
.list-item:hover{background:rgba(212,175,55,.08)}
</style>
</head>
<body>
<div class="header">
<div class="logo">♫ MINHAS CIFRAS <span style="font-size:12px;opacity:.7">A∞T</span></div>
<div><button class="btn btn-gold" onclick="show('home')">Home</button></div>
</div>

<div id="home">
<div class="card">
<h2 style="color:var(--gold2)">Sua coleção particular</h2>
<p style="opacity:.8;margin:8px 0">Crie, importe e organize. Tudo offline.</p>
<div class="toolbar">
<button class="btn btn-gold" onclick="show('nova')">+ Nova Cifra</button>
<button class="btn btn-out" onclick="show('importar')">Importar.txt</button>
<button class="btn btn-out" onclick="show('repertorio')">+ Repertório</button>
</div>
</div>
<div class="card">
<h3 style="color:var(--gold2)">Minhas Cifras <span id="count"></span></h3>
<div id="lista"></div>
</div>
</div>

<div id="nova" style="display:none" class="card">
<h3 style="color:var(--gold2)">+ Nova Cifra</h3>
<input id="n_titulo" placeholder="Título - Ex: Evidências">
<input id="n_artista" placeholder="Artista - Ex: Chitãozinho & Xororó">
<input id="n_tom" placeholder="Tom original - Ex: C">
<textarea id="n_texto" rows="10" placeholder="Cole aqui com acordes [C] [G] [Am]"></textarea>
<div class="toolbar">
<button class="btn btn-gold" onclick="salvarNova()">Salvar na coleção</button>
<button class="btn btn-out" onclick="show('home')">Cancelar</button>
</div>
</div>

<div id="importar" style="display:none" class="card">
<h3 style="color:var(--gold2)">Importar.txt da Internet</h3>
<p style="opacity:.7;font-size:13px">Copiou do Cifra Club? Cola aqui.</p>
<textarea id="imp_texto" rows="12" placeholder="[C] Quando eu digo [G] que deixei..."></textarea>
<input id="imp_titulo" placeholder="Título da música">
<div class="toolbar">
<button class="btn btn-gold" onclick="salvarImport()">Importar e salvar</button>
<button class="btn btn-out" onclick="show('home')">Voltar</button>
</div>
</div>

<div id="leitor" style="display:none" class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 id="l_titulo" style="color:var(--gold2)"></h2>
<button class="btn btn-out" onclick="show('home')">← Voltar</button>
</div>
<p id="l_artista" style="opacity:.7"></p>
<div class="toolbar">
<button id="btnSimples" class="btn btn-out" onclick="toggleSimples()">Cifra Simples</button>
<button class="btn btn-out" onclick="transpose(-1)">Tom -</button>
<span id="tomAtual" class="tag">Tom: C</span>
<button class="btn btn-out" onclick="transpose(1)">Tom +</button>
<button class="btn btn-out" onclick="toggleScroll()">Auto Scroll</button>
</div>
<div id="l_cifra" class="cifra"></div>
</div>

<div id="repertorio" style="display:none" class="card">
<h3 style="color:var(--gold2)">Criar Repertório</h3>
<input id="rep_nome" placeholder="Nome - Ex: Culto Domingo, Bar Sábado">
<div id="rep_lista"></div>
<button class="btn btn-gold" style="margin-top:10px" onclick="salvarRep()">Salvar Repertório</button>
<button class="btn btn-out" onclick="show('home')">Voltar</button>
</div>

<script>
let cifras = JSON.parse(localStorage.getItem('mc_cifras')||'[]');
let atual=null, modoSimples=false, scrollInt=null, trans=0;

function show(id){
document.querySelectorAll('#home,#nova,#importar,#leitor,#repertorio').forEach(e=>e.style.display='none');
document.getElementById(id).style.display='block';
if(id==='home') renderLista();
if(id==='repertorio') renderRep();
}
function salvarNova(){
let c={id:Date.now(), titulo:document.getElementById('n_titulo').value, artista:document.getElementById('n_artista').value, tom:document.getElementById('n_tom').value||'C', texto:document.getElementById('n_texto').value, orig:document.getElementById('n_texto').value};
cifras.unshift(c); localStorage.setItem('mc_cifras',JSON.stringify(cifras)); show('home');
}
function salvarImport(){
let t=document.getElementById('imp_texto').value; if(!t) return;
let c={id:Date.now(), titulo:document.getElementById('imp_titulo').value||'Importada', artista:'Importada', tom:'C', texto:t, orig:t};
cifras.unshift(c); localStorage.setItem('mc_cifras',JSON.stringify(cifras)); show('home');
}
function renderLista(){
document.getElementById('count').innerText='('+cifras.length+')';
let h=''; cifras.forEach(c=>{h+=`<div class=list-item onclick="abrir(${c.id})"><div><b>${c.titulo}</b><br><small style=opacity:.6>${c.artista} - Tom ${c.tom}</small></div><span class=tag>Ver</span></div>`});
document.getElementById('lista').innerHTML=h||'<p style=opacity:.5>Sem cifras ainda. Clique em + Nova Cifra</p>';
}
function abrir(id){
atual=cifras.find(c=>c.id===id); trans=0; modoSimples=false;
document.getElementById('l_titulo').innerText=atual.titulo;
document.getElementById('l_artista').innerText=atual.artista;
document.getElementById('l_cifra').innerHTML=colorir(atual.texto);
document.getElementById('tomAtual').innerText='Tom: '+atual.tom;
document.getElementById('btnSimples').innerText='Cifra Simples'; document.getElementById('btnSimples').className='btn btn-out';
show('leitor');
}
function colorir(t){return t.replace(/\[([^\]]+)\]/g,'<b>[$1]</b>');}
function simplifyChords(text){
return text.replace(/\[([A-G][#b]?)([^\]]*)\]/g,(f,base,rest)=>{
let map={'C#':'C','D#':'D','F#':'F','G#':'G','A#':'A'}; let simple=map[base]||base.replace('#','').replace('b','');
let minor=rest.toLowerCase().includes('m') &&!rest.toLowerCase().includes('maj'); return '['+simple+(minor?'m':'')+']';
});
}
function toggleSimples(){
modoSimples=!modoSimples; let btn=document.getElementById('btnSimples');
if(modoSimples){btn.innerText='★ SIMPLES ON'; btn.className='btn btn-gold';
document.getElementById('l_cifra').innerHTML=colorir(simplifyChords(atual.orig))+'<br><br><small style=color:var(--gold2)>// Simplificado: F#m7(b5) → Dm, C#m → Am. Use Capo 2ª casa para tom original.</small>';
}else{btn.innerText='Cifra Simples'; btn.className='btn btn-out'; document.getElementById('l_cifra').innerHTML=colorir(atual.texto);}
}
function transpose(dir){
trans+=dir; let notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let txt=atual.texto.replace(/\[([A-G][#b]?)([^\]]*)\]/g,(f,b,r)=>{
let idx=notes.indexOf(b.replace('b','')); if(idx<0) return f; let nidx=(idx+trans+12)%12; return '['+notes[nidx]+r+']';
});
document.getElementById('l_cifra').innerHTML=colorir(txt);
}
function toggleScroll(){
if(scrollInt){clearInterval(scrollInt); scrollInt=null; return}
scrollInt=setInterval(()=>window.scrollBy(0,1),80);
}
function renderRep(){
let h=''; cifras.forEach(c=>{h+=`<div class=list-item><label><input type=checkbox value=${c.id} class=repcheck> ${c.titulo}</label></div>`});
document.getElementById('rep_lista').innerHTML=h;
}
function salvarRep(){
let nome=document.getElementById('rep_nome').value; let ids=[...document.querySelectorAll('.repcheck:checked')].map(e=>+e.value);
let reps=JSON.parse(localStorage.getItem('mc_reps')||'[]'); reps.push({nome,ids}); localStorage.setItem('mc_reps',JSON.stringify(reps)); alert('Repertório '+nome+' salvo! '+ids.length+' músicas'); show('home');
}
renderLista();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
