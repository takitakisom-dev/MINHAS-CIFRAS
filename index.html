<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINHAS CIFRAS A∞T PRO v4</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a3d26">
<style>
:root{--green:#0a2f1e;--gold:#d4af37;--gold2:#f5d76e;--bg:#061a11}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:system-ui}
.header{background:#0a2f1e;border-bottom:2px solid var(--gold);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header b{color:var(--gold2)}.logo{color:var(--gold2);font-weight:900}
.card{background:#0e2e1e;border:1px solid rgba(212,175,55,.4);border-radius:18px;padding:14px;margin:12px}
.btn{padding:10px 16px;border-radius:20px;font-weight:800;border:1px solid var(--gold);color:var(--gold2);background:transparent;cursor:pointer}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0a2f1e;border:none}
input,textarea{width:100%;background:#0a1f14;border:1px solid rgba(212,175,55,.4);color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.cifra{white-space:pre-wrap;font-family:monospace;line-height:1.9;background:#0a2014;padding:16px;border-radius:14px;border:1px solid rgba(212,175,55,.3);margin-top:12px;word-break:break-word}
.cifra b{color:var(--gold2)}.tag{background:rgba(212,175,55,.15);border:1px solid var(--gold);color:var(--gold2);padding:6px 12px;border-radius:20px;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.list-item{padding:14px;border-bottom:1px solid rgba(212,175,55,.15)}
</style>
</head>
<body>
<div class="header"><div class="logo">♫ MINHAS CIFRAS A∞T v4</div><button class="btn btn-gold" onclick="show('home')">Home</button></div>

<div id="home">
<div class="card">
<h3 style="color:var(--gold2)">🔍 Buscar da Internet</h3>
<div style="display:flex;gap:8px"><input id="webQ" placeholder="Ex: Claudio Zoli Noite do Prazer"><button class="btn btn-gold" onclick="buscarWeb()">Buscar</button></div>
<p style="font-size:11px;opacity:.5;margin-top:6px">Abre Cifra Club pra copiar e colar no Importar</p>
<div class="toolbar" style="margin-top:14px">
<button class="btn btn-gold" onclick="show('nova')">+ Nova Cifra</button>
<button class="btn" onclick="show('importar')">Importar.txt</button>
<button class="btn" onclick="show('repertorio')">+ Repertório</button>
</div>
<input id="localQ" placeholder="🔍 Buscar nas minhas cifras..." oninput="renderLista()" style="margin-top:10px">
</div>
<div class="card"><h3 style="color:var(--gold2)">Minhas Cifras <span id="count"></span></h3><div id="lista"></div></div>
</div>

<div id="nova" style="display:none" class="card">
<h3 style="color:var(--gold2)">+ Nova Cifra</h3>
<input id="n_tit" placeholder="Título"><input id="n_art" placeholder="Artista"><input id="n_tom" placeholder="Tom ex: G"><textarea id="n_txt" rows="10" placeholder="[G] [Em7] [C7M]..."></textarea>
<div class="toolbar"><button class="btn btn-gold" onclick="salvarNova()">Salvar</button><button class="btn" onclick="show('home')">Cancelar</button></div>
</div>

<div id="importar" style="display:none" class="card">
<h3 style="color:var(--gold2)">Importar.txt</h3><textarea id="i_txt" rows="12" placeholder="Cole aqui a cifra"></textarea><input id="i_tit" placeholder="Título"><input id="i_art" placeholder="Artista"><div class="toolbar"><button class="btn btn-gold" onclick="salvarImp()">Salvar</button><button class="btn" onclick="show('home')">Voltar</button></div>
</div>

<div id="leitor" style="display:none" class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><div><h2 id="l_tit" style="color:var(--gold2);line-height:1.1"></h2><p id="l_art" style="opacity:.6"></p></div><button class="btn" onclick="stopScroll();show('home')">← Voltar</button></div>

<div class="toolbar">
<button id="btnSimples" class="btn" onclick="toggleSimples()">Cifra Simples</button>
<button class="btn" onclick="transp(-1)">Tom -</button>
<span id="tomTag" class="tag">Tom: G</span>
<button class="btn" onclick="transp(1)">Tom +</button>
</div>

<div class="toolbar" style="background:rgba(0,0,0,.25);padding:10px;border-radius:12px;border:1px solid rgba(212,175,55,.2)">
<span style="color:var(--gold2);font-size:12px;font-weight:800">TAMANHO:</span>
<button class="btn" onclick="fontSize(-2)">A-</button>
<span id="fontTag" class="tag">16px</span>
<button class="btn" onclick="fontSize(2)">A+</button>
<button class="btn" onclick="fontSize(0,true)">Reset</button>
</div>

<div style="background:#0a1f14;border:1px solid var(--gold);border-radius:12px;padding:12px">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span style="color:var(--gold2);font-size:12px;font-weight:800">🎬 ROLAGEM:</span>
<button id="playBtn" class="btn btn-gold" onclick="toggleScroll()">▶️ Play</button>
<button class="btn" onclick="stopScroll()">⏹️ Parar</button>
<input type="range" id="speed" min="1" max="10" value="3" oninput="updateSpeed()" style="width:120px">
<span id="speedTag" class="tag">3x</span>
</div>
</div>

<div id="l_cifra" class="cifra" ondblclick="toggleScroll()"></div>
<div style="height:60vh"></div>
<p style="font-size:11px;opacity:.4;text-align:center;margin-top:20px">Toque 2x na cifra = Play/Pause</p>
</div>

<div id="repertorio" style="display:none" class="card"><h3 style="color:var(--gold2)">Repertório</h3><input id="rep_nome" placeholder="Nome ex: Show Sábado"><div id="rep_lista"></div><button class="btn btn-gold" onclick="salvarRep()">Salvar</button></div>

<script>
let cifras = JSON.parse(localStorage.getItem('mc_cifras')||localStorage.getItem('mc')||'[]');
let atual=null, simples=false, scrollTimer=null, tr=0, fz=16, vel=3;
function show(id){stopScroll();['home','nova','importar','leitor','repertorio'].forEach(e=>document.getElementById(e).style.display='none');document.getElementById(id).style.display='block';if(id==='home')renderLista();window.scrollTo(0,0);}
function buscarWeb(){let q=document.getElementById('webQ').value.trim();if(!q)return alert('Digite o nome');window.open('https://www.cifraclub.com/search/?q='+encodeURIComponent(q),'_blank');}
function salvarNova(){let t=document.getElementById('n_txt').value;if(!t)return;cifras.unshift({id:Date.now(),titulo:document.getElementById('n_tit').value||'Sem titulo',artista:document.getElementById('n_art').value||'Autoral',tom:document.getElementById('n_tom').value||'G',texto:t,orig:t});save();show('home');}
function salvarImp(){let t=document.getElementById('i_txt').value;if(!t)return;cifras.unshift({id:Date.now(),titulo:document.getElementById('i_tit').value||'Importada',artista:document.getElementById('i_art').value||'Importada',tom:'G',texto:t,orig:t});save();show('home');}
function save(){localStorage.setItem('mc_cifras',JSON.stringify(cifras));localStorage.setItem('mc',JSON.stringify(cifras));}
function renderLista(){let q=(document.getElementById('localQ')?.value||'').toLowerCase();let list=cifras.filter(c=>(c.titulo+' '+c.artista).toLowerCase().includes(q));document.getElementById('count').innerText='('+list.length+')';let h='';list.forEach(c=>{h+=`<div class="list-item" onclick="abrir(${c.id})"><div><b style="color:var(--gold2)">${c.titulo}</b><br><small style="opacity:.6">${c.artista} - Tom ${c.tom}</small></div></div>`});document.getElementById('lista').innerHTML=h||'<p style="opacity:.5">Nenhuma cifra. Importe a primeira!</p>';}
function abrir(id){atual=cifras.find(c=>c.id===id);tr=0;fz=parseInt(localStorage.getItem('mc_fz')||'16');document.getElementById('l_tit').innerText=atual.titulo.toUpperCase();document.getElementById('l_art').innerText=atual.artista.toUpperCase();document.getElementById('tomTag').innerText='Tom: '+(atual.tom||'G');document.getElementById('l_cifra').innerHTML=color(atual.texto);applyFont();document.getElementById('btnSimples').innerText='Cifra Simples';document.getElementById('btnSimples').className='btn';show('leitor');}
function color(t){return t.replace(/\[([^\]]+)\]/g,'<b>[$1]</b>').replace(/(^|\n)(Em7|C7M|Bm7|Am7|D7\(4\/9\)|G|[A-G][#b]?m?7?M?\(?[0-9\/]*\)?)/g,'$1<b>$2</b>');}
function toggleSimples(){simples=!simples;let btn=document.getElementById('btnSimples');if(simples){btn.innerText='★ SIMPLES ON';btn.className='btn btn-gold';let s=atual.orig.replace(/\[([^\]]+)\]/g,(a,inside)=>{let base=inside.match(/^[A-G][#b]?/);if(!base)return '['+inside+']';let b=base[0];let map={'C#':'C','D#':'D','F#':'F','G#':'G','A#':'A','Db':'C','Eb':'D','Gb':'F','Ab':'G','Bb':'A'};let nb=map[b]||b.replace('#','').replace('b','');let isMinor=inside.toLowerCase().includes('m')&&!inside.toLowerCase().includes('maj');return '['+nb+(isMinor?'m':'')+']';}).replace(/\b(Em7|C7M|Bm7|Am7|D7\(4\/9\))\b/g,(m)=>{let map2={'Em7':'Em','C7M':'C','Bm7':'Bm','Am7':'Am','D7(4/9)':'D'};return map2[m]||m;});document.getElementById('l_cifra').innerHTML=color(s)+'<br><br><small style="color:var(--gold2)">💡 Simplificado: Em7→Em, C7M→C, D7(4/9)→D. Capo 2ª = tom original.</small>';}else{btn.innerText='Cifra Simples';btn.className='btn';document.getElementById('l_cifra').innerHTML=color(atual.orig);}}
function transp(d){tr+=d;let notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];let txt=atual.orig.replace(/\[([A-G][#b]?)([^\]]*)\]/g,(a,b,r)=>{let i=notes.indexOf(b);if(i<0)return a;return '['+notes[(i+tr+12*10)%12]+r+']';});document.getElementById('l_cifra').innerHTML=color(txt);}
function applyFont(){document.getElementById('l_cifra').style.fontSize=fz+'px';document.getElementById('fontTag').innerText=fz+'px';localStorage.setItem('mc_fz',fz);}
function fontSize(d,reset){if(reset)fz=16;else fz=Math.min(32,Math.max(10,fz+d));applyFont();}
function toggleScroll(){if(scrollTimer){stopScroll();return;}scrollTimer=setInterval(()=>window.scrollBy(0,vel),40);document.getElementById('playBtn').innerText='⏸️ Pausar';}
function stopScroll(){if(scrollTimer)clearInterval(scrollTimer);scrollTimer=null;let b=document.getElementById('playBtn');if(b)b.innerText='▶️ Play';}
function updateSpeed(){vel=parseInt(document.getElementById('speed').value);document.getElementById('speedTag').innerText=vel+'x';}
renderLista();
</script>
</body>
</html>
