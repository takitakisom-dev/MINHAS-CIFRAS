<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Cifras v33</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a2f1e;--card:#123a25;--accent:#ffeb3b;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:var(--bg);border-bottom:2px solid var(--accent);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:var(--accent);font-weight:bold;font-size:18px}
.btn{border:2px solid var(--accent);background:transparent;color:var(--accent);padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px}
.btn-amarelo{background:var(--accent);color:#0a2f1e}
.btn-vermelho{background:#ff4444;color:white;border-color:#ff4444}
.card{background:var(--card);border:1px solid rgba(255,235,59,0.3);border-radius:16px;padding:14px;margin:12px}
.input-busca{width:100%;padding:12px;border-radius:12px;border:2px solid rgba(255,235,59,0.3);background:rgba(0,0,0,0.3);color:white;margin-top:8px}
.cifra-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;border-radius:10px}
.cifra-item:hover{background:rgba(255,235,59,0.1)}
.cifra-item b{color:var(--accent);text-transform:uppercase;font-size:17px}
.acoes button{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);margin-left:6px;font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;justify-content:center;align-items:center;z-index:100;padding:10px}
.modal.aberto{display:flex}
.modal-box{background:#123a25;border:2px solid var(--accent);border-radius:16px;padding:16px;width:100%;max-width:680px;max-height:94vh;overflow:auto;color:white}
#boxLeitor{background:#123a25;border:2px solid var(--accent);border-radius:16px;width:98%;max-width:98%;height:94vh;display:flex;flex-direction:column;overflow:hidden;padding:0;position:relative}
.topo-fixo{padding:12px;background:inherit;border-bottom:1px solid rgba(255,235,59,0.2);flex-shrink:0;transition:all 0.3s}
#leitorConteudo{flex:1;overflow:auto;padding:12px;white-space:pre-wrap;line-height:1.4;font-size:22px}
.estilo-mao{font-family:'Kalam',cursive}
.estilo-maquina{font-family:'Courier Prime',monospace}
.cifra-line{color:var(--accent);font-weight:bold;margin-top:4px;margin-bottom:0;line-height:1.2}
.cifra-line.vermelha{color:#ff4444!important}
.cifra-line.dourada{color:#ffeb3b!important}
.linha-letra{margin-bottom:8px;line-height:1.3}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:8px;background:rgba(0,0,0,0.3);border-radius:12px;align-items:center}
#btnInstalar{width:100%;padding:14px;font-size:16px;margin-bottom:12px;display:block}
.secao-menu{margin:12px 0;padding:10px;border-bottom:1px solid rgba(255,235,59,0.2)}
.secao-menu h4{color:var(--accent);margin-bottom:6px}
/* TELA CHEIA LIMPA */
#boxLeitor:fullscreen{width:100vw;height:100vh;max-width:100vw;border:none;border-radius:0;background:#0a2f1e}
#boxLeitor:fullscreen.topo-fixo{opacity:0;pointer-events:none;height:0;padding:0;overflow:hidden}
#boxLeitor:fullscreen.topo-fixo.mostrar{opacity:1;pointer-events:auto;height:auto;padding:12px;position:absolute;top:0;left:0;right:0;z-index:999;background:#0a2f1e;border-bottom:2px solid var(--accent)}
#boxLeitor:fullscreen #leitorConteudo{padding:20px;font-size:26px;background:#0a2f1e}
textarea,input[type=text],input[type=range]{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin:8px 0}
</style>
</head>
<body>
<header>
<button class="btn" onclick="toggleMenu()">☰</button>
<div class="logo">♪ MINHAS CIFRAS v33</div>
<button class="btn btn-amarelo" onclick="renderLista()">Home</button>
</header>

<div id="menuLateral" class="modal"><div class="modal-box">
<h2 style="color:var(--accent)">Menu Completo</h2>
<button id="btnInstalar" class="btn btn-amarelo" onclick="instalarApp()">📲 INSTALAR APP</button>
<div class="secao-menu"><h4>🎨 Aparência</h4>
<button class="btn" onclick="mudarEstilo('mao')">✍️ Mão</button>
<button class="btn" onclick="mudarEstilo('maquina')">⌨️ Máquina</button><br>
<button class="btn" onclick="mudarCorCifra('dourada')">Dourada</button>
<button class="btn btn-vermelho" onclick="mudarCorCifra('vermelha')">Vermelha</button><br>
<button class="btn" onclick="mudarTemaLeitor('verde')">Fundo Verde</button>
<button class="btn" onclick="mudarTemaLeitor('branco')">Fundo Branco</button>
<button class="btn" onclick="mudarTemaLeitor('preto')">Fundo Preto</button>
</div>
<div class="secao-menu"><h4>🔤 Letra</h4><input type="range" min="14" max="36" value="22" id="rangeFonte" oninput="mudarFonte(this.value)"><span id="valFonte">22px</span></div>
<div class="secao-menu"><h4>📜 Rolagem</h4><input type="range" min="1" max="10" value="3" id="rangeVel" oninput="mudarVelocidade(this.value)"><span id="valVel">Vel: 3</span><br><button class="btn btn-amarelo" onclick="iniciarRolagem()">▶️ Rolagem</button><button class="btn" onclick="pararRolagem()">⏸️ Parar</button></div>
<button class="btn" onclick="fecharMenu()">Fechar</button>
</div></div>

<div class="card">
<button class="btn btn-amarelo" onclick="abrirNova()">+ Nova Cifra</button>
<button class="btn" onclick="abrirColar()">📄 Colar Manual</button>
<input id="busca" class="input-busca" placeholder="🔍 Buscar..." oninput="renderLista()">
</div>

<div class="card"><h2 style="color:var(--accent)">Minhas Cifras (<span id="total">0</span>)</h2><div id="lista"></div></div>

<div id="modalLeitor" class="modal"><div id="boxLeitor">
<div class="topo-fixo" id="topoFixo">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap">
<button class="btn" onclick="fecharLeitor()">⬅ Voltar</button>
<div><button class="btn" onclick="mudarFonte(-1)">A-</button><button class="btn" onclick="mudarFonte(1)">A+</button><button class="btn btn-amarelo" onclick="toggleTelaCheia()">⛶ Tela Cheia</button></div>
</div>
<div class="toolbar">
<button class="btn" id="btnRola" onclick="toggleRolagem()">▶️ Rolagem</button>
<button class="btn" onclick="mudarEstilo('mao')">✍️ Mão</button><button class="btn" onclick="mudarEstilo('maquina')">⌨️ Máquina</button>
<button class="btn" onclick="mudarCorCifra('dourada')">Dourada</button><button class="btn btn-vermelho" onclick="mudarCorCifra('vermelha')">Vermelha</button>
</div>
<h2 id="leitorTitulo" style="color:var(--accent);margin-top:8px"></h2>
<div style="text-align:center;color:rgba(255,255,255,0.5);font-size:12px;margin-top:4px">Toque na letra na tela cheia pra mostrar os botões</div>
</div>
<div id="leitorConteudo" class="estilo-mao"></div>
</div></div>

<div id="modalEditar" class="modal"><div class="modal-box">
<input id="editTitulo" type="text" placeholder="Nome da música"><input id="editArtista" type="text" placeholder="Artista"><textarea id="editConteudo" rows="16"></textarea>
<button class="btn btn-amarelo" onclick="salvarCifra()">Salvar</button><button class="btn" onclick="fecharEditar()">Cancelar</button>
</div></div>

<div id="modalColar" class="modal"><div class="modal-box"><textarea id="colarTexto" rows="16" placeholder="Cole a cifra completa"></textarea><button class="btn btn-amarelo" onclick="processarColar()">Importar</button><button class="btn" onclick="fecharColar()">Cancelar</button></div></div>

<script>
let cifras=JSON.parse(localStorage.getItem('minhasCifras_v27')||localStorage.getItem('minhasCifras')||'[]');
let editId=null,estiloAtual=localStorage.getItem('estilo')||'mao',corCifra=localStorage.getItem('corCifra')||'dourada',fontSize=parseInt(localStorage.getItem('fontSize')||'22'),velRolagem=parseInt(localStorage.getItem('velRolagem')||'3'),rolando=false,intervaloRolagem=null,deferredPrompt=null,escondeTopoTimer=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function instalarApp(){if(deferredPrompt)deferredPrompt.prompt();else alert('3 pontinhos > Instalar app');}
function toggleMenu(){menuLateral.classList.toggle('aberto');}
function fecharMenu(){menuLateral.classList.remove('aberto');}
function salvarStorage(){localStorage.setItem('minhasCifras_v27',JSON.stringify(cifras));localStorage.setItem('minhasCifras',JSON.stringify(cifras));}
function renderLista(){const b=busca.value.toLowerCase();const f=cifras.filter(c=>c.titulo.toLowerCase().includes(b)||c.artista.toLowerCase().includes(b));total.innerText=f.length;lista.innerHTML=f.map(c=>`<div class="cifra-item" onclick="abrirLeitor(${c.id})"><div><b>${c.titulo}</b><br><small>${c.artista}</small></div><div class="acoes" onclick="event.stopPropagation()"><button class="btn" onclick="editarCifra(${c.id})">✏️</button><button class="btn btn-vermelho" onclick="excluirCifra(${c.id})">🗑️</button><button class="btn btn-amarelo" onclick="abrirLeitor(${c.id})">+</button></div></div>`).join('');}
renderLista();
function abrirNova(){editId=null;editTitulo.value='';editArtista.value='';editConteudo.value='';modalEditar.classList.add('aberto');}
function editarCifra(id){const c=cifras.find(x=>x.id===id);editId=id;editTitulo.value=c.titulo;editArtista.value=c.artista;editConteudo.value=c.conteudo;modalEditar.classList.add('aberto');}
function fecharEditar(){modalEditar.classList.remove('aberto');}
function salvarCifra(){const t=editTitulo.value,a=editArtista.value,co=editConteudo.value;if(!t)return alert('Nome');if(editId)Object.assign(cifras.find(x=>x.id===editId),{titulo:t,artista:a,conteudo:co});else cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co});salvarStorage();fecharEditar();renderLista();}
function excluirCifra(id){if(confirm('Excluir?')){cifras=cifras.filter(x=>x.id!==id);salvarStorage();renderLista();}}
function abrirColar(){modalColar.classList.add('aberto');}
function fecharColar(){modalColar.classList.remove('aberto');}
function processarColar(){const txt=colarTexto.value;if(!txt)return;cifras.push({id:Date.now(),titulo:'IMPORTADA',artista:'Cifra Club',conteudo:txt});salvarStorage();fecharColar();renderLista();abrirLeitor(cifras[cifras.length-1].id);}
function abrirLeitor(id){const c=cifras.find(x=>x.id===id);if(!c)return;leitorTitulo.innerText=c.titulo+' - '+c.artista;renderConteudoCifra(c.conteudo);modalLeitor.classList.add('aberto');aplicarEstilo();aplicarFonte();leitorConteudo.scrollTop=0;}
function fecharLeitor(){pararRolagem();modalLeitor.classList.remove('aberto');if(document.fullscreenElement)document.exitFullscreen();}
function renderConteudoCifra(texto){
 let html='';
 texto.split('\n').forEach(l=>{
  if(l.trim()===''){html+=`<div style="height:4px"></div>`;return;}
  let isCifra = l.trim().length < 60 && /^[A-G][#b]?(m|maj|7|9|6|sus|dim|add)?[\s\/A-G#b0-9m()\-]*$/.test(l.trim()) && l.trim().split(/\s+/).length <= 7 && /[A-G]/.test(l);
  if(isCifra){html+=`<div class="cifra-line ${corCifra}">${l}</div>`;}
  else{html+=`<div class="linha-letra">${l}</div>`;}
 });
 leitorConteudo.innerHTML=html;
}
function mudarEstilo(e){estiloAtual=e;localStorage.setItem('estilo',e);aplicarEstilo();}
function aplicarEstilo(){leitorConteudo.className=estiloAtual==='mao'?'estilo-mao':'estilo-maquina';}
function mudarCorCifra(c){corCifra=c;localStorage.setItem('corCifra',c);document.querySelectorAll('.cifra-line').forEach(x=>x.className='cifra-line '+c);}
function mudarTemaLeitor(t){if(t==='branco'){boxLeitor.style.background='white';leitorConteudo.style.color='black';}else if(t==='preto'){boxLeitor.style.background='black';leitorConteudo.style.color='white';}else{boxLeitor.style.background='#123a25';leitorConteudo.style.color='white';}}
function mudarFonte(v){if(typeof v==='number')fontSize+=v;else fontSize=parseInt(v);fontSize=Math.max(12,Math.min(48,fontSize));localStorage.setItem('fontSize',fontSize);aplicarFonte();}
function aplicarFonte(){leitorConteudo.style.fontSize=fontSize+'px';valFonte.innerText=fontSize+'px';rangeFonte.value=fontSize;}
function mudarVelocidade(v){velRolagem=parseInt(v);localStorage.setItem('velRolagem',v);valVel.innerText='Vel: '+v;if(rolando){pararRolagem();iniciarRolagem();}}
function iniciarRolagem(){if(rolando)return;rolando=true;btnRola.innerText='⏸️ Parar';intervaloRolagem=setInterval(()=>{leitorConteudo.scrollTop+=1;}, 130 - velRolagem*11);}
function pararRolagem(){rolando=false;btnRola.innerText='▶️ Rolagem';clearInterval(intervaloRolagem);}
function toggleRolagem(){rolando?pararRolagem():iniciarRolagem();}
function toggleTelaCheia(){
 if(!document.fullscreenElement){
  boxLeitor.requestFullscreen().then(()=>{
    topoFixo.classList.remove('mostrar');
  });
 }else{ document.exitFullscreen(); }
}
leitorConteudo.addEventListener('click', ()=>{
 if(document.fullscreenElement){
  topoFixo.classList.add('mostrar');
  clearTimeout(escondeTopoTimer);
  escondeTopoTimer=setTimeout(()=>topoFixo.classList.remove('mostrar'), 3500);
 }
});
document.addEventListener('fullscreenchange', ()=>{
 if(!document.fullscreenElement){ topoFixo.classList.remove('mostrar'); }
});
async function buscarCifraCompleta(url){
 try{
  const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
  const res=await fetch(proxy);
  const html=await res.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  let cifra=doc.querySelector('pre')?.innerText||'';
  if(!cifra){let m=html.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i);if(m)cifra=m[1].replace(/<[^>]+>/g,'');}
  return cifra.trim().substring(0,15000);
 }catch(e){return '';}
}
window.addEventListener('DOMContentLoaded',async ()=>{
 const p=new URLSearchParams(location.search);
 const url=p.get('url')||'', text=p.get('text')||'', title=p.get('title')||'';
 if(url||text){
  let conteudo=text||'', titulo=title||'IMPORTADA';
  if(url.includes('cifraclub')){
   modalEditar.classList.add('aberto');
   editTitulo.value='Buscando letra completa...';
   const letra=await buscarCifraCompleta(url);
   conteudo=letra|| (text+'\n'+url);
   titulo=title||url.split('/').pop().replace(/-/g,' ').toUpperCase()||'IMPORTADA';
  }
  editId=null;editTitulo.value=titulo;editArtista.value='Cifra Club';editConteudo.value=conteudo;modalEditar.classList.add('aberto');history.replaceState({},'',location.pathname);
 }
});
aplicarFonte();aplicarEstilo();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script>
</body>
</html>
