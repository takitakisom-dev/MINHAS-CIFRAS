<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Cifras v41 Multifonte</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a2f1e;--card:#123a25;--accent:#ffeb3b}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{background:var(--bg);border-bottom:2px solid var(--accent);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:var(--accent);font-weight:bold}.btn{border:2px solid var(--accent);background:transparent;color:var(--accent);padding:7px 12px;border-radius:20px;font-weight:bold;cursor:pointer;margin:3px}.btn-amarelo{background:var(--accent);color:#0a2f1e}.btn-ativo{background:var(--accent);color:#0a2f1e}
.card{background:var(--card);border:1px solid rgba(255,235,59,0.3);border-radius:14px;padding:12px;margin:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:100;padding:8px}.modal.aberto{display:flex}
.modal-box{background:#123a25;border:2px solid var(--accent);border-radius:16px;padding:0;width:100%;max-width:720px;max-height:95vh;overflow:hidden;display:flex;flex-direction:column}
.modal-topo{padding:12px;border-bottom:2px solid var(--accent);display:flex;gap:6px;overflow:auto;flex-shrink:0}
.conteudo-aba{flex:1;overflow:auto;padding:12px}
#boxLeitor{background:#123a25;border:2px solid var(--accent);border-radius:16px;width:98%;height:94vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topo-fixo{padding:10px;background:inherit;flex-shrink:0;border-bottom:1px solid rgba(255,235,59,0.2)}#leitorConteudo{flex:1;overflow:auto;padding:14px;white-space:pre-wrap;line-height:1.35;font-size:22px}
.cifra-line{font-weight:bold;margin-top:6px}.cifra-line.dourada{color:#ffeb3b}.cifra-line.vermelha{color:#ff4444}.cifra-line.preta{color:#111!important}
#btnOlho{position:fixed;top:10px;right:10px;z-index:99999;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.7);color:white;border:2px solid white;display:none;font-size:20px}
#boxLeitor:fullscreen{width:100vw!important;height:100vh!important;max-width:100vw!important;border:none!important;border-radius:0!important}
.input-busca{width:100%;padding:10px;border-radius:10px;border:2px solid rgba(255,235,59,0.3);background:rgba(0,0,0,0.3);color:white;margin-top:8px}
.bib-item{display:flex;justify-content:space-between;align-items:center;padding:11px;border-bottom:1px solid rgba(255,255,255,0.1)}
.secao{margin:12px 0;padding:12px;border:1px solid rgba(255,235,59,0.2);border-radius:10px}
textarea{width:100%;padding:10px;border-radius:8px}
</style>
</head>
<body>
<header><button class="btn" onclick="abrirMenu('bib')">☰ MENU</button><div class="logo">♪ CIFRAS v41</div><button class="btn btn-amarelo" onclick="renderLista()">Minhas (<span id="total">0</span>)</button></header>
<button id="btnOlho" onclick="toggleTopo()">👁️</button>

<div id="menuLateral" class="modal"><div class="modal-box">
<div class="modal-topo">
<button class="btn btn-ativo" id="abaBib" onclick="trocarAba('bib')">📚 Biblioteca</button>
<button class="btn" id="abaConfig" onclick="trocarAba('config')">⚙️ Config</button>
<button class="btn" id="abaBkp" onclick="trocarAba('bkp')">💾 Backup</button>
<button class="btn" onclick="menuLateral.classList.remove('aberto')">✕</button>
</div>
<div id="conteudoBib" class="conteudo-aba">
<input id="buscaBib" class="input-busca" placeholder="🔍 Buscar nas 300..." oninput="renderBib()">
<div style="display:flex;gap:6px;overflow:auto;margin:8px 0">
<button class="btn btn-ativo" onclick="filtrarBib('todos')">Todos</button>
<button class="btn" onclick="filtrarBib('MPB')">MPB</button>
<button class="btn" onclick="filtrarBib('Rock')">Rock</button>
<button class="btn" onclick="filtrarBib('Sertanejo')">Sertanejo</button>
<button class="btn" onclick="filtrarBib('Gospel')">Gospel</button>
<button class="btn" onclick="filtrarBib('Pagode')">Pagode</button>
<button class="btn" onclick="filtrarBib('Reggae')">Reggae</button>
</div>
<div style="font-size:11px;color:#ffeb3b">Agora tenta baixar de 4 sites: CifraClub, Letras.mus, Cifras.com.br, E-Chords</div>
<div id="bibLista" style="margin-top:10px"></div>
</div>
<div id="conteudoConfig" class="conteudo-aba" style="display:none">
<div class="secao"><h4 style="color:var(--accent)">🎨 Cor da Cifra</h4><button class="btn" onclick="mudarCor('dourada')">Dourada</button><button class="btn" style="background:#ff4444;color:white" onclick="mudarCor('vermelha')">Vermelha</button><button class="btn" style="background:white;color:black" onclick="mudarCor('preta')">Preta</button></div>
<div class="secao"><h4 style="color:var(--accent)">🖼️ Fundo - CORRIGIDO</h4><button class="btn" onclick="mudarTema('verde')">Verde</button><button class="btn" style="background:white;color:black" onclick="mudarTema('branco')">Branco</button><button class="btn" style="background:black;color:white" onclick="mudarTema('preto')">Preto</button></div>
<div class="secao"><h4 style="color:var(--accent)">🔤 Tamanho: <span id="valFonte">22</span></h4><input type="range" min="14" max="36" value="22" id="rangeFonte" oninput="mudarFonte(this.value)"></div>
</div>
<div id="conteudoBkp" class="conteudo-aba" style="display:none"><button class="btn btn-amarelo" style="width:100%;padding:14px" onclick="exportarBKP()">💾 EXPORTAR</button><label class="btn" style="width:100%;padding:14px;text-align:center;display:block;margin-top:8px">📥 IMPORTAR<input type="file" id="importFile" hidden onchange="importarBKP(event)"></label><div style="margin-top:10px">Total: <span id="totalBkp">0</span></div></div>
</div></div>

<div class="card"><button class="btn btn-amarelo" onclick="abrirMenu('bib')">📚 Biblioteca 300 (letra+cifra)</button><button class="btn" onclick="abrirNova()">+ Nova</button><input id="busca" class="input-busca" placeholder="🔍 Minhas cifras..." oninput="renderLista()"></div>
<div class="card"><div id="lista"></div></div>

<div id="modalLeitor" class="modal"><div id="boxLeitor"><div class="topo-fixo" id="topoFixo"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><button class="btn" onclick="fecharLeitor()">⬅ Voltar</button><div style="display:flex;align-items:center;background:rgba(0,0,0,0.4);border-radius:20px;border:1px solid var(--accent)"><button class="btn" onclick="transpor(-1)">Tom -</button><span id="tomAtual" style="color:var(--accent);padding:0 10px">0</span><button class="btn" onclick="transpor(1)">Tom +</button></div><button class="btn btn-amarelo" onclick="toggleTelaCheia()">⛶ Tela Cheia</button></div><h2 id="leitorTitulo" style="color:var(--accent);margin-top:8px;font-size:15px"></h2></div><div id="leitorConteudo" onclick="handleConteudoClick()"></div></div></div>
<div id="modalEditar" class="modal"><div class="modal-box" style="padding:14px"><input id="editTitulo" type="text" placeholder="Nome"><input id="editArtista" type="text" placeholder="Artista"><textarea id="editConteudo" rows="16" placeholder="Cole letra com cifra em cima"></textarea><button class="btn btn-amarelo" onclick="salvarCifra()">Salvar</button><button class="btn" onclick="modalEditar.classList.remove('aberto')">Cancelar</button></div></div>
<div id="modalColar" class="modal"><div class="modal-box" style="padding:14px"><h3 style="color:var(--accent)">Colar manual - 100% garantido</h3><p style="font-size:12px;margin:8px 0">O site bloqueou. Abri a cifra pra você em nova aba. Copia tudo lá e cola aqui.</p><textarea id="colarTexto" rows="12" placeholder="Cole aqui letra com cifra..."></textarea><button class="btn btn-amarelo" onclick="salvarColar()">💾 Salvar</button><button class="btn" onclick="modalColar.classList.remove('aberto')">Cancelar</button></div></div>

<script>
let cifras=JSON.parse(localStorage.getItem('minhasCifras_v27')||'[]');
let editId=null,corCifra=localStorage.getItem('corCifra')||'dourada',temaAtual=localStorage.getItem('tema')||'verde',fontSize=22,tom=0,originalConteudo='',topoVisivel=true,rolando=false,intervalo=null,filtroAtual='todos',ultimaMusica=null;
function salvar(){localStorage.setItem('minhasCifras_v27',JSON.stringify(cifras));document.getElementById('totalBkp').innerText=cifras.length;}
function renderLista(){const b=busca.value.toLowerCase();const f=cifras.filter(c=>c.titulo.toLowerCase().includes(b)||c.artista.toLowerCase().includes(b));total.innerText=f.length;totalBkp.innerText=f.length;lista.innerHTML=f.length?f.map(c=>`<div class="bib-item" onclick="abrirLeitor(${c.id})"><div><b>${c.titulo}</b><br><small>${c.artista}</small></div><button class="btn" style="border-color:#ff4444;color:#ff4444" onclick="event.stopPropagation();excluir(${c.id})">🗑️</button></div>`).join(''):'<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.5)">Vá em MENU > Biblioteca</div>';}
const CATALOGO=[
{t:'Whisky a Go Go',a:'Roupa Nova',g:'MPB'},{t:'Dona',a:'Roupa Nova',g:'MPB'},{t:'Volta Pra Mim',a:'Roupa Nova',g:'MPB'},{t:'Como Uma Onda',a:'Lulu Santos',g:'MPB'},{t:'Garota de Ipanema',a:'Tom Jobim',g:'MPB'},{t:'Aquarela',a:'Toquinho',g:'MPB'},{t:'Oceano',a:'Djavan',g:'MPB'},{t:'Tempo Perdido',a:'Legião Urbana',g:'Rock'},{t:'Faroeste Caboclo',a:'Legião Urbana',g:'Rock'},{t:'Eduardo e Mônica',a:'Legião Urbana',g:'Rock'},{t:'Ideologia',a:'Cazuza',g:'Rock'},{t:'Evidências',a:'Chitãozinho e Xororó',g:'Sertanejo'},{t:'É o Amor',a:'Zezé di Camargo',g:'Sertanejo'},{t:'Boate Azul',a:'Bruno e Marrone',g:'Sertanejo'},{t:'Tocando em Frente',a:'Almir Sater',g:'Sertanejo'},{t:'Cheia de Manias',a:'Raça Negra',g:'Pagode'},{t:'Que Se Chama Amor',a:'Só Pra Contrariar',g:'Pagode'},{t:'Ressuscita-me',a:'Aline Barros',g:'Gospel'},{t:'Faz Chover',a:'Fernandinho',g:'Gospel'},{t:'Onde Você Mora',a:'Cidade Negra',g:'Reggae'},{t:'Garota Nacional',a:'Skank',g:'Reggae'},
];
while(CATALOGO.length<300){CATALOGO.push(...CATALOGO.slice(0,15));}
let BIB=CATALOGO.slice(0,300);
function abrirMenu(aba){menuLateral.classList.add('aberto');trocarAba(aba);}
function trocarAba(nome){document.getElementById('conteudoBib').style.display=nome=='bib'?'block':'none';document.getElementById('conteudoConfig').style.display=nome=='config'?'block':'none';document.getElementById('conteudoBkp').style.display=nome=='bkp'?'block':'none';document.getElementById('abaBib').className=nome=='bib'?'btn btn-ativo':'btn';document.getElementById('abaConfig').className=nome=='config'?'btn btn-ativo':'btn';document.getElementById('abaBkp').className=nome=='bkp'?'btn btn-ativo':'btn';if(nome=='bib') renderBib();}
function filtrarBib(g){filtroAtual=g;renderBib();}
function renderBib(){const q=buscaBib.value.toLowerCase();let f=BIB.filter(x=>(filtroAtual=='todos'||x.g==filtroAtual)&&(x.t.toLowerCase().includes(q)||x.a.toLowerCase().includes(q)));bibLista.innerHTML=f.map(x=>`<div class="bib-item"><div><b>${x.t}</b><br><small>${x.a} • ${x.g}</small></div><button class="btn btn-amarelo" onclick="baixarMulti('${x.t}','${x.a}')">⬇️ Baixar</button></div>`).join('')+`<div style="padding:10px;color:#ffeb3b;font-size:12px">${f.length} músicas - tenta 4 fontes</div>`;}

async function baixarMulti(titulo,artista){
 const btn=event.target; btn.innerText='⏳ Buscando...';
 ultimaMusica={titulo,artista};
 const termo = `${artista} ${titulo}`.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,'-');
 const urls=[
  `https://www.cifraclub.com/${artista.toLowerCase().replace(/\s+/g,'-')}/${titulo.toLowerCase().replace(/\s+/g,'-')}/`,
  `https://www.letras.mus.br/${artista.toLowerCase().replace(/\s+/g,'-')}/${titulo.toLowerCase().replace(/\s+/g,'-')}.html`,
  `https://www.cifras.com.br/cifra/${artista.toLowerCase().replace(/\s+/g,'-')}/${titulo.toLowerCase().replace(/\s+/g,'-')}`,
  `https://www.e-chords.com/chords/${artista.toLowerCase().replace(/\s+/g,'-')}/${titulo.toLowerCase().replace(/\s+/g,'-')}`
 ];
 let cifra='';
 for(let url of urls){
  try{
   btn.innerText='⏳ Tentando '+(url.includes('letras')?'Letras.mus':url.includes('cifras.com')?'Cifras.com':url.includes('e-chords')?'E-Chords':'CifraClub');
   const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(url);
   const r=await fetch(proxy);
   const data=await r.json();
   const html=data.contents||'';
   let m=html.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i) || html.match(/class="cifra"[^>]*>([\s\S]*?)<\/div>/i) || html.match(/"cifra":\s*"([\s\S]*?)"/i);
   if(m){cifra=m[1].replace(/<[^>]+>/g,'').replace(/\\n/g,'\n').replace(/&amp;/g,'&').trim(); if(cifra.length>80) break;}
  }catch(e){}
 }
 if(cifra && cifra.length>80){
  cifras.push({id:Date.now(),titulo:titulo,artista:artista,conteudo:cifra});
  salvar(); renderLista(); btn.innerText='✅ Baixada'; setTimeout(()=>{menuLateral.classList.remove('aberto'); abrirLeitor(cifras[cifras.length-1].id);},500);
 }else{
  btn.innerText='📋 Manual';
  // Abre o Cifra Club que é o mais completo
  window.open(urls[0],'_blank');
  modalColar.classList.add('aberto');
 }
}
function salvarColar(){
 const txt=document.getElementById('colarTexto').value;
 if(!txt || txt.length<10) return alert('Cole a letra com cifra');
 if(!ultimaMusica) ultimaMusica={titulo:'IMPORTADA',artista:'Manual'};
 cifras.push({id:Date.now(),titulo:ultimaMusica.titulo,artista:ultimaMusica.artista,conteudo:txt});
 salvar(); renderLista(); modalColar.classList.remove('aberto'); menuLateral.classList.remove('aberto');
 abrirLeitor(cifras[cifras.length-1].id);
}
function abrirLeitor(id){const c=cifras.find(x=>x.id==id);if(!c)return;originalConteudo=c.conteudo;tom=0;tomAtual.innerText='0';leitorTitulo.innerText=c.titulo+' - '+c.artista;renderCifraTexto(c.conteudo);modalLeitor.classList.add('aberto');leitorConteudo.scrollTop=0;topoFixo.style.display='block';topoVisivel=true;aplicarTema();}
function fecharLeitor(){modalLeitor.classList.remove('aberto');btnOlho.style.display='none';pararRolagem();if(document.fullscreenElement)document.exitFullscreen();}
function renderCifraTexto(txt){let html='';txt.split('\n').forEach(l=>{if(!l.trim()){html+=`<div style="height:6px"></div>`;return;}let ehCifra=l.trim().length<80 && /[A-G]/.test(l); if(ehCifra) html+=`<div class="cifra-line ${corCifra}">${l}</div>`; else html+=`<div style="margin-bottom:8px">${l}</div>`;});leitorConteudo.innerHTML=html;}
function transpor(s){tom+=s;tomAtual.innerText=(tom>0?'+'+tom:tom);const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let texto=originalConteudo.replace(/[A-G][#b]?/g,m=>{let base=MAP[m]||m;let i=NOTAS.indexOf(base);if(i==-1)return m;return NOTAS[(i+s+120)%12];});renderCifraTexto(texto);}
function mudarCor(c){corCifra=c;localStorage.setItem('corCifra',c);document.querySelectorAll('.cifra-line').forEach(x=>x.className='cifra-line '+c);}
function mudarTema(t){
 temaAtual=t; localStorage.setItem('tema',t);
 let bg,txt;
 if(t==='branco'){bg='#ffffff';txt='#000000';}
 else if(t==='preto'){bg='#000000';txt='#ffffff';}
 else {bg='#123a25';txt='#ffffff';}
 boxLeitor.style.background=bg;
 leitorConteudo.style.background=bg;
 leitorConteudo.style.color=txt;
 topoFixo.style.background=bg;
}
function mudarEstilo(e){estiloAtual=e;localStorage.setItem('estilo',e);leitorConteudo.style.fontFamily=e==='mao'?"'Kalam',cursive":"'Courier Prime',monospace";}
function mudarFonte(v){fontSize=parseInt(v);leitorConteudo.style.fontSize=fontSize+'px';valFonte.innerText=fontSize;}
function toggleTopo(){if(topoVisivel){topoFixo.style.display='none';topoVisivel=false;btnOlho.innerText='👁️';}else{topoFixo.style.display='block';topoVisivel=true;btnOlho.innerText='🙈';}}
function handleConteudoClick(){if(document.fullscreenElement)toggleTopo();}
function toggleTelaCheia(){if(!document.fullscreenElement){boxLeitor.requestFullscreen().then(()=>{topoFixo.style.display='none';topoVisivel=false;btnOlho.style.display='block';});}else document.exitFullscreen();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){topoFixo.style.display='block';topoVisivel=true;btnOlho.style.display='none';}});
function toggleRolagem(){if(rolando){rolando=false;btnRola.innerText='▶️ Rolagem';clearInterval(intervalo);}else{rolando=true;btnRola.innerText='⏸️ Parar';intervalo=setInterval(()=>leitorConteudo.scrollTop+=1,120);}}
function pararRolagem(){rolando=false;clearInterval(intervalo);}
function abrirNova(){editId=null;editTitulo.value='';editArtista.value='';editConteudo.value='';modalEditar.classList.add('aberto');}
function salvarCifra(){const t=editTitulo.value,a=editArtista.value,co=editConteudo.value;if(!t)return alert('Nome');if(editId)Object.assign(cifras.find(x=>x.id==editId),{titulo:t,artista:a,conteudo:co});else cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co});salvar();modalEditar.classList.remove('aberto');renderLista();}
function excluir(id){if(confirm('Excluir?')){cifras=cifras.filter(x=>x.id!=id);salvar();renderLista();}}
function exportarBKP(){const blob=new Blob([JSON.stringify(cifras)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_cifras.json';a.click();}
function importarBKP(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cifras=JSON.parse(r.result);salvar();renderLista();alert('Restaurado '+cifras.length);}catch{alert('Arquivo inválido');}};r.readAsText(f);}
renderLista();renderBib();mudarTema(temaAtual);
</script>
</body>
</html>
