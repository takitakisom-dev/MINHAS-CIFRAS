<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINHAS CIFRAS v13</title>
<style>
:root{--green:#0a2f1e;--gold:#d4af37;--gold2:#f5d76e;--bg:#061a11}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:Roboto,system-ui;overflow:hidden}
.header{background:var(--green);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{color:var(--gold2);font-weight:900}.card{background:#102f1f;border:1px solid rgba(212,175,55,.35);border-radius:18px;padding:14px;margin:12px}
.btn{padding:10px 14px;border-radius:22px;font-weight:800;border:1px solid var(--gold);color:var(--gold2);background:transparent;cursor:pointer;font-size:13px}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0a2f1e;border:none}
.tag{background:rgba(212,175,55,.15);border:1px solid var(--gold);color:var(--gold2);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
input,textarea{width:100%;background:#0a1f14;border:1px solid rgba(212,175,55,.4);color:#fff;padding:12px;border-radius:12px;margin:6px 0;font-size:16px}
.cifra{background:#0a1f14;padding:16px;border-radius:14px;border:1px solid rgba(212,175,55,.3);height:58vh;overflow:auto;-webkit-overflow-scrolling:touch}
.cifra pre{white-space:pre; font-family:'Courier New',monospace; line-height:2.1; font-size:inherit; margin:0; overflow:visible}
.cifra b{color:var(--gold2);font-weight:900}
.list-item{padding:14px;border-bottom:1px solid rgba(212,175,55,.15);cursor:pointer}
.cifra.fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh!important;z-index:9999;border-radius:0;padding:65px 16px 20px 16px;background:#05120c}
.full-tools{position:fixed;top:0;left:0;right:0;background:#0a2f1e;border-bottom:2px solid var(--gold);padding:8px 10px;display:none;z-index:10000;gap:8px;align-items:center}
.full-tools.show{display:flex}
.side-menu{position:fixed;top:0;left:-320px;width:300px;height:100vh;background:#fff;z-index:10001;transition:.3s;box-shadow:4px 0 15px rgba(0,0,0,.5);display:flex;flex-direction:column}
.side-menu.open{left:0}.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:10000}.overlay.show{display:block}
.menu-top{background:linear-gradient(135deg,#66BB6A,#2E7D32);padding:20px 16px;color:#fff}.menu-list{flex:1;overflow-y:auto;padding:8px 0}.menu-list a{display:flex;gap:18px;padding:15px 20px;color:#616161;text-decoration:none;font-size:15px}
</style></head><body>
<div id="overlay" class="overlay" onclick="closeMenu()"></div>
<div id="sideMenu" class="side-menu"><div class="menu-top"><div style="font-size:32px">🎸</div><b>Cifras</b><br><small>androidcifras@gmail.com</small></div>
<div class="menu-list"><a href="#" onclick="show('home');closeMenu()">👥 Minhas músicas</a><a href="#" onclick="show('home');closeMenu();document.getElementById('webQ').focus()">🔍 Procurar Música</a><a href="#" onclick="show('importar');closeMenu()">📄 Importar.txt</a><a href="#" onclick="exportarBackup();closeMenu()">🔄 Backup</a><a href="#" onclick="closeMenu()">⚙️ Preferências</a></div></div>
<div class="header"><button style="font-size:22px;background:none;border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:6px 12px" onclick="openMenu()">☰</button><div class="logo">♫ MINHAS CIFRAS v13</div><button class="btn btn-gold" onclick="show('home')">Home</button></div>

<div id="fullTools" class="full-tools">
<button id="playFull" class="btn btn-gold" style="padding:6px 14px" onclick="playPause()">▶️</button>
<button class="btn" style="padding:6px 10px" onclick="stop()">⏹️</button>
<button class="btn" style="padding:6px 10px" onclick="fontM(-1)">A-</button><span id="fontTagFull" class="tag">14px</span><button class="btn" style="padding:6px 10px" onclick="fontM(1)">A+</button>
<input type="range" id="speedFull" min="0.5" max="10" step="0.5" value="2.5" style="width:80px" oninput="setSpeed(this.value)">
<span id="speedTagFull" class="tag">2.5x</span>
<button class="btn" style="margin-left:auto;background:#ff4444;color:#fff;border-color:#ff4444" onclick="expandir()">✕ Fechar</button>
</div>

<div id="home"><div class="card"><h3 style="color:var(--gold2)">🔍 Buscar</h3><input id="webQ" placeholder="Ex: Noite do Prazer"><div class="toolbar"><button class="btn btn-gold" onclick="buscar('cifraclub')">Cifra Club</button><button class="btn" onclick="buscar('google')">Google</button></div>
<div class="toolbar"><button class="btn btn-gold" onclick="show('nova')">+ Nova Cifra</button><button class="btn" onclick="show('importar')">Importar</button></div><input id="localQ" placeholder="🔍 Minhas cifras..." oninput="render()"></div><div class="card"><h3 style="color:var(--gold2)">Minhas Cifras <span id="count"></span></h3><div id="lista"></div></div></div>
<div id="nova" style="display:none" class="card"><input id="n_tit" placeholder="Título"><input id="n_art" placeholder="Artista"><input id="n_tom" placeholder="Tom"><textarea id="n_txt" rows="12"></textarea><div class="toolbar"><button class="btn btn-gold" onclick="salvarNova()">Salvar</button><button class="btn" onclick="show('home')">Cancelar</button></div></div>
<div id="importar" style="display:none" class="card"><h3 style="color:var(--gold2)">Importar.txt</h3><textarea id="i_txt" rows="14"></textarea><input id="i_tit" placeholder="Título"><input id="i_art" placeholder="Artista"><div class="toolbar"><button class="btn btn-gold" onclick="salvarImp()">Salvar</button><button class="btn" onclick="show('home')">Voltar</button></div></div>

<div id="leitor" style="display:none" class="card">
<div style="display:flex;justify-content:space-between"><div><h2 id="l_tit" style="color:var(--gold2)"></h2><p id="l_art" style="opacity:.6"></p></div><button class="btn" onclick="stop();show('home')">← Voltar</button></div>
<div class="toolbar"><button id="btnSimp" class="btn" onclick="toggleS()">Cifra Simples</button><button class="btn" onclick="transp(-1)">Tom -</button><span id="tomTag" class="tag">Tom: G</span><button class="btn" onclick="transp(1)">Tom +</button></div>
<div class="toolbar" style="background:rgba(0,0,0,.3);padding:10px;border-radius:12px"><span style="color:var(--gold2);font-weight:800;font-size:12px">TAMANHO (fixo com acordes):</span><button class="btn" onclick="fontM(-1)">A-</button><span id="fontTag" class="tag">14px</span><button class="btn" onclick="fontM(1)">A+</button><button class="btn btn-gold" onclick="expandir()">⛶ Tela Cheia</button></div>
<div style="background:#0a1f14;border:1px solid var(--gold);border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:8px;align-items:center"><button id="playBtn" class="btn btn-gold" onclick="playPause()">▶️ Play</button><button class="btn" onclick="stop()">⏹️</button><span style="font-size:12px;opacity:.7">Velocidade:</span><input type="range" id="speed" min="0.5" max="10" step="0.5" value="2.5" style="width:100px" oninput="setSpeed(this.value)"><span id="speedTag" class="tag">2.5x</span></div>
<div id="l_cifra" class="cifra"><pre id="preCifra"></pre></div>
</div>

<script>
function openMenu(){document.getElementById('sideMenu').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
let cifras=JSON.parse(localStorage.getItem('mc_cifras')||'[]'),atual=null,timer=null,tr=0,fz=parseInt(localStorage.getItem('fz')||'14'),vel=2.5,raf=null;
const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],EQUIV={'Db':'C#','Eb':'D#','Fb':'E','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B'};
function show(id){stop();['home','nova','importar','leitor'].forEach(e=>document.getElementById(e).style.display='none');document.getElementById(id).style.display='block';if(id==='home')render();}
function buscar(t){let q=document.getElementById('webQ').value.trim();if(!q)return;let u=t=='cifraclub'?'https://www.cifraclub.com/search/?q='+encodeURIComponent(q):'https://www.google.com/search?q='+encodeURIComponent(q+' cifra');window.open(u,'_blank');}
function save(){localStorage.setItem('mc_cifras',JSON.stringify(cifras));}
function salvarNova(){let t=document.getElementById('n_txt').value;if(!t)return;cifras.unshift({id:Date.now(),titulo:document.getElementById('n_tit').value||'Sem titulo',artista:document.getElementById('n_art').value||'',tom:document.getElementById('n_tom').value||'G',texto:t,orig:t});save();show('home');}
function salvarImp(){let t=document.getElementById('i_txt').value;if(!t)return;cifras.unshift({id:Date.now(),titulo:document.getElementById('i_tit').value||'Importada',artista:document.getElementById('i_art').value||'',tom:'G',texto:t,orig:t});save();show('home');}
function render(){let q=(document.getElementById('localQ').value||'').toLowerCase();let list=cifras.filter(c=>(c.titulo+' '+c.artista).toLowerCase().includes(q));document.getElementById('count').innerText='('+list.length+')';let h='';list.forEach(c=>h+=`<div class="list-item" onclick="abrir(${c.id})"><b style="color:var(--gold2)">${c.titulo.toUpperCase()}</b><br><small style="opacity:.6">${c.artista.toUpperCase()}</small></div>`);document.getElementById('lista').innerHTML=h||'Vazio';}
function abrir(id){atual=cifras.find(c=>c.id==id);tr=0;document.getElementById('l_tit').innerText=atual.titulo.toUpperCase();document.getElementById('l_art').innerText=atual.artista.toUpperCase();document.getElementById('tomTag').innerText='Tom: '+(atual.tom||'G');pintar(atual.orig);applyFont();show('leitor');}
function pintar(txt){
  let html=txt.replace(/\[([^\]]+)\]/g,'<b>[$1]</b>');
  // Pinta acordes soltos tipo Em7, C7M, D7(4/9) em amarelo, mantendo posição
  html=html.replace(/^([A-G][#b]?(?:m|M|maj|min|dim|sus|add|m7|7M|7)?(?:\(?\d*\/?\d*\)?)*)/gm,'<b>$1</b>');
  html=html.replace(/\s([A-G][#b]?(?:m7|7M|m|7|M)?(?:\(4\/9\)|\(9\)|\(11\)|\b))/g,' <b>$1</b>');
  document.getElementById('preCifra').innerHTML=html;
}
function transp(d){
  tr+=d;
  let txt=atual.orig.replace(/([A-G][#b]?)(m?7M?|m?7?|m|\(4\/9\)|\(9\))?/g,(m,nota,resto)=>{
    let base=nota; if(EQUIV[base]) base=EQUIV[base];
    let idx=NOTAS.indexOf(base); if(idx<0) return m;
    let nova=NOTAS[(idx+tr+120)%12];
    return nova+(resto||'');
  });
  pintar(txt);
  let baseTom=(atual.tom||'G').replace(/m.*$/,''); if(EQUIV[baseTom]) baseTom=EQUIV[baseTom];
  let i=NOTAS.indexOf(baseTom); if(i>=0){let nt=NOTAS[(i+tr+120)%12]; document.getElementById('tomTag').innerText='Tom: '+nt;}
}
function toggleS(){alert('Modo simples em breve!');}
function applyFont(){document.getElementById('preCifra').style.fontSize=fz+'px';document.getElementById('fontTag').innerText=fz+'px';document.getElementById('fontTagFull').innerText=fz+'px';localStorage.setItem('fz',fz);}
function fontM(d){fz=Math.min(32,Math.max(10,fz+d));applyFont();}
function setSpeed(v){vel=parseFloat(v);document.getElementById('speed').value=v;document.getElementById('speedFull').value=v;document.getElementById('speedTag').innerText=v+'x';document.getElementById('speedTagFull').innerText=v+'x';}
function playPause(){
  let el=document.getElementById('l_cifra');
  if(raf){stop();return;}
  function step(){el.scrollTop+=vel*0.3; raf=requestAnimationFrame(step);}
  raf=requestAnimationFrame(step);
  document.getElementById('playBtn').innerText='⏸️ Pausar';document.getElementById('playFull').innerText='⏸️';
}
function stop(){if(raf){cancelAnimationFrame(raf);raf=null;} document.getElementById('playBtn').innerText='▶️ Play';document.getElementById('playFull').innerText='▶️';}
function expandir(){let el=document.getElementById('l_cifra');let tools=document.getElementById('fullTools');el.classList.toggle('fullscreen');tools.classList.toggle('show');}
function exportarBackup(){let blob=new Blob([JSON.stringify(cifras)],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.txt';a.click();}
render();
setSpeed(vel);applyFont();
</script></body></html>
