<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINHAS CIFRAS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f0f0f">
<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0}
header{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0}
.btn{padding:10px 16px;border-radius:20px;border:none;font-weight:700;cursor:pointer}
.btn-branco{background:#fff;color:#000}.btn-laranja{background:#D97706;color:#fff}
#instalar{background:#D97706;color:#fff;width:90%;margin:10px 5%;padding:14px;border:none;border-radius:30px;font-weight:800;font-size:16px}
.card{margin:10px;background:#1a1a1a;padding:14px;border-radius:16px}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff}
.cifra{padding:12px;border-bottom:1px solid #222;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:10px;z-index:99}
.modal.on{display:flex}.box{background:#222;padding:16px;border-radius:16px;width:100%;max-width:400px}
#leitor{background:#fdfbf7;color:#111;max-width:700px;height:90vh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
#conteudo{flex:1;overflow:auto;padding:16px;white-space:pre-wrap;font-size:18px;line-height:1.4}
.cifra-linha{color:#B45309;font-family:monospace;font-weight:800}
</style>
</head>
<body>
<header>
<button class="btn" onclick="menu.classList.add('on')">☰</button>
<b><img src="icon-192.png" style="width:24px;vertical-align:middle"> MINHAS CIFRAS</b>
<span id="total" class="btn btn-branco">0</span>
</header>

<!-- INSTALADOR SEMPRE VISIVEL -->
<button id="instalar" onclick="instalarApp()">📲 INSTALAR APP</button>

<div class="card">
<button class="btn btn-branco" onclick="nova()">+ Nova cifra</button>
<input id="busca" placeholder="Buscar..." oninput="lista()">
</div>
<div class="card" id="listaCifras"></div>

<!-- MENU -->
<div id="menu" class="modal"><div class="box">
<button class="btn btn-branco" onclick="menu.classList.remove('on')">Fechar</button>
</div></div>

<!-- LEITOR -->
<div id="modalLeitor" class="modal"><div id="leitor">
<div style="padding:10px;display:flex;justify-content:space-between;background:#eee">
<button class="btn" onclick="fechar()">← Voltar</button>
<button class="btn" onclick="document.getElementById('leitor').requestFullscreen()">⛶</button>
</div>
<div id="titulo" style="padding:0 16px;font-size:12px;opacity:.6"></div>
<div id="conteudo"></div>
</div></div>

<!-- NOVA -->
<div id="modalNova" class="modal"><div class="box">
<input id="nTitulo" placeholder="Nome da música">
<input id="nArtista" placeholder="Artista">
<textarea id="nTexto" rows="10" placeholder="Cole a cifra aqui..."></textarea>
<button class="btn btn-laranja" style="width:100%" onclick="salvar()">Salvar</button>
<button class="btn" style="width:100%;margin-top:6px" onclick="modalNova.classList.remove('on')">Cancelar</button>
</div></div>

<script>
// INSTALADOR
let promptInst=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInst=e;});
function instalarApp(){
 if(promptInst){promptInst.prompt();}
 else{alert('No Chrome: 3 pontinhos no topo > Instalar app ou Adicionar à tela inicial');}
}

// CIFRAS SIMPLES
let cifras=JSON.parse(localStorage.getItem('cifras')||'[]');
function salvarLS(){localStorage.setItem('cifras',JSON.stringify(cifras));}
function lista(){
 let b=busca.value.toLowerCase();
 let f=cifras.filter(c=>c.titulo.toLowerCase().includes(b));
 total.innerText=f.length;
 listaCifras.innerHTML=f.map(c=>`<div class="cifra" onclick="abrir(${c.id})"><b>${c.titulo}</b><br><small style="opacity:.5">${c.artista}</small></div>`).join('')||'Nenhuma cifra';
}
function nova(){nTitulo.value='';nArtista.value='';nTexto.value='';modalNova.classList.add('on');}
function salvar(){
 if(!nTitulo.value)return alert('Nome');
 cifras.push({id:Date.now(),titulo:nTitulo.value,artista:nArtista.value,texto:nTexto.value});
 salvarLS();modalNova.classList.remove('on');lista();
}
function abrir(id){
 let c=cifras.find(x=>x.id==id);
 titulo.innerText=c.titulo+' - '+c.artista;
 // simples: pinta linhas com cifra
 conteudo.innerHTML=c.texto.split('\n').map(l=>{
  if(l.trim().length<80 && /[A-G]/.test(l) && l.split(' ').length<10) return `<div class="cifra-linha">${l}</div>`;
  return `<div>${l}</div>`;
 }).join('');
 modalLeitor.classList.add('on');
}
function fechar(){modalLeitor.classList.remove('on');}
lista();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
