<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifras v50 Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f0e;color:#e8e8e8;font-family:'Inter',sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(11,15,14,0.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.08);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.btn{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;padding:10px 16px;border-radius:100px;font-weight:700;font-size:13px;cursor:pointer}
.btn-amarelo{background:#fff;color:#0b0f0e;border-color:#fff;font-weight:800}
.btn-ativo{background:#D97706;color:white;border-color:#D97706}
.card{margin:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:18px}
.input-busca{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;color:white;outline:none;margin-top:12px}
.cifra-item{padding:16px;border-radius:16px;cursor:pointer;display:flex;justify-content:space-between}
.cifra-item:hover{background:rgba(255,255,255,0.05)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(20px);display:none;justify-content:center;align-items:center;z-index:50;padding:8px}
.modal.aberto{display:flex}
.modal-box{background:#161a19;border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
#boxLeitor{width:100%;max-width:760px;height:96vh;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.6);background:#fdfbf7}
.topo-fixo{padding:12px 16px;flex-shrink:0;border-bottom:1px solid rgba(0,0,0,0.08);background:#fdfbf7;transition:0.3s}
.topo-fixo.escondido{transform:translateY(-100%);height:0;padding:0;overflow:hidden;border:none}
#leitorConteudo{flex:1;overflow:auto;padding:18px 18px 40px 18px;background:#fdfbf7;color:#111;font-family:'Inter',sans-serif;line-height:1.25;white-space:pre-wrap;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,0.2) transparent}
#leitorConteudo::-webkit-scrollbar{width:6px;height:6px}
#leitorConteudo::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:10px}
.cifra-line{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:17px;letter-spacing:-0.2px;white-space:pre;overflow-x:auto;color:#B45309!important;margin:0;padding:0;line-height:1.1;scrollbar-width:none}
.cifra-line::-webkit-scrollbar{display:none}
.linha-letra{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;color:#111!important;margin:0 0 16px 0;padding:2px 0 0 0;line-height:1.3;letter-spacing:-0.2px;white-space:pre-wrap}
.bloco-vazio{height:12px}
#boxLeitor:fullscreen{border-radius:0;max-width:100vw;width:100vw;height:100vh}
.tons{display:flex;gap:6px;overflow:auto;padding:6px 0;scrollbar-width:none}
.tons::-webkit-scrollbar{display:none}
.tom-btn{min-width:42px;height:42px;border-radius:100px;border:1px solid rgba(0,0,0,0.12);background:white;color:#111;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0}
.tom-btn.ativo{background:#D97706;color:white;border-color:#D97706}
.chip{padding:8px 14px;border-radius:100px;background:#111;color:white;font-size:12px;font-weight:700;cursor:pointer;border:none}
.chip-ativo{background:#D97706;color:white}
#btnOlho{position:fixed;top:14px;right:14px;z-index:100;width:44px;height:44px;border-radius:100px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);color:white;border:1px solid rgba(255,255,255,0.15);display:none;cursor:pointer;font-size:18px}
textarea,input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:white;margin:8px 0;outline:none}
</style>
</head>
<body>
<header><button class="btn" id="btnMenu">☰</button><div style="font-weight:800">CIFRAS PRO v50</div><button class="btn btn-amarelo" id="btnHome"><span id="total">0</span></button></header>
<button id="btnOlho">👁️</button>
<div id="menuLateral" class="modal"><div class="modal-box">
<h2 style="font-weight:800;margin-bottom:16px">Ajustes</h2>
<div style="margin:18px 0"><div style="font-size:11px;opacity:0.6;margin-bottom:8px;font-weight:700">TEMA</div><div style="display:flex;gap:8px"><button class="btn btn-ativo" id="btnTemaPapel">Papel claro - nítido</button><button class="btn" id="btnTemaDark">Preto palco</button></div></div>
<div style="margin:18px 0"><button class="btn btn-amarelo" id="btnExportar" style="width:100%">Exportar backup</button><label class="btn" style="width:100%;text-align:center;display:block;margin-top:8px">Importar<input type="file" id="importFile" hidden></label></div>
<button class="btn" id="btnFecharMenu" style="width:100%;margin-top:16px">Fechar</button>
</div></div>

<div class="card"><div style="display:flex;gap:10px"><button class="btn btn-amarelo" id="btnNova" style="flex:1">+ Nova</button><button class="btn" id="btnColar" style="flex:1">Colar</button></div><input id="busca" class="input-busca" placeholder="Buscar..."></div>
<div class="card"><div id="lista"></div></div>

<div id="modalLeitor" class="modal"><div id="boxLeitor">
<div class="topo-fixo" id="topoFixo">
<div style="display:flex;justify-content:space-between;gap:8px"><button class="btn" id="btnVoltar" style="background:#f0eee9;color:#111;border:none;font-weight:800">← Voltar</button><div style="display:flex;gap:6px"><button class="btn" id="btnAuto" style="background:#111;color:white">▶️ Auto</button><button class="btn" id="btnTelaCheia" style="background:#111;color:white">⛶</button><button class="btn" id="btnEsconderTopo" style="background:white;color:#111;border-color:rgba(0,0,0,0.1)">👁️</button></div></div>
<div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="font-size:11px;opacity:0.6;font-weight:700">TOM <span id="tomOriginal">G</span> → <span id="tomAtualLabel">0</span></div><div style="display:flex;align-items:center;gap:6px"><button class="btn" id="btnFonteMenos" style="padding:6px 12px;background:white;color:#111">A-</button><span style="font-size:12px;font-weight:700;opacity:0.6" id="labelFonte">22px</span><button class="btn" id="btnFonteMais" style="padding:6px 12px;background:white;color:#111">A+</button><button class="chip" id="btnSimplificar" style="margin-left:6px">Simplificada</button></div></div>
<div class="tons" id="barraTons"></div>
<h2 id="leitorTitulo" style="margin-top:8px;font-size:11px;opacity:0.5;text-transform:uppercase;font-weight:800"></h2>
</div>
<div id="leitorConteudo"></div>
</div></div>

<div id="modalEditar" class="modal"><div class="modal-box"><input id="editTitulo" type="text" placeholder="Nome"><input id="editArtista" type="text" placeholder="Artista"><textarea id="editConteudo" rows="14"></textarea><button class="btn btn-amarelo" id="btnSalvar" style="width:100%">Salvar</button><button class="btn" id="btnCancelarEdit" style="width:100%;margin-top:8px">Cancelar</button></div></div>
<div id="modalColar" class="modal"><div class="modal-box"><textarea id="colarTexto" rows="12"></textarea><input id="colarTitulo" type="text" placeholder="Nome"><input id="colarArtista" type="text" placeholder="Artista"><button class="btn btn-amarelo" id="btnSalvarColar" style="width:100%">Salvar</button><button class="btn" id="btnCancelarColar" style="width:100%;margin-top:8px">Cancelar</button></div></div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
 let cifras=[]; try{cifras=JSON.parse(localStorage.getItem('minhasCifras_v27')||'[]');}catch(e){cifras=[];}
 let tom=0, originalConteudo='', acordeOriginal='G', simplificada=false, fontSize=22, temaAtual='papel', autoInterval=null, topoVisivel=true;
 const $=id=>document.getElementById(id);
 const salvar=()=>localStorage.setItem('minhasCifras_v27',JSON.stringify(cifras));
 function aplicarTemaLeitor(){
  const box=$('boxLeitor'), topo=$('topoFixo'), cont=$('leitorConteudo');
  if(temaAtual==='dark'){ box.style.background='#0f0f0f'; topo.style.background='#0f0f0f'; topo.style.borderBottom='1px solid rgba(255,255,255,0.08)'; cont.style.background='#0f0f0f'; cont.style.color='#f5f5f5'; }
  else { box.style.background='#fdfbf7'; topo.style.background='#fdfbf7'; topo.style.borderBottom='1px solid rgba(0,0,0,0.08)'; cont.style.background='#fdfbf7'; cont.style.color='#111'; }
  renderCifraTextoAtual();
 }
 function renderLista(){ const b=$('busca').value.toLowerCase(); const f=cifras.filter(c=>c.titulo.toLowerCase().includes(b)); $('total').innerText=f.length; $('lista').innerHTML=f.length?f.map(c=>`<div class="cifra-item" data-id="${c.id}"><div><b style="font-weight:800">${c.titulo}</b><div style="opacity:0.5;font-size:12px">${c.artista}</div></div><span style="opacity:0.2">›</span></div>`).join(''):'<div style="padding:30px;text-align:center;opacity:0.3">Nenhuma cifra</div>'; document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>abrirLeitor(Number(el.dataset.id))));}
 function abrirLeitor(id){ const c=cifras.find(x=>x.id==id); if(!c) return; originalConteudo=c.conteudo; tom=0; const m=c.conteudo.match(/[A-G][#b]?/); acordeOriginal=m?m[0]:'G'; $('tomOriginal').innerText=acordeOriginal; criarBarraTons(); $('leitorTitulo').innerText=c.titulo+' • '+c.artista; $('modalLeitor').classList.add('aberto'); $('btnOlho').style.display='block'; aplicarTemaLeitor(); $('leitorConteudo').scrollTop=0; }
 function criarBarraTons(){const cont=$('barraTons'); cont.innerHTML=''; for(let i=-5;i<=5;i++){const btn=document.createElement('button'); btn.className=i===0?'tom-btn ativo':'tom-btn'; btn.innerText=(i>0?'+'+i:i); btn.addEventListener('click',()=>{tom=i; atualizarTons(); aplicarTransposicao();}); cont.appendChild(btn);} atualizarTons();}
 function atualizarTons(){$('barraTons').querySelectorAll('.tom-btn').forEach((b,idx)=>{let v=idx-5; b.className=v===tom?'tom-btn ativo':'tom-btn';}); $('tomAtualLabel').innerText=(tom>0?'+'+tom:tom)+' ('+transporNota(acordeOriginal,tom)+')';}
 function transporNota(nota,s){const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}; let base=MAP[nota]||nota; let i=NOTAS.indexOf(base); if(i==-1) return nota; return NOTAS[(i+s+120)%12];}
 function aplicarTransposicao(){const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const MAP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}; let texto=originalConteudo.replace(/[A-G][#b]?/g,m=>{let base=MAP[m]||m; let i=NOTAS.indexOf(base); if(i==-1) return m; return NOTAS[(i+tom+120)%12];}); if(simplificada){texto=texto.replace(/[A-G][#b]?m?(?:7M|maj7|m7|7|9|6|sus2|sus4|sus|dim|aug|add9|\(.*?\)|\/[\w#b]+)*/g,ac=>{let mm=ac.match(/^([A-G][#b]?)(m)?/); return mm?mm[1]+(mm[2]||''):ac;});} originalConteudoTransposto=texto; renderCifraTextoAtual();}
 let originalConteudoTransposto=null;
 function renderCifraTextoAtual(){
  const txt=originalConteudoTransposto||originalConteudo; if(!txt) return;
  let html=''; const linhas=txt.split('\n');
  for(let i=0;i<linhas.length;i++){
   const l=linhas[i]; if(!l.trim()){html+=`<div class="bloco-vazio"></div>`; continue;}
   let ehCifra=l.trim().length<90 && /[A-G]/.test(l) && l.trim().split(/\s+/).length<=12 && /^[A-G\s#b0-9\/\(\)mMaj7\-]+$/.test(l.trim());
   if(ehCifra){ html+=`<div class="cifra-line" style="font-size:${fontSize-2}px;color:${temaAtual==='dark'?'#FB923C':'#B45309'}">${l}</div>`; }
   else { html+=`<div class="linha-letra" style="font-size:${fontSize}px;color:${temaAtual==='dark'?'#f5f5f5':'#111'}">${l}</div>`; }
  }
  $('leitorConteudo').innerHTML=html; $('labelFonte').innerText=fontSize+'px';
 }
 function renderCifraTexto(txt){originalConteudoTransposto=txt; renderCifraTextoAtual();}
 // Eventos
 $('btnMenu').addEventListener('click',()=>$('menuLateral').classList.add('aberto')); $('btnFecharMenu').addEventListener('click',()=>$('menuLateral').classList.remove('aberto')); $('busca').addEventListener('input',renderLista);
 $('btnNova').addEventListener('click',()=>{$('editTitulo').value=''; $('editArtista').value=''; $('editConteudo').value=''; $('modalEditar').classList.add('aberto');});
 $('btnColar').addEventListener('click',()=>$('modalColar').classList.add('aberto')); $('btnCancelarEdit').addEventListener('click',()=>$('modalEditar').classList.remove('aberto')); $('btnCancelarColar').addEventListener('click',()=>$('modalColar').classList.remove('aberto'));
 $('btnVoltar').addEventListener('click',()=>{pararAuto(); $('modalLeitor').classList.remove('aberto'); $('btnOlho').style.display='none'; if(document.fullscreenElement)document.exitFullscreen();});
 $('btnTelaCheia').addEventListener('click',()=>{if(!document.fullscreenElement){$('boxLeitor').requestFullscreen();}else document.exitFullscreen();});
 $('btnSimplificar').addEventListener('click',()=>{simplificada=!simplificada; $('btnSimplificar').className=simplificada?'chip chip-ativo':'chip'; aplicarTransposicao();});
 $('btnFonteMenos').addEventListener('click',()=>{fontSize=Math.max(14,fontSize-2); renderCifraTextoAtual();});
 $('btnFonteMais').addEventListener('click',()=>{fontSize=Math.min(32,fontSize+2); renderCifraTextoAtual();});
 $('btnEsconderTopo').addEventListener('click',()=>{topoVisivel=!topoVisivel; if(topoVisivel){$('topoFixo').classList.remove('escondido'); $('btnOlho').style.display='none';} else {$('topoFixo').classList.add('escondido'); $('btnOlho').style.display='block';}});
 $('btnOlho').addEventListener('click',()=>{topoVisivel=true; $('topoFixo').classList.remove('escondido'); $('btnOlho').style.display='none';});
 function iniciarAuto(){ if(autoInterval) return; $('btnAuto').innerText='⏸️ Parar'; autoInterval=setInterval(()=>{ $('leitorConteudo').scrollTop+=1; }, 60); }
 function pararAuto(){ if(autoInterval){clearInterval(autoInterval); autoInterval=null; $('btnAuto').innerText='▶️ Auto';} }
 $('btnAuto').addEventListener('click',()=>{ if(autoInterval) pararAuto(); else iniciarAuto(); });
 $('btnSalvar').addEventListener('click',()=>{const t=$('editTitulo').value,a=$('editArtista').value,co=$('editConteudo').value; if(!t) return alert('Nome'); cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:co}); salvar(); $('modalEditar').classList.remove('aberto'); renderLista();});
 $('btnSalvarColar').addEventListener('click',()=>{const txt=$('colarTexto').value,t=$('colarTitulo').value||'Importada',a=$('colarArtista').value||''; if(!txt) return alert('Cole'); cifras.push({id:Date.now(),titulo:t,artista:a,conteudo:txt}); salvar(); $('modalColar').classList.remove('aberto'); renderLista();});
 $('btnExportar').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(cifras)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cifras.json'; a.click();});
 $('importFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{cifras=JSON.parse(r.result); salvar(); renderLista();}catch{alert('Inválido');}}; r.readAsText(f);});
 $('btnTemaPapel').addEventListener('click',()=>{temaAtual='papel'; $('btnTemaPapel').className='btn btn-ativo'; $('btnTemaDark').className='btn'; aplicarTemaLeitor();});
 $('btnTemaDark').addEventListener('click',()=>{temaAtual='dark'; $('btnTemaDark').className='btn btn-ativo'; $('btnTemaPapel').className='btn'; aplicarTemaLeitor();});
 renderLista(); aplicarTemaLeitor();
});
</script>
</body>
</html>
