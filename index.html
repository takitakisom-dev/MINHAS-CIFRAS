<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINHAS CIFRAS</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#d97706">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#f3ece0;color:#2a211a;font-family:system-ui,sans-serif}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #e8ddd0}
.btn{border:1.5px solid #e8ddd0;background:#fff;color:#2a211a;padding:10px 14px;border-radius:100px;font-weight:700;font-size:13px;cursor:pointer}
.btn-black{background:#1a1611;color:#fff;border-color:#1a1611}
#btnInst{background:#d97706;color:#fff;border:none;padding:14px;border-radius:100px;font-weight:800;width:calc(100% - 20px);margin:10px auto;display:none}
.card{margin:10px;background:#fff;border:1px solid #e8ddd0;border-radius:16px;padding:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap;padding:9px 13px;border-radius:100px;border:1px solid #e8ddd0;background:#f8f3eb;color:#5a4d3d;font-size:12px;font-weight:700;flex-shrink:0}.tab.on{background:#1a1611;color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;flex-wrap:nowrap}.chip{padding:7px 12px;border-radius:100px;border:1px solid #e8ddd0;background:#fff;color:#6b5d4d;font-size:11px;white-space:nowrap;flex-shrink:0}.chip.on{background:#1a1611;color:#fff}
.cifra{padding:14px 4px;border-bottom:1px solid #eee6d9;display:flex;justify-content:space-between;align-items:center}.ver{padding:8px 14px;border-radius:100px;border:1.5px solid #1a1611;background:#fff;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:100;padding:12px}.modal.on{display:flex}
.box{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.repRow{display:flex;gap:10px;margin:10px 0}.repRow input{flex:1;padding:14px;border-radius:12px;border:1.5px solid #e8ddd0;background:#fffdf8}.btnSalvar{width:72px;height:52px;border-radius:100px;background:#1a1611;color:#fff;border:none;font-weight:800}
.btnFull{width:100%;padding:14px;border-radius:100px;font-weight:800;margin:6px 0;text-align:center;display:block}.btnExport{background:#d97706;color:#fff;border:none}.btnOutline{background:#fff;border:1.5px solid #e8ddd0}
#boxLeitor{width:100%;max-width:780px;height:96vh;background:#fdfbf7;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;position:relative}
#leitor{flex:1;overflow:auto;padding:18px;color:#111}
.cLine{font-family:monospace;font-weight:800;white-space:pre-wrap;color:#9a5a10;font-size:15px}.lLine{font-weight:600;margin:0 0 10px 0;font-size:17px}
.tons{display:flex;gap:5px;overflow-x:auto;padding:8px 0}.tBtn{min-width:38px;height:38px;border-radius:100px;border:1px solid #e8ddd0;background:#fff;font-weight:800;flex-shrink:0}.tBtn.on{background:#d97706;color:#fff}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #e8ddd0;background:#fffcf6;margin:6px 0}
.repCheck{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.repOpt{padding:7px 12px;border-radius:100px;border:1.5px solid #e8ddd0;background:#fff;font-size:11px;cursor:pointer}.repOpt.on{background:#d97706;color:#fff}
#boxLeitor:fullscreen{width:100vw;height:100vh;max-width:none;border-radius:0;background:#fff}
#boxLeitor:fullscreen #barraTopo,#boxLeitor:fullscreen #barraTom{display:none!important}
#boxLeitor:fullscreen #leitor{padding:40px 20px 80px 20px;height:100vh}
#btnSairFull{display:none;position:fixed;top:16px;right:16px;z-index:999999;background:rgba(0,0,0,.85);color:#fff;border:none;padding:12px 18px;border-radius:100px;font-weight:800}
#ctrlAuto{display:none;gap:6px;align-items:center;background:#fff7ed;border:1px solid #fed7aa;padding:6px 10px;border-radius:100px}
#ctrlAuto.on{display:flex}
#ctrlAuto button{width:30px;height:30px;border-radius:50%;border:1px solid #e8ddd0;background:#fff;font-weight:900;font-size:16px}
</style></head><body>
<header><button class="btn" onclick="document.getElementById('mMenu').classList.add('on')">☰</button><div style="font-weight:800">🎸 MINHAS CIFRAS</div><span class="btn btn-black" id="tot">0</span></header>
<button id="btnInst">📲 INSTALAR APP</button>
<div class="card"><div style="font-size:22px;font-weight:800">Sua coleção particular</div><div style="color:#8a7a6a;margin:6px 0 12px">Crie, importe e organize. Tudo offline.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-black" onclick="nova()">+ Nova Cifra</button><label class="btn">Importar.txt<input type="file" id="imp" hidden></label><button class="btn" onclick="document.getElementById('mMenu').classList.add('on')">+ Repertório</button></div></div>
<div class="card"><div class="tabs" id="tabsRep"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="busca" placeholder="Buscar..." style="flex:1" oninput="render()"><button class="btn btn-black" onclick="nova()">+ Nova</button></div><div class="chips" id="filtEst"></div><div id="lista" style="margin-top:12px"></div></div>
<div id="mMenu" class="modal" onclick="if(event.target==this)this.classList.remove('on')"><div class="box"><h3>Menu Completo</h3><div style="font-size:11px;font-weight:800;color:#999;margin-top:14px">REPERTÓRIOS - RENOMEIE</div><div id="editReps"></div><div style="font-size:11px;font-weight:800;color:#999;margin-top:14px">FILTRAR POR ESTILO</div><div class="chips" id="menuEst" style="flex-wrap:wrap"></div><button class="btnFull btnExport" style="margin-top:14px" onclick="exportar()">Exportar backup</button><label class="btnFull btnOutline">Importar backup<input type="file" id="impBKP" accept=".json" hidden></label><button class="btnFull" style="background:#fee2e2;color:#b91c1c;border:none" onclick="if(confirm('Apagar tudo?')){localStorage.clear();location.reload()}">🗑️ Apagar tudo</button><button class="btnFull btnOutline" onclick="document.getElementById('mMenu').classList.remove('on')">Fechar</button></div></div>
<div id="mLeitor" class="modal"><div id="boxLeitor"><button id="btnSairFull" onclick="toggleFull()">✕ Sair</button><div id="barraTopo" style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;background:#fff;flex-wrap:wrap;gap:6px"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="fechar()">← Voltar</button><button class="btn" onclick="editarAtual()">✏️ Editar</button><button class="btn" onclick="excluirAtual()">🗑️</button><button class="btn" onclick="copiarCifra()">📋</button></div><div style="display:flex;gap:6px;align-items:center"><div id="ctrlAuto"><button onclick="ajustaVel(-1)">−</button><span id="labVel" style="font-size:12px;font-weight:800;min-width:44px;text-align:center">2x</span><button onclick="ajustaVel(1)">+</button></div><button class="btn btn-black" id="bAuto" onclick="toggleAuto()">▶️ Auto</button><button class="btn btn-black" onclick="toggleFull()">⛶ Tela cheia</button></div></div><div id="barraTom" style="padding:12px;background:#fffaf1;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between;align-items:center"><span id="infTom" style="font-size:11px;opacity:.7"></span><div style="display:flex;gap:6px;align-items:center"><button class="btn" onclick="mFont(-2)">A-</button><span id="labF" style="font-size:11px">18px</span><button class="btn" onclick="mFont(2)">A+</button><button class="btn" id="bSimp" onclick="tSimp()">Simplif.</button></div></div><div class="tons" id="barTons"></div><div id="tTit" style="font-size:11px;opacity:.6;margin-top:4px"></div></div><div id="leitor"></div></div></div>
<div id="mNova" class="modal" onclick="if(event.target==this)fecharNova()"><div class="box"><h3 id="titNova">Nova música</h3><input id="nT" placeholder="Nome*"><input id="nA" placeholder="Artista"><select id="nEst"><option value="">Estilo...</option><option>MPB</option><option>ROCK NACIONAL</option><option>ROCK INTERNACIONAL</option><option>PAGODE</option><option>GOSPEL</option><option>FORRÓ</option><option>REGGAE</option><option>SAMBA</option><option>FUNK</option><option>SERTANEJO</option><option>POP</option><option>ESTILO DO MÚSICO</option><option>BLUES</option><option>JAZZ</option></select><div style="font-size:11px;color:#999;margin-top:8px">REPERTÓRIOS</div><div class="repCheck" id="nReps"></div><textarea id="nC" rows="12" placeholder="Cifra..."></textarea><button class="btn btn-black" id="btnSalvarNova" style="width:100%;padding:13px;background:#d97706;color:#fff;border:none;font-weight:800" onclick="salvar()">Salvar música</button><button class="btn" style="width:100%;margin-top:8px" onclick="fecharNova()">Cancelar</button></div></div>
<script>
const $ = id => document.getElementById(id);
let pInst=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pInst=e;$('btnInst').style.display='block';});$('btnInst').onclick=()=>{if(pInst)pInst.prompt();};
const ESTILOS=['TODOS','MPB','ROCK NACIONAL','ROCK INTERNACIONAL','PAGODE','GOSPEL','FORRÓ','REGGAE','SAMBA','FUNK','SERTANEJO','POP','ESTILO DO MÚSICO','BLUES','JAZZ'];
let reps=JSON.parse(localStorage.getItem('reps')||'["Minhas músicas","Louvor","Show Barzinho","Estudo","Favoritas"]');
let cifras=JSON.parse(localStorage.getItem('cifrasV59')||'[]');
let filtroRep='TODAS',filtroEst='TODOS',tom=0,origTxt='',acOrig='G',simp=false,fSize=18,auto=null,idAtual=null,modoEdicao=false,selReps=[],vel=2;
let save=()=>{localStorage.setItem('cifrasV59',JSON.stringify(cifras));localStorage.setItem('reps',JSON.stringify(reps));};
function buildTabs(){let h=`<button class="tab ${filtroRep=='TODAS'?'on':''}" onclick="setRep('TODAS')">🎸 Minhas músicas (${cifras.length})</button>`;reps.forEach((r,i)=>{let q=cifras.filter(c=>c.reps&&c.reps.includes(i)).length;h+=`<button class="tab ${filtroRep==i?'on':''}" onclick="setRep(${i})">📚 ${r} (${q})</button>`;});$('tabsRep').innerHTML=h;let eh='';ESTILOS.forEach(e=>{eh+=`<button class="chip ${filtroEst==e?'on':''}" onclick="setEst('${e}')">${e}</button>`;});$('filtEst').innerHTML=eh;$('menuEst').innerHTML=eh;$('editReps').innerHTML=reps.map((r,i)=>`<div class="repRow"><input id="r${i}" value="${r}"><button class="btnSalvar" onclick="renRep(${i})">Salvar</button></div>`).join('');}
function setRep(v){filtroRep=v;buildTabs();render();}function setEst(v){filtroEst=v;buildTabs();render();$('mMenu').classList.remove('on');}
function renRep(i){reps[i]=$('r'+i).value||`Rep ${i+1}`;save();buildTabs();buildNovaReps();render();}
function render(){let b=$('busca').value.toLowerCase();let f=cifras.filter(c=>{let okB=!b||c.titulo.toLowerCase().includes(b)||(c.artista||'').toLowerCase().includes(b);let okR=filtroRep=='TODAS'||(c.reps&&c.reps.includes(filtroRep));let okE=filtroEst=='TODOS'||(c.estilo||'').toUpperCase()==filtroEst;return okB&&okR&&okE;});$('tot').innerText=f.length;if(!f.length){$('lista').innerHTML='<div style="padding:24px;text-align:center;color:#8a7a6a">Nenhuma música. + Nova Cifra</div>';return;}$('lista').innerHTML=f.map(c=>`<div class="cifra"><div><b>${c.titulo}</b><div style="font-size:11px;opacity:.7">${c.artista||''} • ${c.estilo||''}</div></div><button class="ver" onclick="abrir(${c.id})">Ver</button></div>`).join('');}
function buildNovaReps(){$('nReps').innerHTML=reps.map((r,i)=>`<div class="repOpt" id="ro${i}" onclick="togRep(${i})">${r}</div>`).join('');}
function togRep(i){let el=$('ro'+i);if(selReps.includes(i)){selReps=selReps.filter(x=>x!=i);el.classList.remove('on');}else{selReps.push(i);el.classList.add('on');}}
function nova(){modoEdicao=false;selReps=[];$('titNova').innerText='Nova música';$('nT').value='';$('nA').value='';$('nC').value='';$('nEst').value='';buildNovaReps();$('mNova').classList.add('on');}
function fecharNova(){$('mNova').classList.remove('on');}
function salvar(){if(!$('nT').value.trim())return alert('Nome');if(modoEdicao){let c=cifras.find(x=>x.id==idAtual);c.titulo=$('nT').value.trim();c.artista=$('nA').value.trim();c.estilo=$('nEst').value;c.conteudo=$('nC').value;c.reps=[...selReps];}else{cifras.push({id:Date.now(),titulo:$('nT').value.trim(),artista:$('nA').value.trim(),estilo:$('nEst').value,reps:[...selReps],conteudo:$('nC').value});}save();fecharNova();buildTabs();render();}
function abrir(id){idAtual=id;let c=cifras.find(x=>x.id==id);origTxt=c.conteudo;tom=0;let m=c.conteudo.match(/[A-G][#b]?/);acOrig=m?m[0]:'G';$('tTit').innerText=`${c.titulo} • ${c.artista} • ${c.estilo}`;criaTons();$('mLeitor').classList.add('on');$('leitor').scrollTop=0;transp();}
function criaTons(){$('barTons').innerHTML='';for(let i=-5;i<=5;i++){let b=document.createElement('button');b.className=i==0?'tBtn on':'tBtn';b.innerText=(i>0?'+'+i:i);b.onclick=()=>{tom=i;updTons();transp();};$('barTons').appendChild(b);}updTons();}
function updTons(){[...$('barTons').children].forEach((b,idx)=>b.className=(idx-5)==tom?'tBtn on':'tBtn');$('infTom').innerText=`TOM ${acOrig} → ${transN(acOrig,tom)} (${tom})`;}
function transN(n,s){const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],M={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let b=M[n]||n;let i=N.indexOf(b);return i<0?n:N[(i+s+120)%12];}
let curTxt='';function transp(){const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],M={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let t=origTxt.replace(/[A-G][#b]?/g,m=>{let b=M[m]||m;let i=N.indexOf(b);return i<0?m:N[(i+tom+120)%12];});if(simp){t=t.replace(/[A-G][#b]?m?(?:7M|maj7|m7|7|9|6|sus|dim|aug|add9|\(.*?\)|\/[\\w#b]+)*/g,a=>{let mm=a.match(/^([A-G][#b]?)(m)?/);return mm?mm[1]+(mm[2]||''):a;});}curTxt=t;show();}
function show(){let txt=curTxt||origTxt;let h='';txt.split('\n').forEach(l=>{if(!l.trim()){h+='<div style="height:10px"></div>';return;}let eh=l.trim().length<90 && /[A-G]/.test(l) && l.trim().split(/\s+/).length<=12;if(eh)h+=`<div class="cLine" style="font-size:${fSize-1}px">${l}</div>`;else h+=`<div class="lLine" style="font-size:${fSize}px">${l}</div>`;});$('leitor').innerHTML=h;$('labF').innerText=fSize+'px';}
function fechar(){if(auto){clearInterval(auto);auto=null;$('bAuto').innerText='▶️ Auto';$('ctrlAuto').classList.remove('on');}$('mLeitor').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen();$('btnSairFull').style.display='none';}
function mFont(d){fSize=Math.max(12,Math.min(32,fSize+d));show();}function tSimp(){simp=!simp;$('bSimp').className=simp?'btn btn-black':'btn';transp();}
function iniciaAuto(){
  if(auto)clearInterval(auto);
  if(vel===0){$('labVel').innerText='⏸️ 0';return;}
  let absV=Math.abs(vel);
  let intervalo=Math.max(8, 90 - absV*12);
  auto=setInterval(()=>{
    if(vel>0) $('leitor').scrollTop+=1;
    else $('leitor').scrollTop-=1;
  },intervalo);
}
function toggleAuto(){
  if(auto && vel!==0){clearInterval(auto);auto=null;$('bAuto').innerText='▶️ Auto';$('ctrlAuto').classList.remove('on');vel=2;}
  else{
    $('bAuto').innerText='⏸️ Parar';
    $('ctrlAuto').classList.add('on');
    if(vel===0) $('labVel').innerText='⏸️ 0';
    else if(vel>0) $('labVel').innerText=vel+'x ▼';
    else $('labVel').innerText=vel+'x ▲';
    iniciaAuto();
  }
}
function ajustaVel(d){
  vel=Math.max(-5,Math.min(5,vel+d));
  if(vel===0) $('labVel').innerText='⏸️ 0';
  else if(vel>0) $('labVel').innerText=vel+'x ▼';
  else $('labVel').innerText=vel+'x ▲';
  iniciaAuto();
}
function exportar(){let blob=new Blob([JSON.stringify({cifras,reps})],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-cifras.json';a.click();}
function copiarCifra(){navigator.clipboard.writeText(curTxt||origTxt).then(()=>alert('Copiado!'));}
function toggleFull(){let b=$('boxLeitor');let btn=$('btnSairFull');if(!document.fullscreenElement){b.requestFullscreen().then(()=>btn.style.display='block');}else{document.exitFullscreen();btn.style.display='none';}}
function editarAtual(){let c=cifras.find(x=>x.id==idAtual);modoEdicao=true;$('titNova').innerText='Editar';$('nT').value=c.titulo;$('nA').value=c.artista;$('nEst').value=c.estilo||'';$('nC').value=c.conteudo;selReps=c.reps||[];buildNovaReps();setTimeout(()=>selReps.forEach(i=>{let el=$('ro'+i);if(el)el.classList.add('on');}),50);$('mLeitor').classList.remove('on');$('mNova').classList.add('on');}
function excluirAtual(){if(!confirm('Apagar?'))return;cifras=cifras.filter(x=>x.id!=idAtual);save();fechar();buildTabs();render();}
$('imp').addEventListener('change',e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{cifras.push({id:Date.now(),titulo:e.target.files[0].name.replace('.txt',''),artista:'IMPORTADA',estilo:'MPB',reps:[],conteudo:r.result});save();buildTabs();render();};r.readAsText(e.target.files[0]);});
$('impBKP').addEventListener('change',e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(j.cifras){cifras=j.cifras;reps=j.reps||reps;}else cifras=j;save();buildTabs();render();alert('Importado!');$('mMenu').classList.remove('on');}catch{alert('Inválido');}};r.readAsText(e.target.files[0]);});
document.addEventListener('fullscreenchange',()=>{let btn=$('btnSairFull');if(!document.fullscreenElement)btn.style.display='none';else btn.style.display='block';});
buildTabs();buildNovaReps();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
