<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas Cifras</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#d97706"><style>:root{--bg:#f3ece0;--card:#fff;--text:#2a211a;--bord:#e8ddd0;--leitor:#fdfbf7;--cifra:#b45309;--letra:#1a1a1a}[data-theme="palco"]{--bg:#000;--card:#111;--text:#facc15;--bord:#333;--leitor:#000;--cifra:#facc15;--letra:#fff}[data-theme="escuro"]{--bg:#121212;--card:#1e1e1e;--text:#e5e5e5;--bord:#333;--leitor:#1e1e1e;--cifra:#fbbf24;--letra:#f5f5f5}[data-theme="sepia"]{--bg:#e8dcc8;--card:#fdf6e3;--text:#433422;--bord:#d6c7a8;--leitor:#fdf6e3;--cifra:#92400e;--letra:#3e2f1f}[data-theme="azul"]{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--bord:#334155;--leitor:#0f172a;--cifra:#60a5fa;--letra:#f1f5f9}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}header{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--bord)}.btn{border:1.5px solid var(--bord);background:var(--card);color:var(--text);padding:10px 14px;border-radius:100px;font-weight:700;font-size:13px;cursor:pointer}.btn-black{background:#1a1611;color:#fff;border-color:#1a1611}.card{margin:10px;background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tab{white-space:nowrap;padding:9px 13px;border-radius:100px;border:1px solid var(--bord);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;flex-shrink:0}.tab.on{background:#1a1611;color:#fff}.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.chip{padding:7px 12px;border-radius:100px;border:1px solid var(--bord);background:var(--card);color:var(--text);font-size:11px;white-space:nowrap;flex-shrink:0;opacity:.8}.chip.on{background:#1a1611;color:#fff;opacity:1}.cifra{padding:14px 4px;border-bottom:1px solid var(--bord);display:flex;justify-content:space-between;align-items:center}.ver{padding:8px 14px;border-radius:100px;border:1.5px solid var(--bord);background:var(--card);font-weight:800;color:var(--text)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:100;padding:12px}.modal.on{display:flex}.box{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;color:var(--text)}.repRow{display:flex;gap:10px;margin:10px 0}.repRow input{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--bord);background:var(--bg);color:var(--text)}.btnSalvar{width:72px;height:52px;border-radius:100px;background:#1a1611;color:#fff;border:none;font-weight:800}.btnFull{width:100%;padding:14px;border-radius:100px;font-weight:800;margin:6px 0;text-align:center;display:block}.btnExport{background:#d97706;color:#fff;border:none}.btnOutline{background:var(--card);border:1.5px solid var(--bord);color:var(--text)}#boxLeitor{width:100%;max-width:780px;height:96vh;background:var(--leitor);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;position:relative}#leitor{flex:1;overflow:auto;padding:18px 16px}.cLine{font-family:monospace;font-weight:900;white-space:pre-wrap;color:var(--cifra)!important;letter-spacing:.5px}.lLine{font-weight:500;margin:2px 0 16px 0;color:var(--letra)!important}.tons{display:flex;gap:5px;overflow-x:auto;padding:8px 0}.tBtn{min-width:38px;height:38px;border-radius:100px;border:1px solid var(--bord);background:var(--card);font-weight:800;flex-shrink:0;color:var(--text)}.tBtn.on{background:#d97706;color:#fff}input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bord);background:var(--bg);margin:6px 0;color:var(--text)}.repCheck{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.repOpt{padding:7px 12px;border-radius:100px;border:1.5px solid var(--bord);background:var(--card);font-size:11px;cursor:pointer;color:var(--text)}.repOpt.on{background:#d97706;color:#fff}.temaGrid{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.temaBtn{padding:8px 12px;border-radius:100px;border:1.5px solid var(--bord);font-size:11px;font-weight:800;cursor:pointer;background:var(--card);color:var(--text)}.temaBtn.on{background:#d97706;color:#fff;border-color:#d97706}#ctrlAuto{display:none;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bord);padding:6px 10px;border-radius:100px}#ctrlAuto.on{display:flex}#ctrlAuto button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bord);background:var(--card);font-weight:900;font-size:16px;color:var(--text)}#btnSairFull{display:none}.pasta{border:1.5px solid var(--bord);border-radius:14px;padding:12px;margin:8px 0;background:var(--bg);cursor:pointer;display:flex;justify-content:space-between;align-items:center}.pasta b{font-size:14px}.pasta span{font-size:11px;opacity:.7}
#boxLeitor.fullscreen-ativo{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;border-radius:0!important;z-index:999999!important;background:var(--leitor)!important;margin:0!important}
#boxLeitor.fullscreen-ativo #barraTopo{display:none!important}
#boxLeitor.fullscreen-ativo #barraTom{display:none!important}
#boxLeitor.fullscreen-ativo #leitor{padding:40px 20px 140px 20px!important;height:100vh!important}
#boxLeitor.fullscreen-ativo #btnSairFull{display:block!important;position:fixed;top:18px;right:18px;z-index:1000000;background:rgba(0,0,0,.9);color:#fff;border:1px solid rgba(255,255,255,.3);padding:12px 18px;border-radius:100px;font-weight:800}
#boxLeitor.fullscreen-ativo #ctrlAuto{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:1000000;background:rgba(26,22,17,.95);display:flex!important;padding:10px 16px;border-radius:100px;border:1px solid rgba(255,255,255,.3);gap:12px}
#boxLeitor.fullscreen-ativo #ctrlAuto button{background:#fff;color:#000;width:36px;height:36px}
#boxLeitor.fullscreen-ativo #ctrlAuto #labVel{color:#fff}
</style></head><body>
<header><button class="btn" onclick="document.getElementById('mMenu').classList.add('on')">☰</button><div style="font-weight:800">🎸 Minhas Cifras</div><span class="btn btn-black" id="tot">0</span></header>
<div class="card"><div style="font-size:22px;font-weight:800">Sua coleção</div><div style="opacity:.7;margin:6px 0 12px">Suas cifras sempre com você</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-black" onclick="nova()">+ Nova Cifra</button><label class="btn">Importar.txt<input type="file" id="imp" hidden></label><button class="btn" onclick="document.getElementById('mMenu').classList.add('on')">☰ Menu</button></div></div>
<div class="card"><div class="tabs" id="tabsRep"></div><div style="display:flex;gap:8px;margin-top:12px"><div style="display:flex;gap:6px"><button class="btn btn-black" id="bModMus" onclick="setModo('musicas')">🎵 Músicas</button><button class="btn" id="bModArt" onclick="setModo('artistas')">👨‍🎤 Artistas</button></div><input id="busca" placeholder="Buscar..." style="flex:1" oninput="render()"><button class="btn btn-black" onclick="nova()">+ Nova</button></div><div class="chips" id="filtEst"></div><div id="lista" style="margin-top:12px"></div></div>
<div id="mMenu" class="modal" onclick="if(event.target==this)this.classList.remove('on')"><div class="box"><h3>Menu</h3><div style="font-size:11px;font-weight:800;opacity:.6;margin-top:14px">TEMA</div><div class="temaGrid"><button class="temaBtn" id="t-claro" onclick="setTema('claro')">Claro</button><button class="temaBtn" id="t-escuro" onclick="setTema('escuro')">Escuro</button><button class="temaBtn" id="t-sepia" onclick="setTema('sepia')">Sepia</button><button class="temaBtn" id="t-azul" onclick="setTema('azul')">Azul</button><button class="temaBtn" id="t-palco" onclick="setTema('palco')">Palco</button></div><div style="font-size:11px;font-weight:800;opacity:.6;margin-top:14px">REPERTORIOS</div><div id="editReps"></div><div style="font-size:11px;font-weight:800;opacity:.6;margin-top:14px">FILTRAR POR ESTILO</div><div class="chips" id="menuEst" style="flex-wrap:wrap"></div><div style="font-size:11px;font-weight:800;opacity:.6;margin-top:18px">APP</div><button class="btnFull btnExport" id="btnInst" onclick="instalarApp()">Instalar App</button><button class="btnFull btnExport" onclick="compartilharApp()" style="background:#1e293b">Compartilhar App</button><button class="btnFull btnExport" style="background:#1a1611" onclick="exportar()">Exportar Backup</button><label class="btnFull btnOutline">Importar Backup<input type="file" id="impBKP" accept=".json" hidden></label><button class="btnFull btnOutline" onclick="document.getElementById('mMenu').classList.remove('on')">Fechar</button></div></div>
<div id="mLeitor" class="modal"><div id="boxLeitor"><button id="btnSairFull" onclick="toggleFull()">✕ Sair</button><div id="barraTopo" style="padding:10px;border-bottom:1px solid var(--bord);display:flex;justify-content:space-between;background:var(--card);flex-wrap:wrap;gap:6px"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="fechar()">← Voltar</button><button class="btn" onclick="editarAtual()">✏️ Editar</button><button class="btn" onclick="excluirAtual()">🗑️</button><button class="btn" onclick="copiarCifra()">📋</button></div><div style="display:flex;gap:6px;align-items:center"><div id="ctrlAuto"><button onclick="ajustaVel(-1)">−</button><span id="labVel" style="font-size:12px;font-weight:800;min-width:44px;text-align:center">1x ▼</span><button onclick="ajustaVel(1)">+</button></div><button class="btn btn-black" id="bAuto" onclick="toggleAuto()">▶️ Auto</button><button class="btn btn-black" onclick="toggleFull()">⛶ Tela</button></div></div><div id="barraTom" style="padding:12px;background:var(--bg);border-bottom:1px solid var(--bord)"><div style="display:flex;justify-content:space-between;align-items:center"><span id="infTom" style="font-size:11px;opacity:.7"></span><div style="display:flex;gap:6px;align-items:center"><button class="btn" onclick="mFont(-2)">A-</button><span id="labF" style="font-size:11px">18px</span><button class="btn" onclick="mFont(2)">A+</button><button class="btn" id="bSimp" onclick="tSimp()">Simplif.</button></div></div><div class="tons" id="barTons"></div><div id="tTit" style="font-size:11px;opacity:.6;margin-top:4px"></div></div><div id="leitor"></div></div></div>
<div id="mNova" class="modal" onclick="if(event.target==this)fecharNova()"><div class="box"><h3 id="titNova">Nova música</h3><input id="nT" placeholder="Nome*"><input id="nA" placeholder="Artista"><select id="nEst" style="width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--bord);background:var(--bg);color:var(--text);font-weight:700;margin:6px 0;font-size:14px"><option value="">Escolha o estilo...</option><option>MPB</option><option>ROCK NACIONAL</option><option>ROCK INTERNACIONAL</option><option>FORRÓ</option><option>SERTANEJO</option><option>PAGODE</option><option>SAMBA</option><option>GOSPEL</option><option>POP</option><option>FUNK</option><option>REGGAE</option><option>BLUES</option><option>JAZZ</option><option>ESTILO DO MÚSICO</option></select><div style="font-size:11px;opacity:.6;margin-top:8px">REPERTÓRIOS</div><div class="repCheck" id="nReps"></div><textarea id="nC" rows="12" placeholder="Cifra..."></textarea><button class="btn btn-black" style="width:100%;padding:13px;background:#d97706;color:#fff;border:none;font-weight:800" onclick="salvar()">Salvar</button><button class="btn" style="width:100%;margin-top:8px" onclick="fecharNova()">Cancelar</button></div></div>
<script>
const $=id=>document.getElementById(id);
let pInst=null,instalou=false;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pInst=e;let b=$('btnInst');if(b){b.innerText='📲 INSTALAR AGORA';b.style.background='#22c55e';}});
window.addEventListener('appinstalled',()=>{instalou=true;let b=$('btnInst');if(b)b.innerText='✅ Instalado!';});
function instalarApp(){if(window.matchMedia('(display-mode: standalone)').matches||instalou){alert('Já instalado!');return;}if(pInst){pInst.prompt();}else{alert('No celular, clica nos 3 pontinhos > Instalar App. Só depois aparece no compartilhamento.');}}
function compartilharApp(){let u=location.href.split('?')[0];if(navigator.share)navigator.share({title:'Minhas Cifras',url:u});else{navigator.clipboard.writeText(u).then(()=>alert('Link copiado: '+u));}}
let temaAtual=localStorage.getItem('tema')||'claro';function setTema(t){temaAtual=t;localStorage.setItem('tema',t);if(t==='claro')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.temaBtn').forEach(b=>b.classList.remove('on'));let el=$('t-'+t);if(el)el.classList.add('on');}setTema(temaAtual);
const ESTILOS=['TODOS','MPB','ROCK NACIONAL','ROCK INTERNACIONAL','PAGODE','GOSPEL','FORRÓ','REGGAE','SAMBA','FUNK','SERTANEJO','POP','ESTILO DO MÚSICO','BLUES','JAZZ'];
function carregarDados(){
  let repsPadrao=["Minhas músicas","Louvor","Show Barzinho","Estudo","Favoritas"];
  let repsSalvos=null; let cifrasAchadas=[];
  let chavesReps=['reps','repertorios','listaReps'];
  for(let k of chavesReps){try{let v=localStorage.getItem(k); if(v){let a=JSON.parse(v); if(Array.isArray(a)&&a.length>0){repsSalvos=a; break;}}}catch{}}
  let chavesCifras=['cifrasV59','cifrasV60','cifrasV58','cifras','meu_cifras','backup_cifras','cifrasBackup'];
  for(let k of chavesCifras){try{let v=localStorage.getItem(k); if(!v) continue; let parsed=JSON.parse(v); let arr=null; if(Array.isArray(parsed)) arr=parsed; else if(parsed&&Array.isArray(parsed.cifras)) arr=parsed.cifras; else if(parsed&&Array.isArray(parsed.data)) arr=parsed.data; if(arr&&arr.length>0){cifrasAchadas=arr; if(parsed&&parsed.reps&&!repsSalvos) repsSalvos=parsed.reps; break;}}catch{}}
  return {reps: repsSalvos||repsPadrao, cifras: cifrasAchadas};
}
let dados=carregarDados();
let reps=dados.reps;
let cifras=dados.cifras;
let filtroRep='TODAS',filtroEst='TODOS',tom=0,origTxt='',acOrig='G',simp=false,fSize=18,auto=null,idAtual=null,modoEdicao=false,selReps=[],vel=1,modoVis='musicas',artistaAberto=null;
let save=()=>{localStorage.setItem('cifrasV59',JSON.stringify(cifras));localStorage.setItem('reps',JSON.stringify(reps));localStorage.setItem('fontSize',fSize);};
let fSalvo=parseInt(localStorage.getItem('fontSize')); if(fSalvo) fSize=fSalvo;
function buildTabs(){let h=`<button class="tab ${filtroRep=='TODAS'?'on':''}" onclick="setRep('TODAS')">🎸 Todas (${cifras.length})</button>`;reps.forEach((r,i)=>{let q=cifras.filter(c=>c.reps&&c.reps.includes(i)).length;h+=`<button class="tab ${filtroRep==i?'on':''}" onclick="setRep(${i})">📚 ${r} (${q})</button>`;});$('tabsRep').innerHTML=h;let eh='';ESTILOS.forEach(e=>{eh+=`<button class="chip ${filtroEst==e?'on':''}" onclick="setEst('${e}')">${e}</button>`;});$('filtEst').innerHTML=eh;$('menuEst').innerHTML=eh;$('editReps').innerHTML=reps.map((r,i)=>`<div class="repRow"><input id="r${i}" value="${r}"><button class="btnSalvar" onclick="renRep(${i})">Salvar</button></div>`).join('');}
function setRep(v){filtroRep=v;artistaAberto=null;buildTabs();render();}function setEst(v){filtroEst=v;buildTabs();render();$('mMenu').classList.remove('on');}
function renRep(i){reps[i]=$('r'+i).value||`Rep ${i+1}`;save();buildTabs();buildNovaReps();render();}
function setModo(m){modoVis=m;artistaAberto=null;$('bModMus').className=m=='musicas'?'btn btn-black':'btn';$('bModArt').className=m=='artistas'?'btn btn-black':'btn';render();}
function getFiltradas(){let b=$('busca').value.toLowerCase();return cifras.filter(c=>{let okB=!b||c.titulo.toLowerCase().includes(b)||(c.artista||'').toLowerCase().includes(b);let okR=filtroRep=='TODAS'||(c.reps&&c.reps.includes(filtroRep));let okE=filtroEst=='TODOS'||(c.estilo||'').toUpperCase()==filtroEst;return okB&&okR&&okE;});}
function render(){
 let f=getFiltradas();
 $('tot').innerText=f.length;
 if(!f.length){$('lista').innerHTML='<div style="padding:24px;text-align:center;opacity:.6">Nenhuma música</div>';return;}
 if(modoVis=='artistas'){
  let grupos={}; f.forEach(c=>{let a=(c.artista||'Sem artista').trim()||'Sem artista';if(!grupos[a])grupos[a]=[];grupos[a].push(c);});
  let artistas=Object.keys(grupos).sort();
  if(artistaAberto){
   let mus=grupos[artistaAberto]||[];let html=`<button class="btn" onclick="setModo('artistas')" style="margin-bottom:8px">← Voltar para Artistas</button><div style="font-weight:800;margin:8px 0">📁 ${artistaAberto} (${mus.length})</div>`;
   html+=mus.map(c=>`<div class="cifra"><div><b>${c.titulo}</b><div style="font-size:11px;opacity:.7">${c.estilo||''}</div></div><button class="ver" onclick="abrir(${c.id})">Ver</button></div>`).join('');
   $('lista').innerHTML=html;return;
  }
  let html='';artistas.forEach(a=>{html+=`<div class="pasta" onclick="abrirPasta('${a.replace(/'/g,"\\'")}')"><div><b>📁 ${a}</b><div style="font-size:11px;opacity:.6">${grupos[a].length} músicas</div></div><span>▶</span></div>`;});
  $('lista').innerHTML=html;
 }else{
  $('lista').innerHTML=f.map(c=>`<div class="cifra"><div><b>${c.titulo}</b><div style="font-size:11px;opacity:.7">${c.artista||''} • ${c.estilo||''}</div></div><button class="ver" onclick="abrir(${c.id})">Ver</button></div>`).join('');
 }
}
function abrirPasta(nome){artistaAberto=nome;render();}
function buildNovaReps(){$('nReps').innerHTML=reps.map((r,i)=>`<div class="repOpt" id="ro${i}" onclick="togRep(${i})">${r}</div>`).join('');}
function togRep(i){let el=$('ro'+i);if(selReps.includes(i)){selReps=selReps.filter(x=>x!=i);el.classList.remove('on');}else{selReps.push(i);el.classList.add('on');}}
function nova(){modoEdicao=false;selReps=[];$('titNova').innerText='Nova música';$('nT').value='';$('nA').value='';$('nC').value='';$('nEst').value='';buildNovaReps();$('mNova').classList.add('on');}
function fecharNova(){$('mNova').classList.remove('on');}
function salvar(){if(!$('nT').value.trim())return alert('Nome');if(modoEdicao){let c=cifras.find(x=>x.id==idAtual);c.titulo=$('nT').value.trim();c.artista=$('nA').value.trim();c.estilo=$('nEst').value;c.conteudo=$('nC').value;c.reps=[...selReps];}else{cifras.push({id:Date.now(),titulo:$('nT').value.trim(),artista:$('nA').value.trim(),estilo:$('nEst').value,reps:[...selReps],conteudo:$('nC').value});}save();fecharNova();buildTabs();render();}
function abrir(id){idAtual=id;let c=cifras.find(x=>x.id==id);origTxt=c.conteudo;tom=0;let m=c.conteudo.match(/[A-G][#b]?/);acOrig=m?m[0]:'G';$('tTit').innerText=`${c.titulo} • ${c.artista} • ${c.estilo}`;criaTons();$('mLeitor').classList.add('on');$('leitor').scrollTop=0;transp();}
function criaTons(){$('barTons').innerHTML='';for(let i=-5;i<=5;i++){let b=document.createElement('button');b.className=i==0?'tBtn on':'tBtn';b.innerText=(i>0?'+'+i:i);b.onclick=()=>{tom=i;updTons();transp();};$('barTons').appendChild(b);}updTons();}
function updTons(){[...$('barTons').children].forEach((b,idx)=>b.className=(idx-5)==tom?'tBtn on':'tBtn');$('infTom').innerText=`TOM ${acOrig} → ${transN(acOrig,tom)} (${tom})`;}
function transN(n,s){const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],M={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let b=M[n]||n;let i=N.indexOf(b);return i<0?n:N[(i+s+120)%12];}
let curTxt='';function transp(){const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],M={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};let t=origTxt.replace(/[A-G][#b]?/g,m=>{let b=M[m]||m;let i=N.indexOf(b);return i<0?m:N[(i+tom+120)%12];});if(simp){t=t.replace(/[A-G][#b]?m?(?:7M|maj7|m7|7|9|6|sus|dim|aug|add9|\(.*?\)|\/[\\w#b]+)*/g,a=>{let mm=a.match(/^([A-G][#b]?)(m)?/);return mm?mm[1]+(mm[2]||''):a;});}curTxt=t;show();}
function isChordToken(tok){if(!tok) return false; let t=tok.trim().replace(/^[()\[\]|]+|[()\[\]|,;.]+$/g,''); if(t.length===0||t.length>28) return false; if(t==='|'||t==='||') return true; if(!/^[A-G]/.test(t)) return false; if(t.length<=4 && /^[A-G][#b]?m?$/.test(t)) return true; return /^[A-G][#b]?m?(?:maj7|M7|m7|sus|dim|aug|add|b5|#5|b9|#9|#11|b13|6|7|9|11|13)/i.test(t) || /^[A-G][#b]?m?[0-9]+(\([0-9A-Za-z#b\/\-]+\))*(\/[A-G0-9#b]+)?/i.test(t) || /^[A-G][#b]?\(/.test(t);}
function isCifraLine(line){let l=line.trim(); if(!l) return false; if(l.startsWith('[')&&l.endsWith(']')) return false; let low=' '+l.toLowerCase()+' '; if(low.indexOf(' vou ')>=0||low.indexOf(' voce ')>=0||low.indexOf(' você ')>=0||low.indexOf(' fundo ')>=0||low.indexOf(' embora ')>=0||low.indexOf(' prefere ')>=0||low.indexOf(' sabe ')>=0||low.indexOf(' ficar ')>=0||low.indexOf(' quando ')>=0||low.indexOf(' tudo ')>=0||low.indexOf(' isso ')>=0||low.indexOf(' vamos ')>=0||low.indexOf(' sera ')>=0||low.indexOf(' será ')>=0||low.indexOf(' conseguir ')>=0) return false; let words=l.split(/\s+/).filter(Boolean); if(words.length===0) return false; let chordCount=0; for(let w of words){if(isChordToken(w)) chordCount++;} if(chordCount===0) return false; if(words.length<=4&&chordCount>=1) return true; if(chordCount/words.length>=0.5) return true; return false;}
function show(){let txt=curTxt||origTxt;let h='';let sLetra=fSize;let sCifra=Math.max(12,fSize-2);txt.split('\n').forEach(l=>{if(!l.trim()){h+='<div style="height:10px"></div>';return;}if(/^\[.*\]$/.test(l.trim())){h+=`<div style="font-weight:800;opacity:.7;margin:12px 0 6px;font-size:${sLetra-4}px;color:var(--text)">${l}</div>`;return;}if(isCifraLine(l)){h+=`<div class="cLine" style="font-size:${sCifra}px">${l}</div>`;}else{h+=`<div class="lLine" style="font-size:${sLetra}px">${l}</div>`;}});$('leitor').innerHTML=h;$('labF').innerText=fSize+'px';}
function fechar(){if(auto){clearInterval(auto);auto=null;$('bAuto').innerText='▶️ Auto';$('ctrlAuto').classList.remove('on');}$('mLeitor').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen();$('boxLeitor').classList.remove('fullscreen-ativo');$('btnSairFull').style.display='none';document.body.style.overflow='';}
function mFont(d){fSize=Math.max(12,Math.min(36,fSize+d));save();show();}
function tSimp(){simp=!simp;$('bSimp').className=simp?'btn btn-black':'btn';transp();}
function iniciaAuto(){if(auto) clearInterval(auto); if(vel===0){$('labVel').innerText='⏸️ 0'; return;} let tabela={1:380, 2:220, 3:130, 4:75, 5:38}; let intervalo=tabela[Math.abs(vel)]||380; auto=setInterval(()=>{let el=$('leitor'); if(vel>0) el.scrollTop+=1; else el.scrollTop-=1;}, intervalo);}
function toggleAuto(){if(auto && vel!==0){clearInterval(auto);auto=null;$('bAuto').innerText='▶️ Auto';$('ctrlAuto').classList.remove('on');}else{$('bAuto').innerText='⏸️ Parar';$('ctrlAuto').classList.add('on');if(vel===0) $('labVel').innerText='⏸️ 0'; else if(vel>0) $('labVel').innerText=vel+'x ▼'; else $('labVel').innerText=Math.abs(vel)+'x ▲'; iniciaAuto();}}
function ajustaVel(d){vel=Math.max(-5,Math.min(5,vel+d)); if(vel===0){$('labVel').innerText='⏸️ 0';} else if(vel>0){$('labVel').innerText=vel+'x ▼';} else {$('labVel').innerText=Math.abs(vel)+'x ▲';} if(auto) iniciaAuto();}
function exportar(){
 let dados={cifras,reps,versao:'v97',data:new Date().toISOString()};
 let json=JSON.stringify(dados,null,2);
 let blob=new Blob([json],{type:'application/json;charset=utf-8'});
 let url=URL.createObjectURL(blob);
 let a=document.createElement('a');
 a.href=url;
 a.download='minhas-cifras-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},800);
 alert('Backup baixado! '+cifras.length+' músicas salvas.');
}
function copiarCifra(){navigator.clipboard.writeText(curTxt||origTxt).then(()=>alert('Copiado!'));}
function toggleFull(){let b=$('boxLeitor'); let btn=$('btnSairFull'); if(!b.classList.contains('fullscreen-ativo')){b.classList.add('fullscreen-ativo'); try{if(b.requestFullscreen) b.requestFullscreen();}catch(e){} btn.style.display='block'; document.body.style.overflow='hidden';}else{b.classList.remove('fullscreen-ativo'); try{if(document.fullscreenElement) document.exitFullscreen();}catch(e){} btn.style.display='none'; document.body.style.overflow='';}}
function editarAtual(){let c=cifras.find(x=>x.id==idAtual);modoEdicao=true;$('titNova').innerText='Editar';$('nT').value=c.titulo;$('nA').value=c.artista;$('nEst').value=c.estilo||'';$('nC').value=c.conteudo;selReps=c.reps||[];buildNovaReps();setTimeout(()=>selReps.forEach(i=>{let el=$('ro'+i);if(el)el.classList.add('on');}),50);$('mLeitor').classList.remove('on');$('mNova').classList.add('on');}
function excluirAtual(){if(!confirm('Apagar?'))return;cifras=cifras.filter(x=>x.id!=idAtual);save();fechar();buildTabs();render();}
$('imp').addEventListener('change',e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{cifras.push({id:Date.now(),titulo:e.target.files[0].name.replace('.txt',''),artista:'IMPORTADA',estilo:'MPB',reps:[],conteudo:r.result});save();buildTabs();render();};r.readAsText(e.target.files[0]);});
$('impBKP').addEventListener('change',e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(j.cifras){cifras=j.cifras;reps=j.reps||reps;}else if(Array.isArray(j)) cifras=j; else cifras=j.data||j; save();buildTabs();render();alert('Importado! '+cifras.length+' músicas');}catch(err){alert('Inválido: '+err.message);}};r.readAsText(e.target.files[0]);});
function handleShare(){
 let p=new URLSearchParams(window.location.search);
 let title=p.get('title')||'';
 let text=p.get('text')||'';
 let url=p.get('url')||'';
 let conteudo = text || title || url || '';
 if(conteudo && conteudo.length>3){
  setTimeout(()=>{
    let nome = title? title.replace('Cifra Club','').trim() : 'Importada do Cifra Club';
    if(!text && url) conteudo = url;
    if(confirm('📲 Recebeu do Cifra Club!\n\n'+nome+'\n\nSalvar como nova cifra?')){
     $('nT').value=nome.substring(0,60);
     $('nA').value='';
     $('nC').value=conteudo;
     $('nEst').value='';
     selReps=[];buildNovaReps();$('mNova').classList.add('on');
    }
    history.replaceState({},'',location.pathname);
  },900);
 }
}
buildTabs();buildNovaReps();render();$('labF').innerText=fSize+'px';handleShare();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v97='+Date.now());
